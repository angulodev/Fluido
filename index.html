// ============================================================
// GRAMÁTICA — quizzes offline del banco integrado
// ============================================================
function Grammar({state, registerActivity}){
  const [card, setCard] = useState(null);
  const [picked, setPicked] = useState(null);
  const [total, setTotal] = useState(0);
  const [correct, setCorrect] = useState(0);
  const [trMap, setTrMap] = useState({}); // {q: "...", "opt1": "...", ...}
  const [trLoad, setTrLoad] = useState({}); // {q:true, opt1:true}
  const usedRef = React.useRef(new Set());
  const isA0 = state.level==="A0";

  // Qué niveles de pregunta son apropiados para cada nivel de usuario.
  // Incluye el propio nivel + uno de refuerzo por debajo. B2/C1 amplían hacia abajo
  // porque aún no hay banco propio de su nivel (se completará generando con IA).
  const LEVELS_FOR = {
    A0:["A0"], A2:["A0","A2"], B1:["A2","B1"],
    B2:["B1","B2"], C1:["B1","B2","C1"], C2:["B1","B2","C1","C2"],
  };
  const allowedLevels = LEVELS_FOR[state.level] || ["A2","B1"];

  const [genStatus, setGenStatus] = useState(null); // null | "needed" | "loading" | "done" | "error"

  const nextCard = useCallback(()=>{
    initInglesBank();
    const bank = loadBank();
    const byLevel = (bank.grammar||[]).filter(g=>allowedLevels.includes(g.lvl||"B1"));
    const source = byLevel.length ? byLevel : (bank.grammar||[]);
    const available = source.filter((_,i)=>!usedRef.current.has(i));
    if(available.length === 0){ usedRef.current.clear(); }
    const pool = source.filter((_,i)=>!usedRef.current.has(i));
    if(!pool.length){ setCard(null); return; }
    const idx = Math.floor(Math.random()*pool.length);
    const globalIdx = source.indexOf(pool[idx]);
    usedRef.current.add(globalIdx);
    const c = {...pool[idx]};
    c.shuffled = [...c.opts].sort(()=>Math.random()-0.5);
    setCard(c); setPicked(null); setTrMap({}); setTrLoad({});

    // Si el usuario es B2+ y casi no hay preguntas de su nivel exacto, ofrecer generar más con IA.
    if(["B2","C1","C2"].includes(state.level)){
      const exact = (bank.grammar||[]).filter(g=>g.lvl===state.level).length;
      setGenStatus(prev => exact < 8 ? "needed" : (prev==="needed" ? null : prev));
    } else {
      setGenStatus(null);
    }
  },[state.level]);

  const generateMoreForLevel = async()=>{
    setGenStatus("loading");
    try{
      const lvl = state.level;
      const arr = await askAI_JSON(
        `Genera 12 preguntas de gramática inglesa tipo opción múltiple, EXACTAMENTE de nivel ${lvl} según este criterio: ${levelInstruction(state)}\n\nVaría los temas gramaticales (no repitas la misma estructura en todas). Cada pregunta debe tener 4 opciones, solo una correcta. El "hint" es una explicación breve en español de la regla.\n\nDevuelve SOLO JSON array: [{"q":"oración con ___ para completar, o pregunta directa","opts":["op1","op2","op3","op4"],"ans":"la opción correcta exacta","hint":"explicación breve en español"}]`,
        "Eres un profesor de inglés experto en diseñar ejercicios de gramática para niveles avanzados."
      );
      const withLvl = arr.map(q=>({...q, lvl}));
      const bank = loadBank();
      bank.grammar = [...(bank.grammar||[]), ...withLvl];
      saveBank(bank);
      setGenStatus("done");
      usedRef.current.clear();
      nextCard();
    }catch(e){ setGenStatus("error"); }
  };

  const translateOne=(slot,text)=>{
    if(trMap[slot]||trLoad[slot]) return;
    const ck="fluido-tr1-"+text.slice(0,50).replace(/[^a-z0-9]/gi,"");
    try{const c=localStorage.getItem(ck);if(c){setTrMap(m=>({...m,[slot]:c}));return;}}catch(e){}
    setTrLoad(l=>({...l,[slot]:true}));
    askAI_JSON(
      `Traduce al espanol de forma breve y natural: "${text}"\nDevuelve JSON: {"es":"traduccion"}`,
      "Eres un traductor ingles-espanol."
    ).then(d=>{const t=d.es||"";setTrMap(m=>({...m,[slot]:t}));try{localStorage.setItem(ck,t);}catch(e){}})
     .catch(()=>setTrMap(m=>({...m,[slot]:"(no se pudo traducir)"})))
     .finally(()=>setTrLoad(l=>({...l,[slot]:false})));
  };

  useEffect(()=>{ usedRef.current.clear(); nextCard(); },[state.level]);

  const answer = (opt) => {
    if(picked!==null) return;
    setPicked(opt);
    const isRight = opt === card.ans;
    setTotal(t=>t+1);
    if(isRight) setCorrect(c=>c+1);
    recordQuizAnswer(state.level, isRight);
    registerActivity("grammar");
  };

  if(!card) return(
    <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:16,padding:20,textAlign:"center"}}>
      <p style={{fontWeight:600,color:C.green}}>✓ Gramática al día</p>
      <p style={{fontSize:14,color:C.inkSoft,marginTop:4}}>Vuelve mañana para más preguntas.</p>
    </div>
  );

  return(
    <div className="fadein">
      {genStatus==="needed"&&(
        <div className="fadein" style={{background:C.blueSoft,border:`1px solid ${C.blue}`,borderRadius:14,padding:14,marginBottom:14}}>
          <p style={{fontSize:13,color:C.ink,marginBottom:8}}>Quedan pocas preguntas de nivel {state.level} en el banco. ¿Genero más con IA?</p>
          <button onClick={generateMoreForLevel} style={{padding:"8px 14px",borderRadius:10,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:13}}>
            ✨ Generar 12 preguntas {state.level}
          </button>
        </div>
      )}
      {genStatus==="loading"&&<p style={{fontSize:13,color:C.inkSoft,marginBottom:14}}>Generando preguntas de nivel {state.level}…</p>}
      {genStatus==="error"&&<p style={{fontSize:13,color:C.coral,marginBottom:14}}>No pude generar preguntas nuevas. Intenta de nuevo desde Ajustes si tu clave de IA está bien configurada.</p>}
      {total>0&&<div style={{display:"flex",gap:10,marginBottom:14,fontSize:13,color:C.inkSoft}}>
        <span>Respondidas: {total}</span>
        <span style={{color:C.green}}>✓ {correct}</span>
        <span style={{color:C.coral}}>✗ {total-correct}</span>
      </div>}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18}}>
        <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Elige la opción correcta</p>
        <p style={{fontSize:19,fontWeight:600,lineHeight:1.4,marginBottom:isA0&&trMap.q?2:8,fontFamily:"'Newsreader',Georgia,serif"}}>{card.q}</p>
        {isA0&&trMap.q&&<p className="fadein" style={{fontSize:14,color:C.inkSoft,fontStyle:"italic",marginBottom:10}}>🇪🇸 {trMap.q}</p>}
        {isA0&&!trMap.q&&(
          <button onClick={()=>translateOne("q",card.q)} disabled={trLoad.q}
            style={{display:"inline-flex",alignItems:"center",gap:6,marginBottom:12,padding:"6px 11px",borderRadius:999,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:12}}>
            {trLoad.q?"Traduciendo…":"💡 Traducir pregunta"}
          </button>
        )}
        {card.shuffled.map((opt,i)=>{
          let bg=C.card, border=C.line, color=C.ink;
          if(picked!==null){
            if(opt===card.ans){bg=C.greenSoft;border=C.green;color=C.green;}
            else if(opt===picked){bg=C.coralSoft;border=C.coral;color=C.coral;}
          }
          const slot="o"+i;
          const optTr=isA0?trMap[slot]:null;
          return(
            <div key={i} style={{position:"relative",marginBottom:8}}>
              <button onClick={()=>answer(opt)}
                style={{display:"block",width:"100%",textAlign:"left",padding:"12px 44px 12px 14px",borderRadius:12,border:`1.5px solid ${border}`,background:bg,color,fontSize:15,fontWeight:opt===card.ans&&picked!==null?700:400}}>
                <span style={{fontFamily:"'Newsreader',Georgia,serif"}}>{opt}</span>
                {optTr&&<span style={{display:"block",fontSize:12,color:C.inkSoft,fontStyle:"italic",fontFamily:FUI,marginTop:2}}>🇪🇸 {optTr}</span>}
              </button>
              {isA0&&!optTr&&picked===null&&(
                <button onClick={(e)=>{e.stopPropagation();translateOne(slot,opt);}} disabled={trLoad[slot]} aria-label="Traducir opción"
                  style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",border:"none",background:"transparent",fontSize:17,opacity:trLoad[slot]?0.4:1}}>
                  💡
                </button>
              )}
            </div>);
        })}
        {picked!==null&&(
          <div className="fadein" style={{marginTop:8,padding:"10px 12px",background:C.paper,borderRadius:10,fontSize:13}}>
            {picked===card.ans
              ? <span style={{color:C.green,fontWeight:600}}>✓ ¡Correcto!</span>
              : <span style={{color:C.coral,fontWeight:600}}>✗ Era: <strong style={{fontFamily:"'Newsreader',Georgia,serif"}}>{card.ans}</strong></span>}
            {card.hint&&<span style={{color:C.inkSoft}}> — {card.hint}</span>}
          </div>
        )}
        {picked!==null&&(
          <button onClick={nextCard} className="fadein"
            style={{width:"100%",marginTop:12,padding:"13px 0",borderRadius:12,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:15}}>
            Siguiente pregunta →
          </button>
        )}
      </div>
    </div>
  );
}

// ============================================================
// VERBOS v2 — repaso espaciado + buscador + orden aleatorio
// ============================================================
function getVerbSRS(){try{return JSON.parse(localStorage.getItem("fluido-verbs-srs")||"{}");}catch(e){return{};}}
function setVerbSRS(s){try{localStorage.setItem("fluido-verbs-srs",JSON.stringify(s));}catch(e){}}
function verbKey(v){return (v.en||"").split(" / ")[0].toLowerCase().trim();}

function Verbs({registerActivity,state}){
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [current,setCurrent]=useState(null);
  const [flipped,setFlipped]=useState(false);
  const [,setTick]=useState(0);
  const {speak}=useSpeech();

  const bank=loadBank();
  const allVerbs=bank.verbs||[];
  const byFilter=filter==="all"?allVerbs:allVerbs.filter(v=>v.type===filter);

  const srsNow=getVerbSRS();
  const now=Date.now();
  const dueCount=byFilter.filter(v=>{const d=srsNow[verbKey(v)];return !d||d.due<=now;}).length;

  const pickRandom=useCallback((flt)=>{
    const f=flt||filter;
    const s=getVerbSRS();const n=Date.now();
    const base=f==="all"?allVerbs:allVerbs.filter(v=>v.type===f);
    const pool=base.filter(v=>{const d=s[verbKey(v)];return !d||d.due<=n;});
    if(!pool.length){setCurrent(null);setFlipped(false);return;}
    setCurrent(pool[Math.floor(Math.random()*pool.length)]);
    setFlipped(false);
  },[filter,allVerbs.length]);

  useEffect(()=>{ pickRandom(); },[]);

  const grade=(g)=>{
    if(!current)return;
    const s=getVerbSRS();const k=verbKey(current);
    const prev=s[k]||{interval:0,seen:0};
    const nx=srsNext(prev,g);
    s[k]={...nx,seen:(prev.seen||0)+1};
    setVerbSRS(s);setTick(t=>t+1);
    registerActivity("grammar");
    pickRandom();
  };

  const q=search.trim().toLowerCase();
  const matches=q?byFilter.filter(v=>v.en.toLowerCase().includes(q)||v.es.toLowerCase().includes(q)).slice(0,30):[];

  const renderCard=(card,withGrades)=>{
    const parts=(card.en||"").split(" / ");
    const tr=card.es.replace(/ \((irregular|regular)\)$/,"");
    const srsData=getVerbSRS()[verbKey(card)];
    return(
      <div style={{background:C.card,border:`1.5px solid ${card.type==="irregular"?C.coral:C.green}`,borderRadius:18,padding:22,minHeight:200,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:11,fontWeight:700,color:card.type==="irregular"?C.coral:C.green,textTransform:"uppercase",letterSpacing:1}}>
              {card.type==="irregular"?"Irregular ⚡":"Regular ✓"}
            </span>
            {srsData&&srsData.seen>0&&<span style={{fontSize:10,color:C.inkSoft}}>visto {srsData.seen}×</span>}
          </div>
          <p style={{fontSize:26,fontWeight:700,fontFamily:FEN,color:C.ink,margin:"8px 0 0"}}>{parts[0]}</p>
          <p style={{fontSize:15,color:C.inkSoft,margin:"2px 0 2px"}}>{tr}</p>
          {!flipped?(
            <p style={{fontSize:13,color:C.inkSoft,margin:"4px 0"}}>¿Recuerdas su conjugación? Dila en voz alta antes de voltear.</p>
          ):(
            <div className="fadein">
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:10}}>
                {[{l:"Infinitivo",v:parts[0]},{l:"Pasado",v:parts[1]},{l:"Participio",v:parts[2]}].map((p,i)=>p.v&&(
                  <div key={i} style={{minWidth:0,background:C.paper,borderRadius:10,padding:"8px 9px"}}>
                    <div style={{fontSize:9,color:C.inkSoft,textTransform:"uppercase",letterSpacing:0.5}}>{p.l}</div>
                    <div style={{fontSize:13.5,fontWeight:700,fontFamily:"'Newsreader',Georgia,serif",marginTop:3,wordBreak:"break-word",overflowWrap:"anywhere",lineHeight:1.15}}>{p.v}</div>
                    <button onClick={()=>speak(p.v)} style={{border:"none",background:"transparent",fontSize:13,marginTop:2,padding:0}}>🔊</button>
                  </div>))}
              </div>
              {card.note&&<p style={{fontSize:12,color:C.inkSoft,marginTop:10}}>💡 {card.note}</p>}
              <VerbExamples card={card} level={state?state.level:'B1'}/>
            </div>
          )}
        </div>
        {!flipped?(
          <BigButton onClick={()=>{setFlipped(true);if(!isSilent())speak(parts[0]);}}>Mostrar conjugación</BigButton>
        ):withGrades?(
          <div style={{display:"flex",gap:8,marginTop:16}}>
            <GradeBtn color={C.coral} bg={C.coralSoft} onClick={()=>grade("again")} label="Otra vez" sub="en 10 min"/>
            <GradeBtn color={C.blue} bg={C.blueSoft} onClick={()=>grade("good")} label="Bien" sub={`en ${Math.max(1,((getVerbSRS()[verbKey(card)]||{}).interval||0)*2)}d`}/>
            <GradeBtn color={C.green} bg={C.greenSoft} onClick={()=>grade("easy")} label="Fácil" sub={`en ${Math.max(3,((getVerbSRS()[verbKey(card)]||{}).interval||1)*3)}d`}/>
          </div>
        ):(
          <button onClick={()=>{setSearch("");pickRandom();}} style={{width:"100%",marginTop:14,padding:"11px 0",borderRadius:12,border:"none",background:C.blue,color:"#fff",fontWeight:600}}>Volver al repaso →</button>
        )}
      </div>
    );
  };

  return(
    <div className="fadein">
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        {[{id:"all",l:"Todos"},{id:"irregular",l:"Irregulares"},{id:"regular",l:"Regulares"}].map(f=>(
          <button key={f.id} onClick={()=>{setFilter(f.id);setSearch("");pickRandom(f.id);}}
            style={{flex:1,padding:"8px 4px",borderRadius:10,border:`1.5px solid ${filter===f.id?C.blue:C.line}`,background:filter===f.id?C.blueSoft:"transparent",color:filter===f.id?C.blue:C.inkSoft,fontWeight:600,fontSize:12}}>
            {f.l}
          </button>))}
      </div>
      <input value={search} onChange={e=>setSearch(e.target.value)}
        placeholder="🔍 Buscar verbo en inglés o español…"
        style={{width:"100%",padding:"11px 14px",fontSize:14,borderRadius:12,border:`1.5px solid ${C.line}`,outline:"none",background:C.card,color:C.ink,marginBottom:10}}/>

      {q?(
        <div className="fadein">
          <p style={{fontSize:12,color:C.inkSoft,marginBottom:8}}>{matches.length} resultado{matches.length!==1?"s":""}{matches.length===30?" (máx. 30)":""}</p>
          {current&&matches.length===0?null:matches.map((v,i)=>(
            <button key={i} onClick={()=>{setCurrent(v);setFlipped(false);setSearch("");}}
              style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",textAlign:"left",padding:"10px 14px",borderRadius:10,border:`1px solid ${C.line}`,background:C.card,marginBottom:6}}>
              <span>
                <strong style={{fontFamily:"'Newsreader',Georgia,serif",fontSize:15,color:C.ink}}>{v.en.split(" / ")[0]}</strong>
                <span style={{fontSize:13,color:C.inkSoft}}> — {v.es.replace(/ \((irregular|regular)\)$/,"")}</span>
              </span>
              <span style={{fontSize:9,fontWeight:700,color:v.type==="irregular"?C.coral:C.green,textTransform:"uppercase"}}>{v.type==="irregular"?"IRR":"REG"}</span>
            </button>))}
          {matches.length===0&&<p style={{fontSize:13,color:C.inkSoft,textAlign:"center",padding:14}}>Sin resultados para "{search}"</p>}
        </div>
      ):current?(
        <div>
          <p style={{fontSize:12,color:C.inkSoft,marginBottom:8}}>⏰ {dueCount} verbo{dueCount!==1?"s":""} por repasar · orden aleatorio</p>
          {renderCard(current,true)}
          <button onClick={()=>pickRandom()} style={{width:"100%",marginTop:10,background:"transparent",border:"none",color:C.inkSoft,fontSize:13,textDecoration:"underline"}}>🎲 Saltar este verbo</button>
        </div>
      ):(
        <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:16,padding:20,textAlign:"center"}}>
          <p style={{fontWeight:600,color:C.green,marginBottom:4}}>✓ Verbos al día</p>
          <p style={{fontSize:13,color:C.inkSoft}}>Repasaste todos los pendientes por ahora. Vuelve más tarde o usa el buscador para estudiar uno específico.</p>
        </div>
      )}
    </div>
  );
}

// ============================================================
// VOCABULARIO v2 — SRS + lista por bloque + contadores de pendientes
// ============================================================
function vocabLoadSrs(){try{return JSON.parse(localStorage.getItem("fluido-vocab-srs")||"{}");}catch(e){return{};}}
function vocabSaveSrs(m){try{localStorage.setItem("fluido-vocab-srs",JSON.stringify(m));}catch(e){}}
// Cupo de palabras NUEVAS por día — evita que "2.900 pendientes" desmotive
const VOCAB_NEW_PER_DAY=10;
function vocabNewToday(){try{const r=JSON.parse(localStorage.getItem("fluido-vocab-new")||"null");return r&&r.date===todayStr()?r.count:0;}catch(e){return 0;}}
function vocabBumpNew(){try{localStorage.setItem("fluido-vocab-new",JSON.stringify({date:todayStr(),count:vocabNewToday()+1}));}catch(e){}}

function Vocabulary({registerActivity,state}){
  const [block,setBlock]=useState(null);
  const [current,setCurrent]=useState(null);
  const [flipped,setFlipped]=useState(false);
  const [showList,setShowList]=useState(false);
  const [,setTick]=useState(0);
  const [examples,setExamples]=useState(null);
  const [loadingEx,setLoadingEx]=useState(false);
  const [exErr,setExErr]=useState(null);
  const [revealedEx,setRevealedEx]=useState({});
  const {speak}=useSpeech();

  const genExamples=async(word)=>{
    setExamples(null);setExErr(null);setLoadingEx(true);setRevealedEx({});
    const lvl=state?.level||"B1";
    const lvlDesc={A0:"principiante absoluto, frases de 3-6 palabras, vocabulario muy básico",A2:"básico, frases de 6-10 palabras, presente y pasado simple",B1:"intermedio, frases de 10-16 palabras, tiempos variados",B2:"avanzado, frases complejas con cláusulas, registro profesional",C1:"competente, frases sofisticadas, vocabulario amplio y natural"}[lvl]||"intermedio";
    try{
      const r=await askAI_JSON(
        `Genera 3 frases de ejemplo para la palabra "${word.en}" (en español: "${word.es}"). Nivel ${lvl} — ${lvlDesc}. Cada frase muestra la palabra en contexto natural. Devuelve SOLO JSON: {"examples":[{"en":"...","es":"..."},{"en":"...","es":"..."},{"en":"...","es":"..."}]}`,
        `Eres un profesor de inglés. Devuelve JSON con "examples": array de exactamente 3 objetos {en,es}.`
      );
      setExamples(r.examples||[]);
    }catch(e){setExErr(e.userMsg||"Error generando ejemplos. Revisa tu clave de IA en Ajustes.");}
    setLoadingEx(false);
  };

  const srsNow=vocabLoadSrs();
  const now=Date.now();
  const statsOf=(b)=>{let due=0,fresh=0;b.words.forEach(w=>{const d=srsNow[w.en.toLowerCase()];if(!d)fresh++;else if(d.due<=now)due++;});return{due,fresh};};

  const pick=(b,force)=>{
    const s=vocabLoadSrs();const n=Date.now();
    let pool;
    if(force){ pool=b.words; }
    else{
      pool=b.words.filter(w=>{const d=s[w.en.toLowerCase()];return d&&d.due<=n;});
      if(!pool.length&&vocabNewToday()<VOCAB_NEW_PER_DAY){
        pool=b.words.filter(w=>!s[w.en.toLowerCase()]);
      }
    }
    if(!pool.length){setCurrent(null);setFlipped(false);return;}
    setCurrent(pool[Math.floor(Math.random()*pool.length)]);setFlipped(false);
    setExamples(null);setExErr(null);setRevealedEx({});
  };

  const grade=(g)=>{
    if(!current||!block) return;
    const s=vocabLoadSrs();
    const k=current.en.toLowerCase();
    if(!s[k]) vocabBumpNew(); // palabra nueva: consume cupo diario
    const prev=s[k]||{interval:0,seen:0};
    const nx=srsNext(prev,g);
    s[k]={...nx,seen:(prev.seen||0)+1};
    vocabSaveSrs(s);setTick(t=>t+1);
    registerActivity("phrases");
    pick(block,false);
  };

  // ── Grid de bloques ──
  if(!block) return(
    <div className="fadein">
      <p style={{fontSize:14,color:C.inkSoft,marginBottom:12}}>2.921 palabras esenciales en 28 bloques. <span className="hl">Elige un tema</span> — las que marques como fáciles dejan de aparecer hasta que toque repasarlas.</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:8}}>
        {BANK_WORDS.map(b=>{
          const st=statsOf(b);
          const started=b.words.length-st.fresh;
          const done=started>0&&st.due===0;
          return(
            <button key={b.n} onClick={()=>{setBlock(b);setShowList(false);pick(b,false);}}
              style={{padding:"12px 10px",borderRadius:12,border:`1.5px solid ${done?C.green:C.line}`,background:C.card,textAlign:"left"}}>
              <div style={{fontSize:22}}>{b.icon}</div>
              <div style={{fontWeight:600,fontSize:13,marginTop:4,color:C.ink}}>{b.name}</div>
              <div style={{fontSize:11,color:done?C.green:C.inkSoft,fontWeight:done?700:400}}>
                {started===0?`🌱 ${b.words.length} palabras por descubrir`:done?"✓ Al día":`⏰ ${st.due} por repasar`}{started>0&&st.fresh>0&&<span style={{color:C.inkSoft,fontWeight:400}}> · ✨ {st.fresh} nuevas</span>}
              </div>
            </button>);
        })}
      </div>
    </div>
  );

  const blockStats=statsOf(block);
  const newLeft=Math.max(0,VOCAB_NEW_PER_DAY-vocabNewToday());

  // ── Vista de bloque ──
  return(
    <div className="fadein">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8}}>
        <button onClick={()=>{setBlock(null);setCurrent(null);}} style={{border:"none",background:"transparent",color:C.blue,fontSize:13,fontWeight:600,flexShrink:0}}>← Bloques</button>
        <span style={{fontSize:12,color:C.inkSoft,textAlign:"center"}}>{block.icon} {block.name}<br/>⏰ {blockStats.due} por repasar · ✨ {Math.min(blockStats.fresh,newLeft)} nuevas hoy</span>
        <button onClick={()=>setShowList(v=>!v)}
          style={{border:`1.5px solid ${C.blue}`,background:showList?C.blueSoft:"transparent",color:C.blue,fontSize:12,fontWeight:600,borderRadius:10,padding:"6px 10px",flexShrink:0}}>
          {showList?"🎴 Tarjetas":"📋 Lista"}
        </button>
      </div>

      {/* Lista completa del bloque */}
      {showList&&(
        <div className="fadein" style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,maxHeight:"55vh",overflowY:"auto",padding:"6px 0"}}>
          {block.words.map((w,i)=>{
            const d=srsNow[w.en.toLowerCase()];
            const learned=d&&d.due>now;
            return(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",borderBottom:i<block.words.length-1?`1px solid ${C.line}`:"none"}}>
                <div>
                  <span style={{fontSize:14,color:C.ink}}>{w.es}</span>
                  <span style={{fontSize:14,color:C.inkSoft}}> — </span>
                  <span style={{fontFamily:"'Newsreader',Georgia,serif",fontSize:15,fontWeight:600,color:C.ink}}>{w.en}</span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                  {learned&&<span style={{fontSize:11,color:C.green}}>✓</span>}
                  <button onClick={()=>speak(w.en)} style={{border:"none",background:"transparent",fontSize:15}}>🔊</button>
                </div>
              </div>);
          })}
        </div>
      )}

      {/* Modo tarjetas con SRS */}
      {!showList&&(
        current?(
          <div className="fadein" style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:18,padding:24,minHeight:200,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
            <div style={{textAlign:"center"}}>
              <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5}}>{flipped?"En inglés":"¿Cómo se dice…?"}</p>
              <p style={{fontSize:28,fontWeight:700,margin:"14px 0 6px",color:C.ink}}>{current.es}</p>
              {flipped&&(
                <p className="fadein" style={{fontSize:30,fontFamily:"'Newsreader',Georgia,serif",margin:"4px 0"}}>
                  <span className="hl">{current.en}</span>
                  <button onClick={()=>speak(current.en)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:22,marginLeft:8}}>🔊</button>
                </p>
              )}
            </div>
            {!flipped?(
              <BigButton onClick={()=>{setFlipped(true);if(!isSilent())speak(current.en);}}>Mostrar en inglés</BigButton>
            ):(
              <>
              <div style={{display:"flex",gap:8,marginTop:16}}>
                <GradeBtn color={C.coral} bg={C.coralSoft} onClick={()=>grade("again")} label="Otra vez" sub="en 10 min"/>
                <GradeBtn color={C.blue} bg={C.blueSoft} onClick={()=>grade("good")} label="Bien" sub="días"/>
                <GradeBtn color={C.green} bg={C.greenSoft} onClick={()=>grade("easy")} label="Fácil" sub="más días"/>
              </div>
              <PronounceCheck target={current.en}/>
              <button onClick={()=>{setExamples(null);setExErr(null);genExamples(current);}}
                disabled={loadingEx}
                style={{marginTop:12,width:"100%",padding:"10px 0",borderRadius:12,border:`1.5px solid ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:14,opacity:loadingEx?0.6:1}}>
                {loadingEx?"⏳ Generando frases…":"✨ Ver frases de ejemplo"}
              </button>
              {exErr&&<p style={{fontSize:12,color:C.coral,marginTop:8,textAlign:"center"}}>{exErr}</p>}
              {examples&&(
                <div className="fadein" style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
                  {examples.map((ex,i)=>{
                    const isA0=state?.level==="A0";
                    const shown=isA0||revealedEx[i];
                    return(
                      <div key={i} style={{background:C.bg,border:`1px solid ${C.line}`,borderRadius:12,padding:"10px 14px"}}>
                        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
                          <p style={{margin:0,fontFamily:"Newsreader,Georgia,serif",fontSize:15,fontWeight:600,color:C.ink,lineHeight:1.4,flex:1}}>{ex.en}</p>
                          <button onClick={()=>speak(ex.en)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:17,flexShrink:0,lineHeight:1}}>🔊</button>
                        </div>
                        {shown?(
                          <p style={{margin:"4px 0 0",fontSize:13,color:C.inkSoft,lineHeight:1.4}}>{ex.es}</p>
                        ):(
                          <button onClick={()=>setRevealedEx(r=>({...r,[i]:true}))}
                            style={{marginTop:6,border:"none",background:"transparent",color:C.blue,fontSize:12,textDecoration:"underline",padding:0}}>
                            Ver traducción
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
              </>
            )}
          </div>
        ):(
          <div className="fadein" style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:16,padding:20,textAlign:"center"}}>
            <p style={{fontWeight:600,color:C.green,marginBottom:4}}>✓ Bloque al día</p>
            <p style={{fontSize:13,color:C.inkSoft,marginBottom:12}}>{blockStats.fresh>0&&newLeft===0?`Completaste tus ${VOCAB_NEW_PER_DAY} palabras nuevas de hoy 🎉. Mañana se desbloquean más — así tu memoria las retiene de verdad.`:"Dominaste las palabras pendientes de hoy. Vuelve mañana o repasa extra."}</p>
            <button onClick={()=>pick(block,true)}
              style={{padding:"10px 18px",borderRadius:12,border:`1.5px solid ${C.green}`,background:"transparent",color:C.green,fontWeight:600,fontSize:14}}>
              🎲 Repasar una al azar igual
            </button>
          </div>
        )
      )}
    </div>
  );
}

// ============================================================
// EJEMPLOS DE USO PARA VERBOS — generados por IA, guardados localmente
// ============================================================
function VerbExamples({card,level}){
  const inf=(card.en||"").split(" / ")[0];
  const storeKey="fluido-vex-"+(level||"B1")+"-"+inf.replace(/[^a-z]/gi,"");
  const [ex,setEx]=useState(()=>{try{return JSON.parse(localStorage.getItem(storeKey)||"null");}catch(e){return null;}});
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState(null);
  const {speak}=useSpeech();

  const load=async()=>{
    setLoading(true);setErr(null);
    try{
      const data=await askAI_JSON(
        `Verbo en inglés: "${card.en}" — significa "${card.es}". Genera 3 ejemplos de uso, uno por cada forma: presente, pasado simple, y participio (con have/has). ${LEVEL_GUIDE[level]||LEVEL_GUIDE.B1} Los ejemplos deben tener EXACTAMENTE esa complejidad de vocabulario y gramática.\nDevuelve JSON: {"examples":[{"form":"Presente","en":"frase","es":"traducción"},{"form":"Pasado","en":"...","es":"..."},{"form":"Participio","en":"...","es":"..."}]}`,
        "Eres un profesor de inglés práctico.");
      const arr=data.examples||[];
      setEx(arr);
      try{localStorage.setItem(storeKey,JSON.stringify(arr));}catch(e){}
    }catch(e){setErr(e.userMsg||"No pude generar ejemplos. Intenta de nuevo.");}
    setLoading(false);
  };

  if(!ex) return(
    <div style={{marginTop:12}}>
      <button onClick={load} disabled={loading}
        style={{width:"100%",padding:"10px 0",borderRadius:10,border:`1.5px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:13,opacity:loading?0.6:1}}>
        {loading?"Generando ejemplos…":"✨ Ver ejemplos de uso"}
      </button>
      {err&&<p style={{color:C.coral,fontSize:12,marginTop:6}}>{err}</p>}
    </div>
  );
  return(
    <div className="fadein" style={{marginTop:12,background:C.paper,borderRadius:10,padding:"10px 12px"}}>
      {ex.map((e,i)=>(
        <p key={i} style={{margin:"0 0 10px",fontSize:13,lineHeight:1.5}}>
          <span style={{fontSize:10,color:C.blue,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>{e.form}</span><br/>
          <span style={{fontFamily:"'Newsreader',Georgia,serif",fontSize:15}}>{e.en}</span>
          <button onClick={()=>speak(e.en)} style={{border:"none",background:"transparent",fontSize:13,marginLeft:4}}>🔊</button><br/>
          <span style={{color:C.inkSoft,fontStyle:"italic",fontSize:12}}>🇪🇸 {e.es}</span>
        </p>
      ))}
    </div>
  );
}

function BigButton({children,onClick,disabled}){
  return<button onClick={onClick} disabled={disabled} style={{width:"100%",padding:"15px 18px",borderRadius:16,border:"none",background:C.blue,color:"#fff",fontWeight:700,fontSize:16,opacity:disabled?0.5:1,boxShadow:disabled?"none":`0 8px 20px ${C.blue}55`}}>{children}</button>;
}
