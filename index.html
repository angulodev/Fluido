// EDITOR DE PERFIL (usado desde Settings)
// ============================================================
function ProfileEditor({state,save,onClose}){
  const p=state.profile||{};
  const e=p.extra||{};
  const [name,setName]=useState(p.name||"");
  const [role,setRole]=useState(p.role||"");
  const [goals,setGoals]=useState(p.goals||[]);
  const [interests,setInterests]=useState(p.interests||[]);
  const [level,setLevel]=useState(state.level||"B1");
  const [nickname,setNickname]=useState(e.nickname||"");
  const [gender,setGender]=useState(e.gender||"");
  const [age,setAge]=useState(e.age?String(e.age):"");
  const [livingWith,setLivingWith]=useState(e.livingWith||"");
  const [hobbies,setHobbies]=useState(e.hobbies||"");
  const [reason,setReason]=useState(e.reason||"");
  const [section,setSection]=useState("basic"); // "basic" | "extra"

  const toggle=(list,setList,item)=>setList(list.includes(item)?list.filter(x=>x!==item):[...list,item]);
  const iStyle={width:"100%",marginTop:6,padding:"12px 14px",fontSize:15,borderRadius:12,border:`1.5px solid ${C.line}`,background:C.card,color:C.ink,outline:"none"};
  const taStyle={...iStyle,resize:"vertical",minHeight:72};

  const handleSave=()=>{
    const extra=(nickname||gender||age||livingWith||hobbies||reason)?{
      nickname:nickname.trim()||null,gender:gender||null,age:age?parseInt(age):null,
      livingWith:livingWith||null,hobbies:hobbies.trim()||null,reason:reason.trim()||null
    }:null;
    save({...state,level,profile:{...p,name:name.trim()||p.name,role:role.trim()||p.role,goals,interests,extra}});
    onClose();
  };

  return(
    <div className="fadein" style={{background:C.card,border:`1.5px solid ${C.blue}`,borderRadius:16,padding:18,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <p style={{fontWeight:700,fontSize:16}}>✏️ Editar perfil</p>
        <button onClick={onClose} style={{border:"none",background:"transparent",color:C.inkSoft,fontSize:20,lineHeight:1}}>×</button>
      </div>
      {/* Tabs */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[{id:"basic",label:"📋 Básico"},{id:"extra",label:"✨ Extra"}].map(t=>(
          <button key={t.id} onClick={()=>setSection(t.id)}
            style={{flex:1,padding:"10px 0",borderRadius:10,border:`1.5px solid ${section===t.id?C.blue:C.line}`,background:section===t.id?C.blueSoft:"transparent",color:section===t.id?C.blue:C.inkSoft,fontWeight:600,fontSize:13}}>
            {t.label}
          </button>))}
      </div>

      {section==="basic"&&(
        <div className="fadein" style={{display:"flex",flexDirection:"column",gap:12}}>
          <div><label style={{fontSize:13,color:C.inkSoft}}>Nombre</label><input value={name} onChange={e=>setName(e.target.value)} style={iStyle}/></div>
          <div><label style={{fontSize:13,color:C.inkSoft}}>¿A qué te dedicas?</label><input value={role} onChange={e=>setRole(e.target.value)} placeholder="Consultor, estudiante…" style={iStyle}/></div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>¿Para qué necesitas el inglés?</label>
            <div style={{marginTop:8}}><ChipGrid options={GOAL_OPTIONS} selected={goals} onToggle={o=>toggle(goals,setGoals,o)}/></div>
          </div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>Temas de interés</label>
            <div style={{marginTop:8}}><ChipGrid options={INTEREST_OPTIONS} selected={interests} onToggle={o=>toggle(interests,setInterests,o)}/></div>
          </div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>Nivel</label>
            <div style={{display:"flex",gap:8,marginTop:6}}>
              {LEVELS.map(lv=>(
                <button key={lv.id} onClick={()=>setLevel(lv.id)}
                  style={{flex:1,padding:"10px 6px",borderRadius:10,border:`2px solid ${level===lv.id?C.blue:C.line}`,background:level===lv.id?C.blueSoft:C.card,color:level===lv.id?C.blue:C.inkSoft,fontWeight:600,fontSize:13}}>
                  {lv.label}
                </button>))}
            </div>
          </div>
        </div>
      )}

      {section==="extra"&&(
        <div className="fadein" style={{display:"flex",flexDirection:"column",gap:12}}>
          <p style={{fontSize:13,color:C.inkSoft,marginTop:-4}}>Todo opcional. Más info = escenarios más personales.</p>
          <div><label style={{fontSize:13,color:C.inkSoft}}>¿Cómo prefieren llamarte?</label><input value={nickname} onChange={e=>setNickname(e.target.value)} placeholder="Apodo, pronombres…" style={iStyle}/></div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>Género</label>
            <div style={{marginTop:8}}><ChipGrid options={GENDER_OPTIONS} selected={gender?[gender]:[]} onToggle={o=>setGender(gender===o?"":o)}/></div>
          </div>
          <div><label style={{fontSize:13,color:C.inkSoft}}>Edad</label><input type="number" value={age} onChange={e=>setAge(e.target.value)} placeholder="Opcional" min="10" max="99" style={{...iStyle,width:"100px"}}/></div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>¿Con quién vives?</label>
            <div style={{marginTop:8}}><ChipGrid options={LIVING_OPTIONS} selected={livingWith?[livingWith]:[]} onToggle={o=>setLivingWith(livingWith===o?"":o)}/></div>
          </div>
          <div><label style={{fontSize:13,color:C.inkSoft}}>¿Qué te gusta hacer?</label><textarea value={hobbies} onChange={e=>setHobbies(e.target.value)} placeholder="Guitarra, fútbol, hiking, gaming…" style={taStyle}/></div>
          <div><label style={{fontSize:13,color:C.inkSoft}}>¿Por qué quieres aprender inglés?</label><textarea value={reason} onChange={e=>setReason(e.target.value)} placeholder="Tu historia y motivación…" style={taStyle}/></div>
        </div>
      )}

      <button onClick={handleSave}
        style={{width:"100%",marginTop:16,padding:"13px 0",borderRadius:12,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:15}}>
        Guardar cambios
      </button>
    </div>
  );
}

// ============================================================
// AJUSTES — con selector de tema
// ============================================================
function Settings({state,save,onAIChanged,onThemeChange}){
  const [expanded,setExpanded]=useState(null);
  const [editKeys,setEditKeys]=useState({});
  const [testState,setTestState]=useState({});
  const [editingProfile,setEditingProfile]=useState(false);
  const savedTheme=getSavedTheme();

  const cfg=getAIConfig()||{active:null,keys:{}};
  const savedKeys=cfg.keys||{};
  const setTS=(pid,val)=>setTestState(t=>({...t,[pid]:val}));
  const getKey=pid=>editKeys[pid]!==undefined?editKeys[pid]:(savedKeys[pid]||"");

  const handleTest=async(pid)=>{
    const key=getKey(pid).trim();
    if(!key){setTS(pid,{error:"Ingresa tu clave primero."});return;}
    setTS(pid,{testing:true});
    try{
      await pingProvider(pid,key);
      setTS(pid,{ok:true});
      setAIConfig({active:cfg.active||pid,keys:{...savedKeys,[pid]:key}});
    }catch(e){setTS(pid,{error:e.userMsg||e.message||"Error de conexión."});}
  };
  const handleActivate=pid=>{
    const key=getKey(pid).trim(); if(!key) return;
    setAIConfig({active:pid,keys:{...savedKeys,[pid]:key}});onAIChanged();
  };
  const handleDisconnect=()=>{
    if(!window.confirm("¿Desconectar la IA?")) return;
    localStorage.removeItem(AI_KEY);localStorage.removeItem("fluido-ai");onAIChanged();
  };
  const resetProfile=()=>{if(!window.confirm("¿Rehacer el cuestionario? Tu racha y mazo se mantienen.")) return;save({...state,profile:null});};
  const resetAll=()=>{if(!window.confirm("⚠️ Borra TODO incluyendo claves y progreso. ¿Seguro?")) return;localStorage.clear();window.location.reload();};
  const activeProv=PROVIDERS.find(p=>p.id===cfg.active);

  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:14}}>Ajustes</h2>

      {/* --- TEMA --- */}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:14}}>
        <p style={{fontWeight:600,marginBottom:4}}>🎨 Tema y apariencia</p>
        <p style={{fontSize:13,color:C.inkSoft,marginBottom:12}}>Elige un estilo — se guarda automáticamente.</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {THEMES.map(t=>{
            const selected=savedTheme===t.id;
            return(
              <button key={t.id} onClick={()=>onThemeChange(t.id)}
                style={{borderRadius:12,border:`2px solid ${selected?t.preview:"transparent"}`,padding:"10px 4px",background:t.dark?"#1E293B":"#FFFFFF",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:5,boxShadow:selected?`0 0 0 3px ${t.preview}44`:"none"}}>
                {/* preview strip */}
                <div style={{width:36,height:20,borderRadius:6,background:`linear-gradient(135deg, ${t.dark?"#0F172A":"#F7F9FB"} 50%, ${t.preview} 50%)`}}/>
                <span style={{fontSize:9,fontWeight:600,color:t.dark?"#F1F5F9":"#13243B",lineHeight:1.2,textAlign:"center"}}>{t.label}</span>
                {selected&&<span style={{fontSize:9,color:t.preview,fontWeight:700}}>✓</span>}
              </button>);
          })}
        </div>
      </div>

      {/* --- NIVEL --- */}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:14}}>
        <p style={{fontWeight:600,marginBottom:4}}>🎯 Tu nivel de inglés</p>
        <p style={{fontSize:13,color:C.inkSoft,marginBottom:12}}>Define la dificultad de todos los ejercicios.</p>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {LEVELS.map(lv=>(
            <button key={lv.id} onClick={()=>save({...state,level:lv.id})}
              style={{flex:"1 1 45%",padding:"10px 6px",borderRadius:12,border:`2px solid ${state.level===lv.id?C.blue:C.line}`,background:state.level===lv.id?C.blueSoft:"transparent",color:state.level===lv.id?C.blue:C.inkSoft,fontWeight:600,fontSize:13}}>
              {lv.label}<div style={{fontSize:10,fontWeight:400,marginTop:2}}>{lv.desc}</div>
            </button>))}
        </div>
      </div>

      {/* --- PERFIL --- */}
      {editingProfile?(
        <ProfileEditor state={state} save={save} onClose={()=>setEditingProfile(false)}/>
      ):(
        <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:16,marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <p style={{fontWeight:600,fontSize:15}}>👤 Tu perfil</p>
            <button onClick={()=>setEditingProfile(true)}
              style={{padding:"6px 12px",borderRadius:8,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:13}}>
              ✏️ Editar
            </button>
          </div>
          <div style={{fontSize:13,color:C.inkSoft,lineHeight:1.8}}>
            <span style={{color:C.ink,fontWeight:500}}>{state.profile.name}</span> · {state.profile.role}<br/>
            <span>Objetivos: {(state.profile.goals||[]).join(", ")||"—"}</span><br/>
            <span>Intereses: {(state.profile.interests||[]).join(", ")||"—"}</span>
            {state.profile.extra&&(<><br/><span style={{color:C.blue,fontSize:12}}>✨ Perfil extendido activo</span></>)}
          </div>
        </div>
      )}

      {/* --- IA ACTIVA --- */}
      {activeProv?(
        <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:14,padding:"12px 16px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:11,color:C.green,textTransform:"uppercase",letterSpacing:1,fontWeight:600}}>IA activa</div>
            <div style={{fontWeight:700,fontSize:16,marginTop:2}}>{activeProv.emoji} {activeProv.name}</div>
          </div>
          <button onClick={handleDisconnect} style={{border:"none",background:"transparent",color:C.coral,fontSize:13,fontWeight:600}}>Desconectar</button>
        </div>
      ):(
        <div style={{background:C.coralSoft,border:`1px solid ${C.coral}`,borderRadius:14,padding:"12px 16px",marginBottom:14}}>
          <p style={{color:C.coral,fontWeight:600,margin:0}}>Sin IA configurada — expande un proveedor para conectar.</p>
        </div>
      )}
      {/* Toggle de respaldo automático */}
      {activeProv&&(
        <button onClick={()=>{
            const newVal = cfg.fallback === false ? true : false;
            setAIConfig({...cfg, fallback:newVal});
            onAIChanged();
          }}
          style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"12px 16px",marginBottom:14,textAlign:"left"}}>
          <div>
            <div style={{fontWeight:600,fontSize:14,color:C.ink}}>🔁 Respaldo automático</div>
            <div style={{fontSize:12,color:C.inkSoft,marginTop:2}}>Si {activeProv.name} falla o llega al límite, Fluido usa automáticamente los otros proveedores que tengas configurados.</div>
          </div>
          <div style={{width:44,height:26,borderRadius:13,background:cfg.fallback!==false?C.green:C.line,position:"relative",flexShrink:0,marginLeft:10,transition:"background .2s"}}>
            <div style={{width:20,height:20,borderRadius:"50%",background:"#fff",position:"absolute",top:3,left:cfg.fallback!==false?21:3,transition:"left .2s"}}/>
          </div>
        </button>
      )}
      <p style={{fontSize:12,color:C.inkSoft,marginBottom:12,lineHeight:1.6}}>🔐 Tus claves se guardan <strong>solo en este navegador</strong>. Cada usuario configura las suyas al abrir la app por primera vez.</p>

      {/* --- PROVEEDORES --- */}
      {PROVIDERS.map(p=>{
        const isActive=cfg.active===p.id;
        const savedKey=savedKeys[p.id]||"";
        const displayKey=getKey(p.id);
        const ts=testState[p.id]||{};
        const isExpanded=expanded===p.id;
        const hasValidKey=ts.ok||(savedKey&&editKeys[p.id]===undefined);
        return(
          <div key={p.id} style={{background:C.card,border:`1.5px solid ${isActive?C.green:C.line}`,borderRadius:14,marginBottom:10,overflow:"hidden"}}>
            <button onClick={()=>setExpanded(isExpanded?null:p.id)}
              style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",border:"none",background:"transparent",textAlign:"left"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:24}}>{p.emoji}</span>
                <div>
                  <div style={{fontWeight:600,fontSize:14,color:C.ink}}>{p.name}</div>
                  <span style={{fontSize:10,fontWeight:700,color:p.tagColor}}>{p.tag}</span>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {isActive&&<span style={{fontSize:10,fontWeight:700,color:C.green,background:C.greenSoft,padding:"3px 8px",borderRadius:999}}>ACTIVO</span>}
                {savedKey&&!isActive&&<span style={{fontSize:11,color:C.inkSoft}}>✓ Config</span>}
                <span style={{color:C.inkSoft,fontSize:14}}>{isExpanded?"▲":"▼"}</span>
              </div>
            </button>
            {isExpanded&&(
              <div className="fadein" style={{padding:"0 16px 16px",borderTop:`1px solid ${C.line}`}}>
                <div style={{background:C.paper,borderRadius:10,padding:10,fontSize:13,lineHeight:1.8,margin:"12px 0"}}>
                  {p.helpSteps.map((s,i)=><div key={i}>{i+1}. {s}</div>)}
                  <a href={p.helpUrl} target="_blank" rel="noreferrer" style={{color:C.blue,fontWeight:600}}>→ {p.helpUrl.replace("https://","")}</a>
                </div>
                <input type="password" value={displayKey}
                  onChange={e=>{setEditKeys(k=>({...k,[p.id]:e.target.value}));setTS(p.id,{});}}
                  placeholder={p.keyPlaceholder}
                  style={{width:"100%",padding:"12px 14px",fontSize:15,borderRadius:12,border:`1.5px solid ${ts.ok?C.green:ts.error?C.coral:C.line}`,outline:"none",background:C.card,color:C.ink}}/>
                {ts.error&&<p style={{color:C.coral,fontSize:13,marginTop:6}}>❌ {ts.error}</p>}
                {ts.ok&&<p style={{color:C.green,fontSize:13,marginTop:6}}>✓ Conexión exitosa</p>}
                <div style={{display:"flex",gap:8,marginTop:10}}>
                  <button onClick={()=>handleTest(p.id)} disabled={ts.testing||!displayKey.trim()}
                    style={{flex:1,padding:"10px 0",borderRadius:10,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:14,opacity:ts.testing||!displayKey.trim()?0.5:1}}>
                    {ts.testing?"Probando…":"⚡ Probar"}
                  </button>
                  {!isActive&&<button onClick={()=>handleActivate(p.id)} disabled={!hasValidKey}
                    style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",background:hasValidKey?C.blue:C.line,color:"#fff",fontWeight:600,fontSize:14,opacity:hasValidKey?1:0.5}}>
                    Activar
                  </button>}
                  {isActive&&<button disabled style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",background:C.greenSoft,color:C.green,fontWeight:600,fontSize:14}}>✓ Activa</button>}
                </div>
              </div>
            )}
          </div>);
      })}

      {/* --- DATOS --- */}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginTop:6}}>
        <p style={{fontWeight:600,marginBottom:10}}>Perfil y datos</p>
        <button onClick={resetProfile} style={{width:"100%",padding:"12px 16px",borderRadius:12,border:`1.5px solid ${C.line}`,background:"transparent",color:C.ink,fontWeight:500,marginBottom:8}}>Rehacer cuestionario inicial</button>
        <button onClick={resetAll} style={{width:"100%",padding:"12px 16px",borderRadius:12,border:`1.5px solid ${C.coral}`,background:C.coralSoft,color:C.coral,fontWeight:600}}>⚠️ Borrar todo y empezar de cero</button>
      </div>
      <p style={{fontSize:11,color:C.inkSoft,marginTop:16,textAlign:"center"}}>Fluido v5 · hecho desde Chile 🇨🇱</p>
    </div>
  );
}


// ============================================================
// GRAMÁTICA — quizzes offline del banco integrado
// ============================================================
function Grammar({state, registerActivity}){
  const [card, setCard] = useState(null);
  const [picked, setPicked] = useState(null);
  const [total, setTotal] = useState(0);
  const [correct, setCorrect] = useState(0);
  const usedRef = React.useRef(new Set());

  const nextCard = useCallback(()=>{
    initInglesBank(); // garantiza que el banco esté listo
    const bank = loadBank();
    const available = (bank.grammar||[]).filter((_,i)=>!usedRef.current.has(i));
    if(available.length === 0){ usedRef.current.clear(); }
    const pool = (bank.grammar||[]).filter((_,i)=>!usedRef.current.has(i));
    if(!pool.length){ setCard(null); return; }
    const idx = Math.floor(Math.random()*pool.length);
    const globalIdx = (bank.grammar||[]).indexOf(pool[idx]);
    usedRef.current.add(globalIdx);
    // shuffle options
    const c = {...pool[idx]};
    c.shuffled = [...c.opts].sort(()=>Math.random()-0.5);
    setCard(c); setPicked(null);
  },[]);

  useEffect(()=>{ nextCard(); },[]);

  const answer = (opt) => {
    if(picked!==null) return;
    setPicked(opt);
    const isRight = opt === card.ans;
    setTotal(t=>t+1);
    if(isRight) setCorrect(c=>c+1);
    registerActivity("grammar");
  };

  if(!card) return(
    <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:16,padding:20,textAlign:"center"}}>
      <p style={{fontWeight:600,color:C.green}}>✓ Gramática al día</p>
      <p style={{fontSize:14,color:C.inkSoft,marginTop:4}}>Vuelve mañana para más preguntas.</p>
    </div>
  );

  return(
    <div className="fadein">
      {total>0&&<div style={{display:"flex",gap:10,marginBottom:14,fontSize:13,color:C.inkSoft}}>
        <span>Respondidas: {total}</span>
        <span style={{color:C.green}}>✓ {correct}</span>
        <span style={{color:C.coral}}>✗ {total-correct}</span>
      </div>}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18}}>
        <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Elige la opción correcta</p>
        <p style={{fontSize:19,fontWeight:600,lineHeight:1.4,marginBottom:16,fontFamily:"'Newsreader',Georgia,serif"}}>{card.q.replace("___","___")}</p>
        {card.shuffled.map((opt,i)=>{
          let bg=C.card, border=C.line, color=C.ink;
          if(picked!==null){
            if(opt===card.ans){bg=C.greenSoft;border=C.green;color=C.green;}
            else if(opt===picked){bg=C.coralSoft;border=C.coral;color=C.coral;}
          }
          return(
            <button key={i} onClick={()=>answer(opt)}
              style={{display:"block",width:"100%",textAlign:"left",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${border}`,background:bg,color,fontSize:15,marginBottom:8,fontWeight:opt===card.ans&&picked!==null?700:400,fontFamily:"'Newsreader',Georgia,serif"}}>
              {opt}
            </button>);
        })}
        {picked!==null&&(
          <div className="fadein" style={{marginTop:8,padding:"10px 12px",background:C.paper,borderRadius:10,fontSize:13}}>
            {picked===card.ans
              ? <span style={{color:C.green,fontWeight:600}}>✓ ¡Correcto!</span>
              : <span style={{color:C.coral,fontWeight:600}}>✗ Era: <strong style={{fontFamily:"'Newsreader',Georgia,serif"}}>{card.ans}</strong></span>}
            {card.hint&&<span style={{color:C.inkSoft}}> — {card.hint}</span>}
          </div>
        )}
        {picked!==null&&(
          <button onClick={nextCard} className="fadein"
            style={{width:"100%",marginTop:12,padding:"13px 0",borderRadius:12,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:15}}>
            Siguiente pregunta →
          </button>
        )}
      </div>
    </div>
  );
}

// ============================================================
// VERBOS v2 — repaso espaciado + buscador + orden aleatorio
// ============================================================
function getVerbSRS(){try{return JSON.parse(localStorage.getItem("fluido-verbs-srs")||"{}");}catch(e){return{};}}
function setVerbSRS(s){try{localStorage.setItem("fluido-verbs-srs",JSON.stringify(s));}catch(e){}}
function verbKey(v){return (v.en||"").split(" / ")[0].toLowerCase().trim();}

function Verbs({registerActivity}){
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [current,setCurrent]=useState(null);
  const [flipped,setFlipped]=useState(false);
  const [,setTick]=useState(0);
  const {speak}=useSpeech();

  const bank=loadBank();
  const allVerbs=bank.verbs||[];
  const byFilter=filter==="all"?allVerbs:allVerbs.filter(v=>v.type===filter);

  const srsNow=getVerbSRS();
  const now=Date.now();
  const dueCount=byFilter.filter(v=>{const d=srsNow[verbKey(v)];return !d||d.due<=now;}).length;

  const pickRandom=useCallback((flt)=>{
    const f=flt||filter;
    const s=getVerbSRS();const n=Date.now();
    const base=f==="all"?allVerbs:allVerbs.filter(v=>v.type===f);
    const pool=base.filter(v=>{const d=s[verbKey(v)];return !d||d.due<=n;});
    if(!pool.length){setCurrent(null);setFlipped(false);return;}
    setCurrent(pool[Math.floor(Math.random()*pool.length)]);
    setFlipped(false);
  },[filter,allVerbs.length]);

  useEffect(()=>{ pickRandom(); },[]);

  const grade=(g)=>{
    if(!current)return;
    const s=getVerbSRS();const k=verbKey(current);
    const prev=s[k]||{interval:0,seen:0};
    const interval=g==="again"?0:g==="good"?Math.max(1,(prev.interval||0)*2):Math.max(3,(prev.interval||1)*3);
    const due=g==="again"?Date.now()+10*60*1000:Date.now()+interval*86400000;
    s[k]={interval,due,seen:(prev.seen||0)+1};
    setVerbSRS(s);setTick(t=>t+1);
    registerActivity("grammar");
    pickRandom();
  };

  const q=search.trim().toLowerCase();
  const matches=q?byFilter.filter(v=>v.en.toLowerCase().includes(q)||v.es.toLowerCase().includes(q)).slice(0,30):[];

  const renderCard=(card,withGrades)=>{
    const parts=(card.en||"").split(" / ");
    const tr=card.es.replace(/ \((irregular|regular)\)$/,"");
    const srsData=getVerbSRS()[verbKey(card)];
    return(
      <div style={{background:C.card,border:`1.5px solid ${card.type==="irregular"?C.coral:C.green}`,borderRadius:18,padding:22,minHeight:200,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:11,fontWeight:700,color:card.type==="irregular"?C.coral:C.green,textTransform:"uppercase",letterSpacing:1}}>
              {card.type==="irregular"?"Irregular ⚡":"Regular ✓"}
            </span>
            {srsData&&srsData.seen>0&&<span style={{fontSize:10,color:C.inkSoft}}>visto {srsData.seen}×</span>}
          </div>
          <p style={{fontSize:20,fontWeight:700,color:C.ink,margin:"8px 0 2px"}}>{tr}</p>
          {!flipped?(
            <p style={{fontSize:13,color:C.inkSoft,margin:"4px 0"}}>¿Recuerdas su conjugación? Dila en voz alta antes de voltear.</p>
          ):(
            <div className="fadein">
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:10}}>
                {[{l:"Infinitivo",v:parts[0]},{l:"Pasado",v:parts[1]},{l:"Participio",v:parts[2]}].map((p,i)=>p.v&&(
                  <div key={i} style={{flex:1,minWidth:80,background:C.paper,borderRadius:10,padding:"8px 10px"}}>
                    <div style={{fontSize:10,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1}}>{p.l}</div>
                    <div style={{fontSize:17,fontWeight:700,fontFamily:"'Newsreader',Georgia,serif",marginTop:2}}>{p.v}
                      <button onClick={()=>speak(p.v)} style={{border:"none",background:"transparent",fontSize:14,marginLeft:4}}>🔊</button>
                    </div>
                  </div>))}
              </div>
              {card.note&&<p style={{fontSize:12,color:C.inkSoft,marginTop:10}}>💡 {card.note}</p>}
              <VerbExamples card={card}/>
            </div>
          )}
        </div>
        {!flipped?(
          <BigButton onClick={()=>{setFlipped(true);speak(parts[0]);}}>Mostrar conjugación</BigButton>
        ):withGrades?(
          <div style={{display:"flex",gap:8,marginTop:16}}>
            <GradeBtn color={C.coral} bg={C.coralSoft} onClick={()=>grade("again")} label="Otra vez" sub="en 10 min"/>
            <GradeBtn color={C.blue} bg={C.blueSoft} onClick={()=>grade("good")} label="Bien" sub={`en ${Math.max(1,((getVerbSRS()[verbKey(card)]||{}).interval||0)*2)}d`}/>
            <GradeBtn color={C.green} bg={C.greenSoft} onClick={()=>grade("easy")} label="Fácil" sub={`en ${Math.max(3,((getVerbSRS()[verbKey(card)]||{}).interval||1)*3)}d`}/>
          </div>
        ):(
          <button onClick={()=>{setSearch("");pickRandom();}} style={{width:"100%",marginTop:14,padding:"11px 0",borderRadius:12,border:"none",background:C.blue,color:"#fff",fontWeight:600}}>Volver al repaso →</button>
        )}
      </div>
    );
  };

  return(
    <div className="fadein">
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        {[{id:"all",l:"Todos"},{id:"irregular",l:"Irregulares"},{id:"regular",l:"Regulares"}].map(f=>(
          <button key={f.id} onClick={()=>{setFilter(f.id);setSearch("");pickRandom(f.id);}}
            style={{flex:1,padding:"8px 4px",borderRadius:10,border:`1.5px solid ${filter===f.id?C.blue:C.line}`,background:filter===f.id?C.blueSoft:"transparent",color:filter===f.id?C.blue:C.inkSoft,fontWeight:600,fontSize:12}}>
            {f.l}
          </button>))}
      </div>
      <input value={search} onChange={e=>setSearch(e.target.value)}
        placeholder="🔍 Buscar verbo en inglés o español…"
        style={{width:"100%",padding:"11px 14px",fontSize:14,borderRadius:12,border:`1.5px solid ${C.line}`,outline:"none",background:C.card,color:C.ink,marginBottom:10}}/>

      {q?(
        <div className="fadein">
          <p style={{fontSize:12,color:C.inkSoft,marginBottom:8}}>{matches.length} resultado{matches.length!==1?"s":""}{matches.length===30?" (máx. 30)":""}</p>
          {current&&matches.length===0?null:matches.map((v,i)=>(
            <button key={i} onClick={()=>{setCurrent(v);setFlipped(false);setSearch("");}}
              style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",textAlign:"left",padding:"10px 14px",borderRadius:10,border:`1px solid ${C.line}`,background:C.card,marginBottom:6}}>
              <span>
                <strong style={{fontFamily:"'Newsreader',Georgia,serif",fontSize:15,color:C.ink}}>{v.en.split(" / ")[0]}</strong>
                <span style={{fontSize:13,color:C.inkSoft}}> — {v.es.replace(/ \((irregular|regular)\)$/,"")}</span>
              </span>
              <span style={{fontSize:9,fontWeight:700,color:v.type==="irregular"?C.coral:C.green,textTransform:"uppercase"}}>{v.type==="irregular"?"IRR":"REG"}</span>
            </button>))}
          {matches.length===0&&<p style={{fontSize:13,color:C.inkSoft,textAlign:"center",padding:14}}>Sin resultados para "{search}"</p>}
        </div>
      ):current?(
        <div>
          <p style={{fontSize:12,color:C.inkSoft,marginBottom:8}}>⏰ {dueCount} verbo{dueCount!==1?"s":""} por repasar · orden aleatorio</p>
          {renderCard(current,true)}
          <button onClick={()=>pickRandom()} style={{width:"100%",marginTop:10,background:"transparent",border:"none",color:C.inkSoft,fontSize:13,textDecoration:"underline"}}>🎲 Saltar este verbo</button>
        </div>
      ):(
        <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:16,padding:20,textAlign:"center"}}>
          <p style={{fontWeight:600,color:C.green,marginBottom:4}}>✓ Verbos al día</p>
          <p style={{fontSize:13,color:C.inkSoft}}>Repasaste todos los pendientes por ahora. Vuelve más tarde o usa el buscador para estudiar uno específico.</p>
        </div>
      )}
    </div>
  );
}

// VOCABULARIO v2 — SRS + lista por bloque + contadores de pendientes
// ============================================================
function vocabLoadSrs(){try{return JSON.parse(localStorage.getItem("fluido-vocab-srs")||"{}");}catch(e){return{};}}
function vocabSaveSrs(m){try{localStorage.setItem("fluido-vocab-srs",JSON.stringify(m));}catch(e){}}

function Vocabulary({registerActivity}){
  const [block,setBlock]=useState(null);
  const [current,setCurrent]=useState(null);
  const [flipped,setFlipped]=useState(false);
  const [showList,setShowList]=useState(false);
  const [,setTick]=useState(0);
  const {speak}=useSpeech();

  const srsNow=vocabLoadSrs();
  const now=Date.now();
  const dueOf=(b)=>b.words.filter(w=>{const d=srsNow[w.en.toLowerCase()];return !d||d.due<=now;}).length;

  const pick=(b,force)=>{
    const s=vocabLoadSrs();const n=Date.now();
    const pool=force?b.words:b.words.filter(w=>{const d=s[w.en.toLowerCase()];return !d||d.due<=n;});
    if(!pool.length){setCurrent(null);setFlipped(false);return;}
    setCurrent(pool[Math.floor(Math.random()*pool.length)]);setFlipped(false);
  };

  const grade=(g)=>{
    if(!current||!block) return;
    const s=vocabLoadSrs();
    const k=current.en.toLowerCase();
    const prev=s[k]||{interval:0,seen:0};
    let interval=g==="again"?0:g==="good"?Math.max(1,(prev.interval||0)*2):Math.max(3,(prev.interval||1)*3);
    const dueTs=g==="again"?Date.now()+10*60*1000:Date.now()+interval*86400000;
    s[k]={interval,due:dueTs,seen:(prev.seen||0)+1};
    vocabSaveSrs(s);setTick(t=>t+1);
    registerActivity("phrases");
    pick(block,false);
  };

  // ── Grid de bloques ──
  if(!block) return(
    <div className="fadein">
      <p style={{fontSize:14,color:C.inkSoft,marginBottom:12}}>2.921 palabras esenciales en 28 bloques. <span className="hl">Elige un tema</span> — las que marques como fáciles dejan de aparecer hasta que toque repasarlas.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {BANK_WORDS.map(b=>{
          const due=dueOf(b);
          const done=due===0;
          return(
            <button key={b.n} onClick={()=>{setBlock(b);setShowList(false);pick(b,false);}}
              style={{padding:"12px 10px",borderRadius:12,border:`1.5px solid ${done?C.green:C.line}`,background:C.card,textAlign:"left"}}>
              <div style={{fontSize:22}}>{b.icon}</div>
              <div style={{fontWeight:600,fontSize:13,marginTop:4,color:C.ink}}>{b.name}</div>
              <div style={{fontSize:11,color:done?C.green:C.inkSoft,fontWeight:done?700:400}}>
                {done?"✓ Al día":`⏰ ${due}/${b.words.length} por repasar`}
              </div>
            </button>);
        })}
      </div>
    </div>
  );

  const blockDue=dueOf(block);

  // ── Vista de bloque ──
  return(
    <div className="fadein">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8}}>
        <button onClick={()=>{setBlock(null);setCurrent(null);}} style={{border:"none",background:"transparent",color:C.blue,fontSize:13,fontWeight:600,flexShrink:0}}>← Bloques</button>
        <span style={{fontSize:12,color:C.inkSoft,textAlign:"center"}}>{block.icon} {block.name}<br/>⏰ {blockDue} por repasar</span>
        <button onClick={()=>setShowList(v=>!v)}
          style={{border:`1.5px solid ${C.blue}`,background:showList?C.blueSoft:"transparent",color:C.blue,fontSize:12,fontWeight:600,borderRadius:10,padding:"6px 10px",flexShrink:0}}>
          {showList?"🎴 Tarjetas":"📋 Lista"}
        </button>
      </div>

      {/* Lista completa del bloque */}
      {showList&&(
        <div className="fadein" style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,maxHeight:"55vh",overflowY:"auto",padding:"6px 0"}}>
          {block.words.map((w,i)=>{
            const d=srsNow[w.en.toLowerCase()];
            const learned=d&&d.due>now;
            return(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",borderBottom:i<block.words.length-1?`1px solid ${C.line}`:"none"}}>
                <div>
                  <span style={{fontSize:14,color:C.ink}}>{w.es}</span>
                  <span style={{fontSize:14,color:C.inkSoft}}> — </span>
                  <span style={{fontFamily:"'Newsreader',Georgia,serif",fontSize:15,fontWeight:600,color:C.ink}}>{w.en}</span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                  {learned&&<span style={{fontSize:11,color:C.green}}>✓</span>}
                  <button onClick={()=>speak(w.en)} style={{border:"none",background:"transparent",fontSize:15}}>🔊</button>
                </div>
              </div>);
          })}
        </div>
      )}

      {/* Modo tarjetas con SRS */}
      {!showList&&(
        current?(
          <div className="fadein" style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:18,padding:24,minHeight:200,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
            <div style={{textAlign:"center"}}>
              <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5}}>{flipped?"En inglés":"¿Cómo se dice…?"}</p>
              <p style={{fontSize:28,fontWeight:700,margin:"14px 0 6px",color:C.ink}}>{current.es}</p>
              {flipped&&(
                <p className="fadein" style={{fontSize:30,fontFamily:"'Newsreader',Georgia,serif",margin:"4px 0"}}>
                  <span className="hl">{current.en}</span>
                  <button onClick={()=>speak(current.en)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:22,marginLeft:8}}>🔊</button>
                </p>
              )}
            </div>
            {!flipped?(
              <BigButton onClick={()=>{setFlipped(true);speak(current.en);}}>Mostrar en inglés</BigButton>
            ):(
              <div style={{display:"flex",gap:8,marginTop:16}}>
                <GradeBtn color={C.coral} bg={C.coralSoft} onClick={()=>grade("again")} label="Otra vez" sub="en 10 min"/>
                <GradeBtn color={C.blue} bg={C.blueSoft} onClick={()=>grade("good")} label="Bien" sub="días"/>
                <GradeBtn color={C.green} bg={C.greenSoft} onClick={()=>grade("easy")} label="Fácil" sub="más días"/>
              </div>
            )}
          </div>
        ):(
          <div className="fadein" style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:16,padding:20,textAlign:"center"}}>
            <p style={{fontWeight:600,color:C.green,marginBottom:4}}>✓ Bloque al día</p>
            <p style={{fontSize:13,color:C.inkSoft,marginBottom:12}}>Dominaste las palabras pendientes de hoy. Vuelve mañana o repasa extra.</p>
            <button onClick={()=>pick(block,true)}
              style={{padding:"10px 18px",borderRadius:12,border:`1.5px solid ${C.green}`,background:"transparent",color:C.green,fontWeight:600,fontSize:14}}>
              🎲 Repasar una al azar igual
            </button>
          </div>
        )
      )}
    </div>
  );
}

// ============================================================
// EJEMPLOS DE USO PARA VERBOS — generados por IA, guardados localmente
// ============================================================
function VerbExamples({card}){
  const inf=(card.en||"").split(" / ")[0];
  const storeKey="fluido-vex-"+inf.replace(/[^a-z]/gi,"");
  const [ex,setEx]=useState(()=>{try{return JSON.parse(localStorage.getItem(storeKey)||"null");}catch(e){return null;}});
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState(null);
  const {speak}=useSpeech();

  const load=async()=>{
    setLoading(true);setErr(null);
    try{
      const data=await askAI_JSON(
        `Verbo en inglés: "${card.en}" — significa "${card.es}". Genera 3 ejemplos de uso cortos y cotidianos, uno por cada forma: presente, pasado simple, y participio (con have/has).\nDevuelve JSON: {"examples":[{"form":"Presente","en":"frase corta","es":"traducción"},{"form":"Pasado","en":"...","es":"..."},{"form":"Participio","en":"...","es":"..."}]}`,
        "Eres un profesor de inglés práctico.");
      const arr=data.examples||[];
      setEx(arr);
      try{localStorage.setItem(storeKey,JSON.stringify(arr));}catch(e){}
    }catch(e){setErr(e.userMsg||"No pude generar ejemplos. Intenta de nuevo.");}
    setLoading(false);
  };

  if(!ex) return(
    <div style={{marginTop:12}}>
      <button onClick={load} disabled={loading}
        style={{width:"100%",padding:"10px 0",borderRadius:10,border:`1.5px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:13,opacity:loading?0.6:1}}>
        {loading?"Generando ejemplos…":"✨ Ver ejemplos de uso"}
      </button>
      {err&&<p style={{color:C.coral,fontSize:12,marginTop:6}}>{err}</p>}
    </div>
  );
  return(
    <div className="fadein" style={{marginTop:12,background:C.paper,borderRadius:10,padding:"10px 12px"}}>
      {ex.map((e,i)=>(
        <p key={i} style={{margin:"0 0 10px",fontSize:13,lineHeight:1.5}}>
          <span style={{fontSize:10,color:C.blue,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>{e.form}</span><br/>
          <span style={{fontFamily:"'Newsreader',Georgia,serif",fontSize:15}}>{e.en}</span>
          <button onClick={()=>speak(e.en)} style={{border:"none",background:"transparent",fontSize:13,marginLeft:4}}>🔊</button><br/>
          <span style={{color:C.inkSoft,fontStyle:"italic",fontSize:12}}>🇪🇸 {e.es}</span>
        </p>
      ))}
    </div>
  );
}

function BigButton({children,onClick,disabled}){
  return<button onClick={onClick} disabled={disabled} style={{width:"100%",padding:"14px 18px",borderRadius:14,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:16,opacity:disabled?0.5:1}}>{children}</button>;
}

// Inicializar banco antes del primer render
initInglesBank();
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
