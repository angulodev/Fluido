// ---------- Config de IA ----------
const AI_KEY = "fluido-ai-v2";

function getAIConfig() {
  try { return JSON.parse(localStorage.getItem(AI_KEY) || "null"); } catch (e) { return null; }
}
function setAIConfig(cfg) { localStorage.setItem(AI_KEY, JSON.stringify(cfg)); }

function migrateOldConfig() {
  try {
    if (localStorage.getItem(AI_KEY)) return;
    const old = JSON.parse(localStorage.getItem("fluido-ai") || "null");
    if (old && old.key) {
      const keys = {}; PROVIDERS.forEach(p => keys[p.id] = "");
      keys[old.provider || "gemini"] = old.key;
      setAIConfig({ active: old.provider || "gemini", keys });
      localStorage.removeItem("fluido-ai");
    }
  } catch (e) {}
}

function isAIReady() {
  migrateOldConfig();
  const cfg = getAIConfig();
  return !!(cfg && cfg.active && cfg.keys && cfg.keys[cfg.active]);
}

// ---------- Llamadas a la IA ----------
function cleanJSON(text) {
  let t = (text || "").replace(/```json|```/g, "").trim();
  const o = t.indexOf("{"); const a = t.indexOf("[");
  if (a !== -1 && (a < o || o === -1)) return t.slice(a, t.lastIndexOf("]") + 1);
  if (o !== -1) return t.slice(o, t.lastIndexOf("}") + 1);
  return t;
}

async function callGemini(key, sys, prompt) {
  const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
  let lastErr = null;
  for (const model of models) {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
      { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
          systemInstruction:{ parts:[{ text:sys }] },
          contents:[{ parts:[{ text:prompt }] }],
          generationConfig:{ responseMimeType:"application/json", temperature:0.9 },
        }),
      }
    );
    const data = await res.json();
    if (data.error) {
      const msg = data.error.message || "";
      if (res.status === 404 || /not found|not supported|deprecated/i.test(msg)) { lastErr = new Error(msg); continue; }
      const e = new Error(msg); e.code = "API";
      if (/api key not valid|API_KEY_INVALID|invalid api key/i.test(msg) || [400,401,403].includes(res.status)) {
        e.code = "BAD_KEY"; e.userMsg = "Clave de Gemini inválida. Debe empezar con AIza… — créala en aistudio.google.com/apikey";
      } else if (res.status === 429) {
        e.code = "RATE"; e.userMsg = "Límite de Gemini alcanzado. Espera un momento e intenta de nuevo.";
      } else { e.userMsg = "Error de Gemini: " + msg; }
      throw e;
    }
    const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("\n");
    return JSON.parse(cleanJSON(text));
  }
  const e = lastErr || new Error("Sin modelos Gemini"); e.code = "API"; e.userMsg = "Ningún modelo de Gemini respondió. Intenta más tarde."; throw e;
}

async function callOpenAICompat(baseUrl, key, models, sys, prompt, extraHeaders = {}) {
  const arr = Array.isArray(models) ? models : [models];
  let lastErr = null;
  for (const model of arr) {
    const res = await fetch(`${baseUrl}/chat/completions`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${key}`, ...extraHeaders },
      body: JSON.stringify({
        model,
        messages:[{ role:"system", content:sys },{ role:"user", content:prompt }],
        temperature:0.9,
        response_format:{ type:"json_object" },
      }),
    });
    const data = await res.json();
    if (data.error) {
      const msg = String(data.error.message || data.error.code || data.error);
      if (/not found|deprecated|does not exist|no endpoints/i.test(msg)) { lastErr = new Error(msg); continue; }
      const e = new Error(msg); e.code = "API";
      if (res.status === 401 || /invalid.*key|unauthorized|api_key/i.test(msg.toLowerCase())) {
        e.code = "BAD_KEY"; e.userMsg = `Clave inválida para ${PROVIDERS.find(p => p.id === (baseUrl.includes("groq") ? "groq" : baseUrl.includes("openrouter") ? "openrouter" : "deepseek"))?.name || baseUrl}. Revisa que la copiaste completa.`;
      } else if (res.status === 429) {
        e.code = "RATE"; e.userMsg = "Límite de uso alcanzado. Espera un momento.";
      } else if (/credit|balance|quota/i.test(msg)) {
        e.code = "NO_CREDITS"; e.userMsg = "Sin créditos en este proveedor.";
      } else { e.userMsg = "Error: " + msg; }
      throw e;
    }
    return JSON.parse(cleanJSON(data.choices?.[0]?.message?.content || "{}"));
  }
  const e = lastErr || new Error("Sin modelos disponibles"); e.code = "API"; e.userMsg = "Ningún modelo respondió. Intenta más tarde."; throw e;
}

async function callAnthropic(key, sys, prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json", "x-api-key":key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true",
    },
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000, system:sys, messages:[{ role:"user", content:prompt }] }),
  });
  const data = await res.json();
  if (data.error) {
    const msg = data.error.message || ""; const e = new Error(msg); e.code = "API";
    if (/credit balance|too low/i.test(msg)) { e.code = "NO_CREDITS"; e.userMsg = "Tu cuenta de Anthropic no tiene créditos. Compra en console.anthropic.com o usa Gemini (gratis)."; }
    else if (res.status === 401) { e.code = "BAD_KEY"; e.userMsg = "Clave de Anthropic inválida (debe empezar con sk-ant-…)."; }
    else { e.userMsg = "Error de Anthropic: " + msg; }
    throw e;
  }
  return JSON.parse(cleanJSON((data.content || []).filter(b => b.type==="text").map(b => b.text).join("\n")));
}

async function callAI(providerId, key, sys, prompt) {
  switch (providerId) {
    case "gemini":     return callGemini(key, sys, prompt);
    case "groq":       return callOpenAICompat("https://api.groq.com/openai/v1", key, ["llama-3.3-70b-versatile","llama3-70b-8192","gemma2-9b-it"], sys, prompt);
    case "openrouter": return callOpenAICompat("https://openrouter.ai/api/v1", key, ["qwen/qwen3-235b-a22b:free","qwen/qwen-2.5-72b-instruct:free","meta-llama/llama-3.3-70b-instruct:free","deepseek/deepseek-chat:free"], sys, prompt, { "HTTP-Referer":"https://angulodev.github.io/fluido","X-Title":"Fluido English Trainer" });
    case "deepseek":   return callOpenAICompat("https://api.deepseek.com/v1", key, ["deepseek-chat"], sys, prompt);
    case "anthropic":  return callAnthropic(key, sys, prompt);
    default: { const e = new Error("NO_KEY"); e.code = "NO_KEY"; throw e; }
  }
}

const pad = n => String(n).padStart(2,"0");

  profile:null, level:"B1", streak:0, lastActive:null,

function loadState() {
  let s = null; try { s = JSON.parse(localStorage.getItem("fluido-state")||"null"); } catch(e) {}
  s = s ? {...DEFAULT_STATE,...s} : {...DEFAULT_STATE};
  if (!s.daily || s.daily.date !== todayStr()) s.daily = {date:todayStr(),talk:0,phrases:0,listen:0};
  if (!s.usedListening) s.usedListening = [];
  return s;
}
function persist(s) { try { localStorage.setItem("fluido-state", JSON.stringify(s)); } catch(e) {} }

// ---------- Hook de voz (TTS) ----------
function useSpeech() {
  const [voices, setVoices] = useState([]);
  const supported = typeof window !== "undefined" && "speechSynthesis" in window;
  const [failed, setFailed] = useState(!supported);
  useEffect(() => {
    if (!supported) return;
    const load = () => { const v = window.speechSynthesis.getVoices().filter(v => v.lang?.toLowerCase().startsWith("en")); if (v.length) setVoices(v); };
    load(); window.speechSynthesis.onvoiceschanged = load;
    const t1=setTimeout(load,500); const t2=setTimeout(load,2000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [supported]);
  const speak = useCallback((lines, opts) => {
    const { rate=0.9, onEnd } = opts || {};
    if (!supported) { setFailed(true); onEnd&&onEnd(); return; }
    const synth = window.speechSynthesis;
    try {
      synth.cancel(); synth.resume();
      const arr = Array.isArray(lines) ? lines : [{line:lines}];
      arr.forEach((d,i) => {
        const u = new SpeechSynthesisUtterance(d.line||d); u.lang="en-US"; u.rate=rate;
        if (voices.length) u.voice = voices[i % Math.min(2,voices.length)];
        if (i===arr.length-1 && onEnd) u.onend=onEnd;
        synth.speak(u);
      });
      setTimeout(() => { if (!synth.speaking&&!synth.pending){setFailed(true);onEnd&&onEnd();}else setFailed(false); }, 1200);
    } catch(e) { setFailed(true); onEnd&&onEnd(); }
  }, [supported,voices]);
  const stop = useCallback(() => { try{window.speechSynthesis.cancel();}catch(e){} },[]);
  return { speak, stop, failed, supported };
}

function App() {
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState("home");
  const [aiReady, setAiReady] = useState(() => isAIReady());

  const save = useCallback((next) => { setState(next); persist(next); }, []);
  const handleAIChanged = useCallback(() => setAiReady(isAIReady()), []);

  const registerActivity = useCallback((block, extra) => {
    setState(prev => {
      const next = {...prev,...(extra||{})};
      const today = todayStr();
      next.daily = next.daily.date!==today ? {date:today,talk:0,phrases:0,listen:0} : {...next.daily};
      next.daily[block] += 1;
      next.totals = {...next.totals,[block]:next.totals[block]+1};
      if (next.lastActive !== today) { next.streak = next.lastActive===yesterdayStr() ? next.streak+1 : 1; next.lastActive=today; }
      persist(next); return next;
    });
  }, []);

  if (!aiReady) return <Shell><Setup onDone={handleAIChanged} /></Shell>;
  if (!state.profile) return <Shell><Onboarding onDone={profile => save({...state,profile,level:profile.level})} /></Shell>;

  return (
    <div style={{minHeight:"100vh",background:C.paper,fontFamily:FUI,color:C.ink,display:"flex",flexDirection:"column"}}>
      <div style={{flex:1,width:"100%",maxWidth:560,margin:"0 auto",padding:"20px 16px 96px"}}>
        {tab==="home"     && <Home     state={state} save={save} go={setTab} />}
        {tab==="talk"     && <Talk     state={state} registerActivity={registerActivity} />}
        {tab==="phrases"  && <Phrases  state={state} save={save} registerActivity={registerActivity} />}
        {tab==="listen"   && <Listen   state={state} save={save} registerActivity={registerActivity} />}
        {tab==="settings" && <Settings state={state} save={save} onAIChanged={handleAIChanged} />}
      </div>
      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
}
function Shell({children}) {

}

            </a>
          </div>
          <input type="password" value={key} onChange={e=>{setKey(e.target.value);setError(null);}}
            placeholder={prov.keyPlaceholder}
            style={{width:"100%",padding:"14px 16px",fontSize:15,borderRadius:12,border:`1.5px solid ${error?C.coral:C.line}`,outline:"none",marginBottom:8}}
          />
          {error && <p style={{color:C.coral,fontSize:13,marginBottom:8}}>❌ {error}</p>}
          <BigButton onClick={handleConnect} disabled={!key.trim()||testing}>
            {testing ? "Probando conexión…" : "Conectar y continuar →"}
          </BigButton>
        </div>
      )}
    </div>
  );
}

function Onboarding({ onDone }) {
  const [step,setStep]=useState(0);
  const [name,setName]=useState("");
  const [role,setRole]=useState("");
  const [goals,setGoals]=useState([]);
  const [interests,setInterests]=useState([]);
  const [level,setLevel]=useState(null);
  const toggle=(list,setList,item)=>setList(list.includes(item)?list.filter(x=>x!==item):[...list,item]);
  const iStyle={width:"100%",marginTop:8,padding:"14px 16px",fontSize:16,borderRadius:14,border:`1.5px solid ${C.line}`,background:C.card,outline:"none"};
  const steps=[
    {title:"¡Hola! 👋",sub:"Soy Fluido. Antes de empezar quiero conocerte para que cada ejercicio sea sobre TU mundo.",
     content:<div><label style={{fontSize:14,color:C.inkSoft}}>¿Cómo te llamas?</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Tu nombre" style={iStyle}/></div>,valid:name.trim().length>0},
    {title:`Un gusto, ${name.trim()} ✨`,sub:"Esto me ayuda a crear situaciones realistas.",
     content:<div><label style={{fontSize:14,color:C.inkSoft}}>¿A qué te dedicas?</label><input value={role} onChange={e=>setRole(e.target.value)} placeholder="Ej: consultor de software, estudiante…" style={iStyle}/></div>,valid:role.trim().length>1},
    {title:"¿Para qué necesitas el inglés?",sub:"Elige todo lo que aplique.",
     content:<ChipGrid options={GOAL_OPTIONS} selected={goals} onToggle={o=>toggle(goals,setGoals,o)}/>,valid:goals.length>0},
    {title:"¿Qué temas te gustan?",sub:"Los usaré en los diálogos para que no sea aburrido.",
     content:<ChipGrid options={INTEREST_OPTIONS} selected={interests} onToggle={o=>toggle(interests,setInterests,o)}/>,valid:interests.length>0},
    {title:"Tu nivel actual",sub:"Sé honesto — siempre puedes cambiarlo después.",
     content:<div style={{display:"flex",flexDirection:"column",gap:8}}>
       {LEVELS.map(lv=>(
         <button key={lv.id} onClick={()=>setLevel(lv.id)}
           style={{padding:"14px 16px",borderRadius:14,textAlign:"left",border:`2px solid ${level===lv.id?C.blue:C.line}`,background:level===lv.id?C.blueSoft:C.card}}>
           <strong style={{color:level===lv.id?C.blue:C.ink}}>{lv.label}</strong>
           <div style={{fontSize:13,color:C.inkSoft,marginTop:2}}>{lv.desc}</div>
         </button>))}
     </div>,valid:!!level},
  ];
  const s=steps[step]; const last=step===steps.length-1;
  return (
    <div className="fadein" key={step}>
      <div style={{display:"flex",gap:4,marginBottom:24}}>
        {steps.map((_,i)=><div key={i} style={{flex:1,height:4,borderRadius:2,background:i<=step?C.blue:C.line}}/>)}
      </div>
      <h1 style={{fontSize:28,fontWeight:700,marginBottom:6}}>{s.title}</h1>
      <p style={{fontSize:15,color:C.inkSoft,marginBottom:20,lineHeight:1.5}}>{s.sub}</p>
      {s.content}
      <div style={{display:"flex",gap:10,marginTop:28}}>
        {step>0&&<button onClick={()=>setStep(step-1)} style={{padding:"14px 18px",borderRadius:14,border:`1.5px solid ${C.line}`,background:C.card,color:C.inkSoft,fontWeight:600}}>Atrás</button>}
        <button onClick={()=>{if(!s.valid)return;if(last)onDone({name:name.trim(),role:role.trim(),goals,interests,level});else setStep(step+1);}} disabled={!s.valid}
          style={{flex:1,padding:"14px 18px",borderRadius:14,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:16,opacity:s.valid?1:0.4}}>
          {last?"¡Empezar a entrenar!":"Siguiente"}
        </button>
      </div>
    </div>
  );
}
function ChipGrid({options,selected,onToggle}) {
  return (
    <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
      {options.map(o=>{const on=selected.includes(o);return(
        <button key={o} onClick={()=>onToggle(o)} style={{padding:"10px 14px",borderRadius:999,fontSize:14,fontWeight:500,border:`1.5px solid ${on?C.blue:C.line}`,background:on?C.blueSoft:C.card,color:on?C.blue:C.ink}}>
          {on?"✓ ":""}{o}
        </button>);})}
    </div>
  );
}
function profileForPrompts(state,withName){
  const p=state.profile||{};
  return `${withName&&p.name?`Nombre: ${p.name}. `:""}Ocupación: ${p.role||"profesional"}. Objetivos: ${(p.goals||[]).join(", ")}. Intereses: ${(p.interests||[]).join(", ")}. Nivel: ${state.level}.`;
}

function Talk({state,registerActivity}){
  const [scenario,setScenario]=useState(null);
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const bottomRef=useRef(null);
  const {speak,failed}=useSpeech();
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);

  const newScenario=async()=>{
    setLoading(true);setError(null);setMessages([]);setScenario(null);
    try{
      const data=await askAI_JSON(`Perfil: ${profileForPrompts(state,true)}\n\nGenera una situación de práctica de inglés PERSONALIZADA para este perfil: usa su ocupación, sus objetivos y a veces sus intereses. Varía el contexto cada vez (semilla: ${Math.random().toString(36).slice(2)}).\n\nDevuelve JSON: {"title_es":"título corto en español","context_es":"contexto 1-2 frases, quién es el estudiante y el interlocutor","opening_en":"primer mensaje del interlocutor en inglés"}`,
        "Eres un profesor de inglés que crea simulaciones realistas y motivantes.");
      setScenario(data);setMessages([{role:"them",text:data.opening_en}]);
    }catch(e){setError(e.userMsg||(e.code==="NO_KEY"?"Configura tu clave en Ajustes.":"Error generando situación. Intenta de nuevo."));}
    setLoading(false);
  };

  const send=async()=>{
    const text=input.trim(); if(!text||loading)return;
    setInput("");setLoading(true);setError(null);
    const myMsg={role:"me",text};
    setMessages(m=>[...m,myMsg]);
    try{
      const history=[...messages,myMsg].map(m=>(m.role==="them"?"INTERLOCUTOR: ":"ESTUDIANTE: ")+m.text).join("\n");
      const data=await askAI_JSON(`Perfil: ${profileForPrompts(state,true)}\nSituación: ${scenario.context_es}\n\nConversación:\n${history}\n\nCorrige errores, da versión natural y continúa como interlocutor.\n\nDevuelve JSON: {"errors":[{"wrong":"error","right":"corrección","why_es":"explicación"}],"natural_en":"versión nativa o null","tip_es":"consejo breve o null","reply_en":"respuesta del interlocutor"}`,
        "Eres un coach de inglés cálido y preciso. Corriges sin desanimar.");
      setMessages(m=>{const c=[...m];c[c.length-1]={...myMsg,feedback:data};return[...c,{role:"them",text:data.reply_en}];});
      registerActivity("talk");
    }catch(e){
      setError(e.userMsg||"Problema al enviar. Intenta de nuevo.");
      setMessages(m=>m.slice(0,-1));setInput(text);
    }
    setLoading(false);
  };

  return(
    <div className="fadein" style={{display:"flex",flexDirection:"column",minHeight:"calc(100vh - 140px)"}}>
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Conversar</h2>
      <p style={{marginBottom:14,fontSize:14,color:C.inkSoft}}>Escribe en inglés como puedas. Aquí <span className="hl">equivocarse es el método</span>.</p>
      {!scenario&&!loading&&(
        <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:20,textAlign:"center"}}>
          <p style={{fontFamily:FEN,fontSize:18,marginBottom:14}}>Ready when you are, {state.profile.name}.</p>
          <BigButton onClick={newScenario}>Nueva situación</BigButton>
        </div>
      )}
      {scenario&&<div style={{background:C.blueSoft,borderRadius:12,padding:"10px 14px",marginBottom:12}}><strong style={{fontSize:14}}>{scenario.title_es}</strong><p style={{margin:"2px 0 0",fontSize:13,color:C.inkSoft}}>{scenario.context_es}</p></div>}
      <div style={{flex:1}}>
        {messages.map((m,i)=>(
          <div key={i} className="fadein" style={{marginBottom:10}}>
            <div style={{maxWidth:"85%",padding:"10px 14px",borderRadius:14,fontSize:16,lineHeight:1.5,fontFamily:FEN,background:m.role==="me"?C.blue:C.card,color:m.role==="me"?"#fff":C.ink,border:m.role==="me"?"none":`1px solid ${C.line}`,marginLeft:m.role==="me"?"auto":0}}>
              {m.text}
              {m.role==="them"&&<button onClick={()=>speak(m.text)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:16,marginLeft:6}}>🔊</button>}
            </div>
            {m.feedback&&<Feedback fb={m.feedback}/>}
          </div>
        ))}
        {failed&&<AudioWarning/>}
        {loading&&<p style={{color:C.inkSoft,fontSize:14}}>Pensando…</p>}
        {error&&<p style={{color:C.coral,fontSize:14}}>{error}</p>}
        <div ref={bottomRef}/>
      </div>
      {scenario&&(
        <div style={{position:"sticky",bottom:80,marginTop:10}}>
          <div style={{display:"flex",gap:8,background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:8}}>
            <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
              placeholder="Write your reply in English…" rows={2}
              style={{flex:1,border:"none",resize:"none",fontSize:16,outline:"none",background:"transparent",fontFamily:FEN}}/>
            <button onClick={send} disabled={loading||!input.trim()}
              style={{alignSelf:"flex-end",background:C.blue,color:"#fff",border:"none",borderRadius:10,padding:"10px 16px",fontWeight:600,opacity:loading||!input.trim()?0.5:1}}>Enviar</button>
          </div>
          <button onClick={newScenario} style={{marginTop:8,background:"transparent",border:"none",color:C.inkSoft,fontSize:13,textDecoration:"underline"}}>Cambiar de situación</button>
        </div>
      )}
    </div>
  );
}
function Feedback({fb}){
  const hasErrors=fb.errors&&fb.errors.length>0;
  if(!hasErrors&&!fb.natural_en&&!fb.tip_es)return<div style={{maxWidth:"85%",marginLeft:"auto",marginTop:4,fontSize:13,color:C.green,textAlign:"right"}}>✓ Perfecto, así se dice</div>;
  return(
    <div className="fadein" style={{maxWidth:"92%",marginLeft:"auto",marginTop:6,background:C.card,border:`1px dashed ${C.line}`,borderRadius:12,padding:"10px 12px",fontSize:14}}>
      {hasErrors&&fb.errors.map((e,i)=>(
        <p key={i} style={{margin:"0 0 6px",lineHeight:1.6}}>
          <span className="hl-red" style={{fontFamily:FEN}}>{e.wrong}</span>{" → "}<span className="hl-green" style={{fontFamily:FEN}}>{e.right}</span>
          <br/><span style={{color:C.inkSoft,fontSize:13}}>{e.why_es}</span>
        </p>))}
      {fb.natural_en&&<p style={{margin:"6px 0 0",lineHeight:1.5}}><span style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1}}>Versión natural</span><br/><span className="hl" style={{fontFamily:FEN,fontSize:15}}>{fb.natural_en}</span></p>}
      {fb.tip_es&&<p style={{margin:"8px 0 0",fontSize:13,color:C.blue}}>💡 {fb.tip_es}</p>}
    </div>
  );
}

function Phrases({state,save,registerActivity}){
  const [flipped,setFlipped]=useState(false);
  const [generating,setGenerating]=useState(false);
  const [error,setError]=useState(null);
  const [info,setInfo]=useState(null);
  const {speak,failed}=useSpeech();
  const now=Date.now();
  const due=state.deck.filter(c=>c.due<=now).sort((a,b)=>a.due-b.due);
  const card=due[0];
  const grade=g=>{
    const deck=state.deck.map(c=>{
      if(c.id!==card.id)return c;
      let interval=g==="again"?0:g==="good"?Math.max(1,(c.interval||0)*2):Math.max(3,(c.interval||1)*3);
      return{...c,interval,due:g==="again"?Date.now()+10*60*1000:Date.now()+interval*86400000,seen:c.seen+1};
    });
    setFlipped(false);registerActivity("phrases",{deck});
  };
  const generateMore=async()=>{
    setGenerating(true);setError(null);setInfo(null);
    try{
      const have=new Set(state.deck.map(c=>c.en.toLowerCase().trim()));
      const bank=loadBank();
      const fromBank=bank.phrases.filter(p=>!have.has(p.en.toLowerCase().trim())).slice(0,5);
      let newPhrases=[...fromBank];
      if(newPhrases.length<5){
        const need=5-newPhrases.length;
        const arr=await askAI_JSON(`Perfil (sin nombre): ${profileForPrompts(state,false)}\n\nGenera ${need} frases nuevas de inglés útiles para este perfil. NO repitas: ${state.deck.map(c=>c.en).slice(-40).join(" | ")}\n\nDevuelve JSON array: [{"es":"en español","en":"en inglés","note_es":"nota breve"}]`,
          "Eres un profesor de inglés práctico.");
        newPhrases=[...newPhrases,...arr.map(p=>({es:p.es,en:p.en,note_es:p.note_es||""}))];
        bank.phrases=[...bank.phrases,...arr.map(p=>({es:p.es,en:p.en,note_es:p.note_es||""}))];
        saveBank(bank);
      }else{setInfo("♻️ Frases del banco local — sin costo de IA.");}
      save({...state,deck:[...state.deck,...newPhrases.slice(0,5).map((p,i)=>({id:"g"+Date.now()+i,es:p.es,en:p.en,note:p.note_es||"",interval:0,due:0,seen:0}))]});
    }catch(e){setError(e.userMsg||"No pude conseguir frases. Intenta de nuevo.");}
    setGenerating(false);
  };
  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Frases</h2>
      <p style={{marginBottom:14,fontSize:14,color:C.inkSoft}}>Lee el español, <span className="hl">dilo en voz alta en inglés</span>, y recién ahí voltea la tarjeta.</p>
      <div style={{display:"flex",gap:10,marginBottom:14,fontSize:13,color:C.inkSoft}}>
        <span>📚 {state.deck.length} en tu mazo</span><span>⏰ {due.length} por repasar</span>
      </div>
      {card?(
        <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:18,padding:22,minHeight:220,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
          <div>
            <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5}}>{flipped?"En inglés se dice":"¿Cómo dirías…?"}</p>
            <p style={{fontSize:21,fontWeight:500,margin:"10px 0",lineHeight:1.4}}>{card.es}</p>
            {flipped&&(
              <div className="fadein">
                <p style={{fontFamily:FEN,fontSize:23,margin:"6px 0",lineHeight:1.4}}>
                  <span className="hl">{card.en}</span>{" "}
                  <button onClick={()=>speak(card.en)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:20}}>🔊</button>
                </p>
                <p style={{fontSize:13,color:C.inkSoft,margin:"8px 0 0"}}>{card.note}</p>
                {failed&&<AudioWarning/>}
              </div>
            )}
          </div>
          {!flipped?<BigButton onClick={()=>{setFlipped(true);speak(card.en);}}>Mostrar respuesta</BigButton>:(
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <GradeBtn color={C.coral} bg={C.coralSoft} onClick={()=>grade("again")} label="Otra vez" sub="en 10 min"/>
              <GradeBtn color={C.blue} bg={C.blueSoft} onClick={()=>grade("good")} label="Bien" sub={`en ${Math.max(1,(card.interval||0)*2)}d`}/>
              <GradeBtn color={C.green} bg={C.greenSoft} onClick={()=>grade("easy")} label="Fácil" sub={`en ${Math.max(3,(card.interval||1)*3)}d`}/>
            </div>)}
        </div>
      ):(
        <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:18,padding:22,textAlign:"center"}}>
          <p style={{fontWeight:600,color:C.green,marginBottom:4}}>✓ Mazo al día</p>
          <p style={{fontSize:14,color:C.inkSoft}}>No hay tarjetas pendientes ahora.</p>
        </div>
      )}
      <button onClick={generateMore} disabled={generating}
        style={{width:"100%",marginTop:14,padding:14,borderRadius:14,border:`2px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15,opacity:generating?0.6:1}}>
        {generating?"Buscando…":"✨ Agregar 5 frases nuevas"}
      </button>
      {info&&<p style={{color:C.green,fontSize:13,marginTop:8}}>{info}</p>}
      {error&&<p style={{color:C.coral,fontSize:14,marginTop:8}}>{error}</p>}
    </div>
  );
}
function GradeBtn({color,bg,onClick,label,sub}){return(<button onClick={onClick} style={{flex:1,padding:"10px 4px",borderRadius:12,border:`1.5px solid ${color}`,background:bg,color,fontWeight:600,fontSize:14}}>{label}<div style={{fontSize:10,fontWeight:400,marginTop:2,opacity:0.8}}>{sub}</div></button>);}

// ============================================================
// ESCUCHAR
// ============================================================
function Listen({state,save,registerActivity}){
  const [exercise,setExercise]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [info,setInfo]=useState(null);
  const [picked,setPicked]=useState(null);
  const [revealed,setRevealed]=useState(false);
  const [readingMode,setReadingMode]=useState(false);
  const [rate,setRate]=useState(0.85);
  const [playing,setPlaying]=useState(false);
  const {speak,stop,failed,supported}=useSpeech();
  useEffect(()=>()=>stop(),[stop]);
  useEffect(()=>{if(failed)setReadingMode(true);},[failed]);

  const newExercise=async()=>{
    setLoading(true);setError(null);setInfo(null);setExercise(null);setPicked(null);setRevealed(false);stop();setPlaying(false);
    try{
      const bank=loadBank();
      const used=new Set(state.usedListening||[]);
      const cands=bank.listening.filter(e=>e.id&&!used.has(e.id)&&e.level===state.level);
      if(cands.length>0){
        const pick=cands[Math.floor(Math.random()*cands.length)];
        setExercise(pick);save({...state,usedListening:[...(state.usedListening||[]),pick.id].slice(-300)});
        setInfo("♻️ Audio del banco local — sin costo de IA.");setLoading(false);return;
      }
      const data=await askAI_JSON(`Perfil (sin nombre): ${profileForPrompts(state,false)}\n\nGenera un ejercicio de listening: diálogo (4-6 líneas) entre dos personas sobre los objetivos o intereses del estudiante (semilla: ${Math.random().toString(36).slice(2)}).\n\nDevuelve JSON: {"title_es":"título","dialogue":[{"speaker":"nombre","line":"inglés"}],"question_es":"pregunta de comprensión","options_es":["A","B","C"],"correct_index":0,"key_phrase_en":"expresión útil","key_phrase_es":"traducción"}`,
        "Eres un profesor de inglés que crea ejercicios de listening realistas.");
      data.id="L"+Date.now()+Math.random().toString(36).slice(2,6);data.level=state.level;
      setExercise(data);const bank2=loadBank();bank2.listening=[...bank2.listening,data];saveBank(bank2);
      save({...state,usedListening:[...(state.usedListening||[]),data.id].slice(-300)});
    }catch(e){setError(e.userMsg||"Error al obtener el ejercicio. Intenta de nuevo.");}
    setLoading(false);
  };
  const play=()=>{if(!exercise)return;setPlaying(true);speak(exercise.dialogue,{rate,onEnd:()=>setPlaying(false)});};
  const stopAll=()=>{stop();setPlaying(false);};
  const answer=i=>{if(picked!==null)return;setPicked(i);registerActivity("listen");};

  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Escuchar</h2>
      <p style={{marginBottom:14,fontSize:14,color:C.inkSoft}}>Escucha primero <span className="hl">sin leer</span>. La transcripción se revela al final.</p>
      {!exercise&&!loading&&<div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:20,textAlign:"center"}}><p style={{fontFamily:FEN,fontSize:18,marginBottom:14}}>Train your ear.</p><BigButton onClick={newExercise}>Nuevo audio</BigButton></div>}
      {loading&&<p style={{color:C.inkSoft}}>Preparando ejercicio…</p>}
      {error&&<p style={{color:C.coral}}>{error}</p>}
      {info&&<p style={{color:C.green,fontSize:13}}>{info}</p>}
      {exercise&&(
        <div>
          <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18}}>
            <strong>{exercise.title_es}</strong>
            {!readingMode?(
              <React.Fragment>
                <div style={{display:"flex",alignItems:"center",gap:10,marginTop:12}}>
                  <button onClick={playing?stopAll:play} style={{width:56,height:56,borderRadius:"50%",border:"none",background:C.blue,color:"#fff",fontSize:22}} aria-label={playing?"Detener":"Reproducir"}>{playing?"■":"▶"}</button>
                  <div style={{flex:1}}>
                    <p style={{fontSize:13,color:C.inkSoft}}>Velocidad</p>
                    <div style={{display:"flex",gap:6,marginTop:4}}>
                      {[{v:0.7,l:"Lenta"},{v:0.85,l:"Normal"},{v:1.0,l:"Nativa"}].map(o=>(
                        <button key={o.v} onClick={()=>setRate(o.v)}
                          style={{padding:"4px 10px",borderRadius:8,fontSize:12,fontWeight:600,border:`1.5px solid ${rate===o.v?C.blue:C.line}`,background:rate===o.v?C.blueSoft:"transparent",color:rate===o.v?C.blue:C.inkSoft}}>
                          {o.l}
                        </button>))}
                    </div>
                  </div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                  <p style={{fontSize:12,color:C.inkSoft}}>Escúchalo las veces que necesites.</p>
                  <button onClick={()=>setReadingMode(true)} style={{border:"none",background:"transparent",color:C.inkSoft,fontSize:12,textDecoration:"underline"}}>¿No escuchas nada?</button>
                </div>
                {failed&&<AudioWarning/>}
              </React.Fragment>
            ):(
              <div style={{marginTop:12}}>
                {failed&&<AudioWarning/>}
                <p style={{fontSize:13,color:C.inkSoft,margin:"10px 0 8px"}}><strong>Modo lectura:</strong> lee el diálogo una vez a ritmo normal, luego ocúltalo para responder.</p>
                {!revealed&&picked===null?<ReadOnce dialogue={exercise.dialogue}/>:null}
                {supported&&<button onClick={()=>setReadingMode(false)} style={{border:"none",background:"transparent",color:C.blue,fontSize:12,textDecoration:"underline",marginTop:6}}>Reintentar con audio</button>}
              </div>
            )}
          </div>
          <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginTop:12}}>
            <p style={{fontWeight:600,marginBottom:10}}>{exercise.question_es}</p>
            {exercise.options_es.map((op,i)=>{
              const isC=i===exercise.correct_index,isP=picked===i;
              let border=C.line,bg="transparent",color=C.ink;
              if(picked!==null){if(isC){border=C.green;bg=C.greenSoft;color=C.green;}else if(isP){border=C.coral;bg=C.coralSoft;color=C.coral;}}
              return<button key={i} onClick={()=>answer(i)} style={{display:"block",width:"100%",textAlign:"left",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${border}`,background:bg,color,fontSize:15,marginBottom:8,fontWeight:picked!==null&&isC?600:400}}>{op}</button>;
            })}
            {picked!==null&&<p className="fadein" style={{marginTop:4,fontWeight:600,color:picked===exercise.correct_index?C.green:C.coral}}>{picked===exercise.correct_index?"✓ ¡Correcto! Tu oído está despertando.":"Casi. Revisa la transcripción y prueba otro audio."}</p>}
          </div>
          {picked!==null&&(
            <div className="fadein" style={{marginTop:12}}>
              {!revealed?<BigButton onClick={()=>setRevealed(true)}>Ver transcripción</BigButton>:(
                <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18}}>
                  {exercise.dialogue.map((d,i)=><p key={i} style={{marginBottom:8,lineHeight:1.5}}><strong style={{fontSize:13,color:C.inkSoft}}>{d.speaker}:</strong>{" "}<span style={{fontFamily:FEN,fontSize:16}}>{d.line}</span></p>)}
                  <div style={{borderTop:`1px dashed ${C.line}`,paddingTop:10,marginTop:10}}>
                    <p style={{fontSize:13,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1}}>Expresión para tu mochila</p>
                    <p style={{margin:"4px 0 0",fontFamily:FEN,fontSize:16}}><span className="hl">{exercise.key_phrase_en}</span><span style={{fontFamily:FUI,fontSize:13,color:C.inkSoft}}> — {exercise.key_phrase_es}</span></p>
                  </div>
                </div>
              )}
              <button onClick={newExercise} style={{width:"100%",marginTop:10,padding:14,borderRadius:14,border:`2px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15}}>Otro audio</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
function ReadOnce({dialogue}){
  const [visible,setVisible]=useState(true);
  if(!visible)return<p style={{fontSize:13,color:C.inkSoft,fontStyle:"italic"}}>Diálogo oculto. Responde la pregunta de memoria 👇</p>;
  return(
    <div>
      <div style={{background:C.paper,borderRadius:12,padding:12}}>
        {dialogue.map((d,i)=><p key={i} style={{marginBottom:6,lineHeight:1.5}}><strong style={{fontSize:12,color:C.inkSoft}}>{d.speaker}:</strong>{" "}<span style={{fontFamily:FEN,fontSize:15}}>{d.line}</span></p>)}
      </div>
      <button onClick={()=>setVisible(false)} style={{width:"100%",marginTop:8,padding:10,borderRadius:10,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:14}}>Listo, ocultar diálogo</button>
    </div>
  );
}

// ============================================================
// AJUSTES — rediseñados con ping por proveedor
// ============================================================
function Settings({state,save,onAIChanged}){
  const [expanded,setExpanded]=useState(null);
  const [editKeys,setEditKeys]=useState({});
  const [testState,setTestState]=useState({});

  const cfg=getAIConfig()||{active:null,keys:{}};
  const savedKeys=cfg.keys||{};

  const setTS=(pid,val)=>setTestState(t=>({...t,[pid]:val}));

  const getKey=pid=>editKeys[pid]!==undefined?editKeys[pid]:(savedKeys[pid]||"");

  const handleTest=async(pid)=>{
    const key=getKey(pid).trim();
    if(!key){setTS(pid,{error:"Ingresa tu clave primero."});return;}
    setTS(pid,{testing:true});
    try{
      await pingProvider(pid,key);
      setTS(pid,{ok:true});
      // Auto-guardar la clave al probar exitosamente
      const newCfg={active:cfg.active||pid,keys:{...savedKeys,[pid]:key}};
      setAIConfig(newCfg);
    }catch(e){setTS(pid,{error:e.userMsg||e.message||"Error de conexión."});}
  };

  const handleActivate=pid=>{
    const key=getKey(pid).trim();
    if(!key)return;
    setAIConfig({active:pid,keys:{...savedKeys,[pid]:key}});
    onAIChanged();
  };

  const handleDisconnect=()=>{
    if(!window.confirm("¿Desconectar la IA? Deberás volver a configurar la clave."))return;
    localStorage.removeItem(AI_KEY);localStorage.removeItem("fluido-ai");onAIChanged();
  };

  const resetProfile=()=>{
    if(!window.confirm("¿Rehacer el cuestionario? Tu racha y mazo se mantienen."))return;
    save({...state,profile:null});
  };
  const resetAll=()=>{
    if(!window.confirm("⚠️ Esto borra TODO incluyendo claves y progreso. ¿Seguro?"))return;
    localStorage.clear();window.location.reload();
  };

  const activeProv=PROVIDERS.find(p=>p.id===cfg.active);

  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:14}}>Ajustes</h2>

      {/* Banner proveedor activo */}
      {activeProv?(
        <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:14,padding:"12px 16px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:11,color:C.green,textTransform:"uppercase",letterSpacing:1,fontWeight:600}}>IA activa ahora</div>
            <div style={{fontWeight:700,fontSize:16,marginTop:2}}>{activeProv.emoji} {activeProv.name}</div>
          </div>
          <button onClick={handleDisconnect} style={{border:"none",background:"transparent",color:C.coral,fontSize:13,fontWeight:600}}>Desconectar</button>
        </div>
      ):(
        <div style={{background:C.coralSoft,border:`1px solid ${C.coral}`,borderRadius:14,padding:"12px 16px",marginBottom:14}}>
          <p style={{color:C.coral,fontWeight:600,margin:0}}>Sin IA configurada — expande un proveedor abajo para conectar.</p>
        </div>
      )}

      <p style={{fontSize:12,color:C.inkSoft,marginBottom:14,lineHeight:1.6}}>
        🔐 Tus claves se guardan <strong>solo en este navegador</strong>. Cada usuario configura las suyas al abrir la app por primera vez.
      </p>

      {/* Lista de proveedores */}
      {PROVIDERS.map(p=>{
        const isActive=cfg.active===p.id;
        const savedKey=savedKeys[p.id]||"";
        const displayKey=getKey(p.id);
        const ts=testState[p.id]||{};
        const isExpanded=expanded===p.id;
        const hasValidKey=ts.ok||(savedKey&&editKeys[p.id]===undefined);

        return(
          <div key={p.id} style={{background:C.card,border:`1.5px solid ${isActive?C.green:C.line}`,borderRadius:14,marginBottom:10,overflow:"hidden"}}>
            {/* Cabecera colapsable */}
            <button onClick={()=>setExpanded(isExpanded?null:p.id)}
              style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",border:"none",background:"transparent",textAlign:"left"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:24}}>{p.emoji}</span>
                <div>
                  <div style={{fontWeight:600,fontSize:14,color:C.ink}}>{p.name}</div>
                  <span style={{fontSize:10,fontWeight:700,color:p.tagColor}}>{p.tag}</span>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {isActive&&<span style={{fontSize:10,fontWeight:700,color:C.green,background:C.greenSoft,padding:"3px 8px",borderRadius:999}}>ACTIVO</span>}
                {savedKey&&!isActive&&<span style={{fontSize:11,color:C.inkSoft}}>✓ Config</span>}
                <span style={{color:C.inkSoft,fontSize:14}}>{isExpanded?"▲":"▼"}</span>
              </div>
            </button>

            {/* Cuerpo expandido */}
            {isExpanded&&(
              <div className="fadein" style={{padding:"0 16px 16px",borderTop:`1px solid ${C.line}`}}>
                {/* Instrucciones */}
                <div style={{background:C.paper,borderRadius:10,padding:10,fontSize:13,lineHeight:1.8,margin:"12px 0"}}>
                  {p.helpSteps.map((s,i)=><div key={i}>{i+1}. {s}</div>)}
                  <a href={p.helpUrl} target="_blank" rel="noreferrer" style={{color:C.blue,fontWeight:600}}>→ {p.helpUrl.replace("https://","")}</a>
                </div>

                {/* Input de clave */}
                <input type="password" value={displayKey}
                  onChange={e=>{setEditKeys(k=>({...k,[p.id]:e.target.value}));setTS(p.id,{});}}
                  placeholder={p.keyPlaceholder}
                  style={{width:"100%",padding:"12px 14px",fontSize:15,borderRadius:12,border:`1.5px solid ${ts.ok?C.green:ts.error?C.coral:C.line}`,outline:"none"}}
                />
                {ts.error&&<p style={{color:C.coral,fontSize:13,marginTop:6}}>❌ {ts.error}</p>}
                {ts.ok&&<p style={{color:C.green,fontSize:13,marginTop:6}}>✓ Conexión exitosa</p>}

                {/* Botones: Probar + Activar */}
                <div style={{display:"flex",gap:8,marginTop:10}}>
                  <button onClick={()=>handleTest(p.id)} disabled={ts.testing||!displayKey.trim()}
                    style={{flex:1,padding:"10px 0",borderRadius:10,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:14,opacity:ts.testing||!displayKey.trim()?0.5:1}}>
                    {ts.testing?"Probando…":"⚡ Probar conexión"}
                  </button>
                  {!isActive&&(
                    <button onClick={()=>handleActivate(p.id)} disabled={!hasValidKey}
                      style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",background:hasValidKey?C.blue:C.line,color:"#fff",fontWeight:600,fontSize:14,opacity:hasValidKey?1:0.5}}>
                      Activar
                    </button>
                  )}
                  {isActive&&(
                    <button disabled style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",background:C.greenSoft,color:C.green,fontWeight:600,fontSize:14}}>✓ Activa</button>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}

      {/* Datos */}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginTop:6}}>
        <p style={{fontWeight:600,marginBottom:10}}>Perfil y datos</p>
        <button onClick={resetProfile} style={{width:"100%",padding:"12px 16px",borderRadius:12,border:`1.5px solid ${C.line}`,background:"transparent",color:C.ink,fontWeight:500,marginBottom:8}}>Rehacer cuestionario inicial</button>
        <button onClick={resetAll} style={{width:"100%",padding:"12px 16px",borderRadius:12,border:`1.5px solid ${C.coral}`,background:C.coralSoft,color:C.coral,fontWeight:600}}>⚠️ Borrar todo y empezar de cero</button>
      </div>
      <p style={{fontSize:11,color:C.inkSoft,marginTop:16,textAlign:"center"}}>Fluido v4 · hecho desde Chile 🇨🇱</p>
    </div>
  );
}

function BigButton({children,onClick,disabled}){
  return<button onClick={onClick} disabled={disabled} style={{width:"100%",padding:"14px 18px",borderRadius:14,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:16,opacity:disabled?0.5:1}}>{children}</button>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
