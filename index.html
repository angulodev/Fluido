function writeLoad(){try{return JSON.parse(sessionStorage.getItem("fluido-write")||"null");}catch(e){return null;}}
function writeSave(d){try{sessionStorage.setItem("fluido-write",JSON.stringify(d));}catch(e){}}

function Write({state,registerActivity}){
  const sv=writeLoad();
  const [prompt,setPrompt]=useState(sv?.prompt||null);
  const [text,setText]=useState(sv?.text||"");
  const [feedback,setFeedback]=useState(sv?.feedback||null);
  const [thread,setThread]=useState(sv?.thread||[]); // [{question_en,question_es, answer, feedback}]
  const [loadingPrompt,setLoadingPrompt]=useState(false);
  const [loadingReview,setLoadingReview]=useState(false);
  const [loadingFollowup,setLoadingFollowup]=useState(false);
  const [error,setError]=useState(null);
  const {speak}=useSpeech();

  useEffect(()=>{ writeSave({prompt,text,feedback,thread}); },[prompt,text,feedback,thread]);

  const newPrompt=async(topic)=>{
    setLoadingPrompt(true);setError(null);setFeedback(null);setText("");setThread([]);
    try{
      const topicLine=topic?`TEMA OBLIGATORIO de la consigna: ${topic}. `:"Debe pedir escribir sobre un tema cotidiano relacionado a sus intereses u objetivos. ";
      const data=await askAI_JSON(
        `Perfil (sin nombre): ${profileForPrompts(state,false)}\n\nGenera UNA consigna breve de escritura en inglés para este perfil, ajustada EXACTAMENTE a la complejidad del nivel indicado. ${topicLine}Debe pedir escribir 1-3 frases. Varía el enfoque (semilla: ${Math.random().toString(36).slice(2)}).\n\nDevuelve SOLO JSON: {"prompt_es":"consigna en español, breve y clara","example_hint_es":"pista corta opcional de qué incluir"}`,
        "Eres un profesor de inglés que diseña consignas de escritura cortas y motivadoras."
      );
      setPrompt(data);
    }catch(e){setError(e.userMsg||"No pude generar una consigna. Intenta de nuevo.");}
    setLoadingPrompt(false);
  };

  const submit=async()=>{
    if(!text.trim())return;
    setLoadingReview(true);setError(null);
    try{
      const lvl=state.level;
      const data=await askAI_JSON(
        `Nivel del alumno: ${lvl}. Consigna que se le dio: "${prompt?.prompt_es||""}". Esto es lo que escribió en inglés:\n"""${text.trim()}"""\n\nCorrige su texto. Sé constructivo y específico, acorde al nivel ${lvl} (no exijas perfección de nivel C1 a un A2). Devuelve SOLO JSON: {"corrected":"versión corregida natural en inglés","errors":[{"original":"fragmento que escribió","fix":"cómo debería decirse","why_es":"explicación breve en español"}],"praise_es":"algo breve que hizo bien","score":"excelente|bien|sigue practicando"}`,
        "Eres un profesor de inglés que corrige textos de alumnos con tono alentador y explicaciones claras en español."
      );
      setFeedback(data);
      recordPerf("write", lvl, !(data.errors&&data.errors.length>0));
      registerActivity("write");
    }catch(e){setError(e.userMsg||"No pude revisar tu texto. Intenta de nuevo.");}
    setLoadingReview(false);
  };

  const tryAgain=()=>{setText("");setFeedback(null);setThread([]);};

  const threadContext=()=>{
    let ctx=`Consigna original: "${prompt?.prompt_es||""}". Primera respuesta del alumno (ya corregida): "${feedback?.corrected||text}".`;
    thread.forEach((t,i)=>{ ctx+=`\nPregunta de seguimiento ${i+1}: "${t.question_en}". Respuesta del alumno: "${t.answer}".`; });
    return ctx;
  };

  const askFollowup=async()=>{
    setLoadingFollowup(true);setError(null);
    try{
      const data=await askAI_JSON(
        `Nivel del alumno: ${state.level}. ${threadContext()}\n\nHaz UNA pregunta de seguimiento breve en inglés, simple y natural acorde al nivel ${state.level}, relacionada al mismo tema, para que el alumno siga practicando escritura sobre lo que ya contó. No repitas preguntas anteriores.\n\nDevuelve SOLO JSON: {"question_en":"pregunta en inglés","question_es":"misma pregunta traducida al español"}`,
        "Eres un profesor de inglés que mantiene una conversación escrita breve y motivadora con su alumno."
      );
      setThread(th=>[...th,{question_en:data.question_en,question_es:data.question_es,answer:"",feedback:null}]);
    }catch(e){setError(e.userMsg||"No pude generar la siguiente pregunta. Intenta de nuevo.");}
    setLoadingFollowup(false);
  };

  const updateThreadAnswer=(idx,val)=>{
    setThread(th=>th.map((t,i)=>i===idx?{...t,answer:val}:t));
  };

  const submitThreadAnswer=async(idx)=>{
    const turn=thread[idx];
    if(!turn.answer.trim())return;
    setLoadingReview(true);setError(null);
    try{
      const data=await askAI_JSON(
        `Nivel del alumno: ${state.level}. Se le hizo esta pregunta en inglés: "${turn.question_en}". Esto es lo que respondió:\n"""${turn.answer.trim()}"""\n\nCorrige su respuesta. Sé constructivo y específico, acorde al nivel ${state.level}. Devuelve SOLO JSON: {"corrected":"versión corregida natural en inglés","errors":[{"original":"fragmento","fix":"corrección","why_es":"explicación breve en español"}],"praise_es":"algo breve que hizo bien"}`,
        "Eres un profesor de inglés que corrige textos de alumnos con tono alentador y explicaciones claras en español."
      );
      setThread(th=>th.map((t,i)=>i===idx?{...t,feedback:data}:t));
      recordPerf("write", state.level, !(data.errors&&data.errors.length>0));
      registerActivity("write");
    }catch(e){setError(e.userMsg||"No pude revisar tu respuesta. Intenta de nuevo.");}
    setLoadingReview(false);
  };

  return(
    <div>
      <h2 style={{fontSize:26,fontWeight:800,marginBottom:4}}>Escribir</h2>
      <p style={{fontSize:14,color:C.inkSoft,marginBottom:16}}>Escribe tú en inglés y recibe corrección al instante.</p>

      {!prompt&&!loadingPrompt&&(
        <div>
          <BigButton onClick={()=>newPrompt()}>✨ Pedir una consigna</BigButton>
          {(()=>{const pt=loadPersonalTopics().topics;if(!pt.length)return null;return(
            <div style={{marginTop:14}}>
              <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,margin:"0 0 8px"}}>✨ O escribe sobre tus temas</p>
              <ChipsWithSheet items={pt} onPick={t=>newPrompt(t.en)} limit={4} title="✨ Tus temas"/>
            </div>);})()}
        </div>
      )}

              <div style={{background:C.greenSoft,borderRadius:12,padding:"10px 14px",marginBottom:12}}>

                      <p style={{fontSize:12,color:C.inkSoft,margin:"2px 0 0"}}>{er.why_es}</p>

              {thread.map((t,idx)=>(
                <div key={idx} className="fadein" style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${C.line}`}}>
                  <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:8}}>
                    <div>
                      <p style={{fontSize:11,color:C.blue,textTransform:"uppercase",letterSpacing:1,fontWeight:700,marginBottom:2}}>Te preguntan</p>

                        placeholder="Your answer…" disabled={loadingReview}
                        style={{width:"100%",minHeight:70,padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.line}`,background:C.bg,color:C.ink,fontFamily:"Newsreader,Georgia,serif",fontSize:16,lineHeight:1.5,resize:"vertical"}}/>
                      <button onClick={()=>submitThreadAnswer(idx)} disabled={loadingReview||!t.answer.trim()}

                    </>
                  ):(
                    <>
                      <div style={{background:C.greenSoft,borderRadius:12,padding:"10px 14px",marginBottom:8}}>
                        <p style={{fontSize:11,color:C.green,textTransform:"uppercase",letterSpacing:1,marginBottom:4,fontWeight:700}}>Versión corregida</p>

                      </div>
                      {t.feedback.praise_es&&<p style={{fontSize:13,color:C.green,marginBottom:8}}>👍 {t.feedback.praise_es}</p>}
                      {t.feedback.errors&&t.feedback.errors.length>0&&(
                        <div style={{display:"flex",flexDirection:"column",gap:6}}>

                            <div key={i} style={{borderLeft:`3px solid ${C.coral}`,paddingLeft:10}}>

                              <p style={{fontSize:12,color:C.inkSoft,margin:"2px 0 0"}}>{er.why_es}</p>

                        </div>

                    </>

              {error&&<p style={{fontSize:13,color:C.coral,marginTop:10}}>{error}</p>}

              {/* Botón continuar conversación: solo si el último turno (o el inicial) ya tiene feedback */}
              {(thread.length===0||thread[thread.length-1].feedback)&&(
                <button onClick={askFollowup} disabled={loadingFollowup}
                  style={{width:"100%",marginTop:14,padding:"10px 14px",borderRadius:10,border:`1.5px solid ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:13,opacity:loadingFollowup?0.6:1}}>
                  {loadingFollowup?"Pensando una pregunta…":"💬 Continuar conversación"}
                </button>
              )}

              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button onClick={tryAgain} style={{flex:1,padding:"10px 14px",borderRadius:10,border:`1.5px solid ${C.line}`,background:"transparent",color:C.ink,fontWeight:600,fontSize:13}}>
                  Escribir otra vez
                </button>
                <button onClick={()=>newPrompt()} style={{flex:1,padding:"10px 14px",borderRadius:10,border:"none",background:C.blue,color:"#fff",fontWeight:700,fontSize:13}}>
                  Nueva consigna
                </button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function LevelBar({label,pct,note}){
  const has = pct!==null;
  return(
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:13,fontWeight:600}}>{label}</span>
        <span style={{fontSize:13,color:has?C.ink:C.inkSoft}}>{has?`${pct}%`:"sin datos aún"}</span>
      </div>
      <div style={{height:8,background:C.paper,borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",width:(has?pct:0)+"%",background:has?(pct>=70?C.green:pct>=40?C.blue:C.coral):C.line,borderRadius:4,transition:"width .3s"}}/>
      </div>
      {note&&<p style={{fontSize:12,color:C.inkSoft,marginTop:4}}>{note}</p>}
    </div>
  );
}

// 📊 Actividad de los últimos 7 días (usa state.history)
function WeeklyActivity({history}){
  const days=[...Array(7)].map((_,i)=>{
    const d=new Date(Date.now()-(6-i)*86400000);
    const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    return{k,label:["D","L","M","X","J","V","S"][d.getDay()],n:history[k]||0};
  });
  const max=Math.max(1,...days.map(d=>d.n));
  const total=days.reduce((a,d)=>a+d.n,0);
  return(
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:12}}>
        <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,margin:0}}>Actividad últimos 7 días</p>
        <span style={{fontSize:12,color:C.inkSoft}}>{total} práctica{total===1?"":"s"}</span>
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:8,height:74}}>
        {days.map((d,i)=>(
          <div key={d.k} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,justifyContent:"flex-end"}}>
            <span style={{fontSize:10,color:C.inkSoft,height:12}}>{d.n||""}</span>
            <div style={{width:"100%",borderRadius:6,background:d.n?(i===6?C.green:C.blue):C.paper,height:Math.max(4,Math.round(d.n/max*46)),transition:"height .3s"}}/>
            <span style={{fontSize:10,color:i===6?C.ink:C.inkSoft,fontWeight:i===6?700:400}}>{d.label}</span>
          </div>))}
      </div>
    </div>
  );
}

function LevelCheck({state,save,go}){
  const sig = getLevelSignal(state);
  const lvl = LEVELS.find(l=>l.id===state.level)||{};
  const idx = LEVELS.findIndex(l=>l.id===state.level);
  const nextLevel = idx<LEVELS.length-1 ? LEVELS[idx+1] : null;
  const prevLevel = idx>0 ? LEVELS[idx-1] : null;

  const changeLevel = (newLvl)=>{
    save({...state, level:newLvl});
    go("home");
  };

  return(
    <div className="fadein">
      <button onClick={()=>go("home")} style={{border:"none",background:"transparent",color:C.blue,fontWeight:600,fontSize:14,marginBottom:14,padding:0}}>← Volver</button>
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>¿Debería cambiar de nivel?</h2>
      <p style={{fontSize:14,color:C.inkSoft,marginBottom:18}}>Nivel actual: <strong style={{color:C.ink}}>{lvl.icon} {lvl.label}</strong></p>

      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:16}}>
        <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,marginBottom:14}}>Tu desempeño reciente (nivel {state.level})</p>
        <LevelBar label="Comprensión auditiva (Escuchar)" pct={sig.listenPct} note={sig.listenPct===null?"Responde al menos 5 ejercicios en Escuchar para ver esta señal.":null}/>
        <LevelBar label="Producción oral (Conversar)" pct={sig.talkPct} note={sig.talkPct===null?"Envía al menos 5 mensajes en Conversar para ver esta señal.":null}/>
        <LevelBar label="Producción escrita (Escribir)" pct={sig.writePct} note={sig.writePct===null?"Corrige al menos 5 textos en Escribir para ver esta señal.":null}/>
        <LevelBar label="Aciertos en Quiz de gramática" pct={sig.quizPct} note={sig.quizPct===null?"Responde al menos 5 preguntas del Quiz para ver esta señal.":null}/>
      </div>

      <WeeklyActivity history={state.history||{}}/>

      {!sig.hasEnoughData&&(
        <div style={{background:C.paper,border:`1px solid ${C.line}`,borderRadius:14,padding:16,textAlign:"center"}}>
          <p style={{fontSize:14,color:C.inkSoft}}>Todavía no hay suficiente práctica para darte una recomendación confiable. Sigue usando Escuchar, Conversar, Escribir y el Quiz — vuelve a revisar en unos días.</p>
        </div>
      )}

      {sig.hasEnoughData&&sig.recommendation==="up"&&nextLevel&&(
        <div className="fadein" style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:14,padding:18,textAlign:"center"}}>
          <p style={{fontWeight:700,color:C.green,marginBottom:6}}>📈 Parece buen momento para subir de nivel</p>
          <p style={{fontSize:13,color:C.ink,marginBottom:14}}>Tu desempeño promedio es de {sig.avg}%. Esto ya no te está desafiando lo suficiente.</p>
          <button onClick={()=>changeLevel(nextLevel.id)} style={{width:"100%",padding:"12px 0",borderRadius:12,border:"none",background:C.green,color:"#fff",fontWeight:700,fontSize:14}}>
            Subir a {nextLevel.icon} {nextLevel.label}
          </button>
        </div>
      )}

      {sig.hasEnoughData&&sig.recommendation==="down"&&prevLevel&&(
        <div className="fadein" style={{background:C.coralSoft,border:`1px solid ${C.coral}`,borderRadius:14,padding:18,textAlign:"center"}}>
          <p style={{fontWeight:700,color:C.coral,marginBottom:6}}>💡 Este nivel te está costando bastante</p>
          <p style={{fontSize:13,color:C.ink,marginBottom:14}}>Tu desempeño promedio es de {sig.avg}%. Bajar un poco no es retroceder — es construir una base más sólida para avanzar después con más confianza.</p>
          <button onClick={()=>changeLevel(prevLevel.id)} style={{width:"100%",padding:"12px 0",borderRadius:12,border:"none",background:C.coral,color:"#fff",fontWeight:700,fontSize:14}}>
            Bajar a {prevLevel.icon} {prevLevel.label}
          </button>
        </div>
      )}

      {sig.hasEnoughData&&sig.recommendation==="stay"&&(
        <div className="fadein" style={{background:C.blueSoft,border:`1px solid ${C.blue}`,borderRadius:14,padding:18,textAlign:"center"}}>
          <p style={{fontWeight:700,color:C.blue,marginBottom:6}}>👍 Tu nivel actual te queda bien</p>
          <p style={{fontSize:13,color:C.ink}}>Tu desempeño promedio es de {sig.avg}%, en el rango ideal para seguir progresando sin frustrarte ni aburrirte. Sigue así.</p>
        </div>
      )}

      <p style={{fontSize:12,color:C.inkSoft,marginTop:18,textAlign:"center"}}>También puedes cambiar de nivel manualmente cuando quieras desde Ajustes.</p>
    </div>
  );
}

// 📖 HISTORIA — mini-cuento interactivo por capítulos
// ============================================================
function storyLoad(){try{return JSON.parse(sessionStorage.getItem("fluido-story")||"null");}catch(e){return null;}}
function storySave(s){try{sessionStorage.setItem("fluido-story",JSON.stringify(s));}catch(e){}}

function Story({state,registerActivity}){
  const sv=storyLoad();
  const [story,setStory]=useState(sv?.story||null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [showEs,setShowEs]=useState({});
  const [shadow,setShadow]=useState(false);
  const [rate,setRate]=useState(1.0);
  const {speak,stop,failed}=useSpeech();
  const [topicSugs]=useState(()=>[...LISTEN_TOPICS].sort(()=>Math.random()-0.5).slice(0,8));
  const personal=loadPersonalTopics().topics;
  useEffect(()=>{ storySave({story}); },[story]);

  const lvlDesc=LISTEN_LEVEL_DESC[state.level]||"intermedio";
  const sys=`Eres un escritor de mini-cuentos para estudiantes de inglés nivel ${state.level}. Historias simples, vívidas y con gancho, coherentes de capítulo a capítulo. Inglés 100% natural (contracciones, ritmo de nativo), nunca robótico ni telegráfico.`;

  const startStory=async(topicOverride)=>{
    setLoading(true);setError(null);setStory(null);setShowEs({});setShadow(false);stop();
    try{sessionStorage.removeItem("fluido-story");}catch(e){}
    try{
      const topic=topicOverride||pickListenTopic(personal);
      const data=await askAI_JSON(
        `Escribe el CAPÍTULO 1 de un mini-cuento interactivo en inglés para practicar lectura y escucha. Tema/situación del cuento: ${topic.en}.\n\nREGLA MÁS IMPORTANTE — nivel del estudiante: ${state.level} (${lvlDesc}). CADA oración debe cumplirla; ante la duda, hazla MÁS simple.\n\nEl capítulo: 4-6 oraciones, un protagonista con nombre poco común, algo concreto pasa (no pura descripción), y termina justo en un momento de decisión con suspenso. Dale un giro inesperado (semilla: ${Math.random().toString(36).slice(2)}).\n\nDevuelve SOLO JSON: {"title_es":"título del cuento en español","sentences":[{"en":"oración en inglés","es":"traducción"}],"choice":{"question_es":"pregunta de la decisión en español","options":[{"en":"opción A en inglés del mismo nivel","es":"traducción"},{"en":"opción B en inglés del mismo nivel","es":"traducción"}]}}`,
        sys);
      if(!data.sentences||!data.choice) throw Object.assign(new Error("bad"),{userMsg:"La IA devolvió una historia incompleta. Intenta de nuevo."});
      setStory({topic_es:topic.es,title_es:data.title_es,pages:[{sentences:data.sentences,choice:data.choice,chosen:null}],finished:false});
      registerActivity("listen");
    }catch(e){setError(e.userMsg||"Error creando la historia. Revisa tu clave de IA en Ajustes.");}
    setLoading(false);
  };

  const choose=async(optIdx)=>{
    if(!story||loading) return;
    setLoading(true);setError(null);
    const isLast=story.pages.length>=2; // el capítulo 3 cierra
    const soFar=story.pages.map((p,i)=>`Capítulo ${i+1}: `+p.sentences.map(s=>s.en).join(" ")).join("\n");
    const chosen=story.pages[story.pages.length-1].choice.options[optIdx];
    try{
      const data=await askAI_JSON(
        `Continúa este mini-cuento interactivo en inglés.\n\nREGLA MÁS IMPORTANTE — nivel ${state.level} (${lvlDesc}); ante la duda, más simple.\n\nHistoria hasta ahora:\n${soFar}\n\nEl lector decidió: "${chosen.en}".\n\n${isLast
          ?'Escribe el CAPÍTULO FINAL (4-6 oraciones): sigue esa decisión y cierra la historia de forma satisfactoria y memorable. Devuelve SOLO JSON: {"sentences":[{"en":"...","es":"..."}],"key_phrase_en":"una expresión útil que apareció en el cuento","key_phrase_es":"su traducción"}'
          :'Escribe el CAPÍTULO 2 (4-6 oraciones): sigue esa decisión, algo nuevo pasa, y termina en otro momento de decisión. Devuelve SOLO JSON: {"sentences":[{"en":"...","es":"..."}],"choice":{"question_es":"...","options":[{"en":"...","es":"..."},{"en":"...","es":"..."}]}}'}`,
        sys);
      if(!data.sentences) throw Object.assign(new Error("bad"),{userMsg:"La IA devolvió un capítulo incompleto. Intenta de nuevo."});
      setStory(st=>({...st,
        pages:[...st.pages.map((p,i)=>i===st.pages.length-1?{...p,chosen:optIdx}:p),{sentences:data.sentences,choice:data.choice||null,chosen:null}],
        finished:isLast,
        key_phrase_en:data.key_phrase_en||st.key_phrase_en,
        key_phrase_es:data.key_phrase_es||st.key_phrase_es}));
      registerActivity("listen");
    }catch(e){setError(e.userMsg||"Error continuando la historia. Intenta de nuevo.");}
    setLoading(false);
  };

  const chip=(t,keyPrefix)=>(
    <button key={keyPrefix+t.id} onClick={()=>startStory(t)}
      style={{padding:"9px 14px",borderRadius:999,border:`1.5px solid ${C.line}`,background:C.paper,color:C.ink,fontSize:13,fontWeight:600,whiteSpace:"nowrap",justifySelf:"start"}}>
      {t.es}
    </button>);

  if(!story&&!loading) return(
    <div className="fadein">
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:20}}>
        <p style={{fontFamily:FEN,fontSize:18,marginBottom:4,textAlign:"center"}}>Read. Listen. Decide.</p>
        <p style={{fontSize:13,color:C.inkSoft,textAlign:"center",marginBottom:14}}>Un mini-cuento de 3 capítulos donde tú decides qué pasa. Tus decisiones son en inglés — entenderlas es parte del juego.</p>
        <BigButton onClick={()=>startStory()}>📖 Nueva historia (sorpresa)</BigButton>
        {error&&<p style={{fontSize:13,color:C.coral,marginTop:10,textAlign:"center"}}>{error}</p>}
        {personal.length>0&&(
          <div style={{marginTop:14}}>
            <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,margin:"0 0 8px"}}>✨ Tus temas</p>
            <ChipsWithSheet items={personal} onPick={t=>startStory(t)} limit={4} title="✨ Tus temas"/>
          </div>
        )}
        <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,margin:"14px 0 8px"}}>O elige una situación</p>
        <ChipsWithSheet items={[...topicSugs,...LISTEN_TOPICS.filter(t=>!topicSugs.some(x=>x.id===t.id))]} onPick={t=>startStory(t)} limit={5} title="Elige una situación"/>
      </div>
    </div>
  );

  if(loading&&!story) return <p className="fadein" style={{fontSize:14,color:C.inkSoft,textAlign:"center",padding:30}}>✍️ Escribiendo tu historia…</p>;

  const lastPage=story.pages[story.pages.length-1];
  return(
    <div className="fadein">
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8}}>
          <strong style={{fontSize:16}}>📖 {story.title_es}</strong>
          {story.topic_es&&<span style={{fontSize:11,padding:"3px 9px",borderRadius:999,background:C.paper,border:`1px solid ${C.line}`,color:C.inkSoft,flexShrink:0}}>{story.topic_es}</span>}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={()=>setShadow(v=>!v)}
            style={{padding:"7px 12px",borderRadius:999,border:`1.5px solid ${shadow?C.green:C.line}`,background:shadow?C.greenSoft:"transparent",color:shadow?C.green:C.inkSoft,fontWeight:700,fontSize:12}}>
            🗣️ Shadowing {shadow?"ON":"OFF"}
          </button>
          {SPEEDS.map(s=>(
            <button key={s.v} onClick={()=>setRate(s.v)}
              style={{padding:"7px 10px",borderRadius:999,border:`1.5px solid ${rate===s.v?C.blue:C.line}`,background:rate===s.v?C.blueSoft:"transparent",color:rate===s.v?C.blue:C.inkSoft,fontWeight:600,fontSize:12}}>
              {s.l}
            </button>
          ))}
        </div>
        {failed&&<AudioWarning/>}
      </div>

      {story.pages.map((p,pi)=>(
        <div key={pi} className="fadein" style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,margin:0}}>Capítulo {pi+1}{pi===2?" · Final":""}</p>
            <button onClick={()=>speak(p.sentences.map(s=>s.en).join(" "),{rate})} aria-label="Escuchar capítulo"
              style={{border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,borderRadius:999,padding:"6px 12px",fontSize:12,fontWeight:700}}>▶ Capítulo</button>
          </div>
          {p.sentences.map((s,si)=>{
            const k=pi+"-"+si;
            return(
              <div key={si} style={{marginBottom:shadow?12:6}}>
                <p style={{margin:0,lineHeight:1.6}}>
                  <span style={{fontFamily:FEN,fontSize:16.5}}>{s.en}</span>{" "}
                  <button onClick={()=>speak(s.en,{rate})} aria-label="Escuchar oración" style={{border:"none",background:"transparent",fontSize:15,padding:0}}>🔊</button>
                </p>
                {s.es&&(showEs[k]
                  ?<span onClick={()=>setShowEs(m=>({...m,[k]:false}))} style={{display:"block",fontSize:12,color:C.inkSoft,fontStyle:"italic",cursor:"pointer"}}>🇪🇸 {s.es}</span>
                  :<button onClick={()=>setShowEs(m=>({...m,[k]:true}))} style={{display:"block",padding:0,border:"none",background:"transparent",fontSize:11,color:C.inkSoft,textDecoration:"underline dotted",opacity:0.7}}>🇪🇸 traducción</button>)}
                {shadow&&<PronounceCheck target={s.en}/>}
              </div>);
          })}
          {p.choice&&(
            <div style={{marginTop:14,paddingTop:12,borderTop:`1px dashed ${C.line}`}}>
              <p style={{fontWeight:600,fontSize:14,marginBottom:8}}>🔀 {p.choice.question_es}</p>
              {p.choice.options.map((o,oi)=>{
                const picked=p.chosen===oi, decided=p.chosen!==null&&p.chosen!==undefined;
                return(
                  <button key={oi} onClick={()=>!decided&&pi===story.pages.length-1&&choose(oi)} disabled={decided||loading}
                    style={{display:"block",width:"100%",textAlign:"left",marginBottom:8,padding:"11px 14px",borderRadius:12,
                      border:`1.5px solid ${picked?C.green:C.line}`,background:picked?C.greenSoft:"transparent",
                      color:picked?C.green:C.ink,fontWeight:picked?700:500,fontSize:14,opacity:decided&&!picked?0.45:1}}>
                    <span style={{fontFamily:FEN}}>{o.en}</span>
                    {picked&&<span style={{fontSize:12,display:"block",color:C.inkSoft,fontStyle:"italic"}}>🇪🇸 {o.es}</span>}
                  </button>);
              })}
              {loading&&pi===story.pages.length-1&&<p style={{fontSize:13,color:C.inkSoft,margin:"4px 0 0"}}>✍️ Escribiendo el siguiente capítulo…</p>}
            </div>
          )}
        </div>
      ))}

      {error&&<p style={{fontSize:13,color:C.coral,marginBottom:10,textAlign:"center"}}>{error}</p>}

      {story.finished&&(
        <div className="fadein">
          {story.key_phrase_en&&(
            <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:12}}>
              <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,marginBottom:6}}>Expresión para tu mochila</p>
              <p style={{margin:0,fontSize:15}}><span className="hl" style={{fontFamily:FEN}}>{story.key_phrase_en}</span> — {story.key_phrase_es}
                <button onClick={()=>speak(story.key_phrase_en,{rate})} style={{border:"none",background:"transparent",fontSize:15,marginLeft:6}}>🔊</button>
              </p>
            </div>
          )}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>startStory()} style={{flex:1,padding:14,borderRadius:14,border:`2px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15}}>📖 Otra historia</button>
            <button onClick={()=>{setStory(null);setError(null);try{sessionStorage.removeItem("fluido-story");}catch(e){}}}
              style={{flex:1,padding:14,borderRadius:14,border:`2px dashed ${C.green}`,background:"transparent",color:C.green,fontWeight:600,fontSize:15}}>🎯 Elegir tema</button>
          </div>
        </div>
      )}
    </div>
  );
}

// Hub de Escuchar: alterna entre diálogos e historias
function ListenHub(props){
  const [mode,setMode]=useState("dialog");
  const pill=(id,label)=>(
    <button onClick={()=>setMode(id)}
      style={{flex:1,padding:"10px 12px",borderRadius:12,border:`1.5px solid ${mode===id?C.green:C.line}`,background:mode===id?C.greenSoft:"transparent",color:mode===id?C.green:C.inkSoft,fontWeight:700,fontSize:14}}>
      {label}
    </button>);
  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {pill("dialog","🎧 Diálogos")}
        {pill("story","📖 Historia")}
      </div>
      {mode==="dialog"?<Listen {...props}/>:<Story state={props.state} registerActivity={props.registerActivity}/>}
    </div>
  );
}

function Listen({state,save,registerActivity}){
  const sv=listenLoad();
  const [exercise,setExercise]=useState(sv?.exercise||null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [info,setInfo]=useState(null);
  const [picked,setPicked]=useState(sv?.picked??null);
  const [revealed,setRevealed]=useState(sv?.revealed||false);
  const [readingMode,setReadingMode]=useState(false);
  const [rate,setRate]=useState(1.0);
  const [playing,setPlaying]=useState(false);
  const [activeLine,setActiveLine]=useState(-1);
  const [shadow,setShadow]=useState(false);
  const [showEs,setShowEs]=useState({});
  const [topicSugs]=useState(()=>[...LISTEN_TOPICS].sort(()=>Math.random()-0.5).slice(0,10));
  const [manageTopics,setManageTopics]=useState(false);
  const [personal,setPersonal]=useState(()=>loadPersonalTopics());
  const [genLoading,setGenLoading]=useState(false);
  const [addingTopic,setAddingTopic]=useState(false);
  const [customText,setCustomText]=useState("");
  const sig=profileSig(state);
  const personalStale=personal.topics.length>0&&personal.sig!==sig;

  const generatePersonalTopics=async()=>{
    setGenLoading(true);setError(null);
    try{
      const r=await askAI_JSON(
        `Perfil del estudiante de inglés: ${profileForPrompts(state,false)}\n\nGenera 8 situaciones/escenarios de listening directamente relevantes para los objetivos, trabajo e intereses de ESTE perfil (ej: si trabaja en tecnología → daily standup, entrevista técnica, reunión con cliente; si va a viajar → situaciones de ese viaje; si le gusta un hobby → escenas de ese hobby). Cada situación debe ser concreta y distinta. Devuelve SOLO JSON: {"topics":[{"es":"emoji + nombre corto en español (máx 4 palabras)","en":"specific description in English of the situation for a 4-6 line dialogue"}]}`,
        'Eres un diseñador de contenido educativo. Devuelve JSON con "topics": array de exactamente 8 objetos {es,en}.');
      const topics=(r.topics||[]).filter(t=>t.es&&t.en).slice(0,8).map((t,i)=>({id:"p"+Date.now()+"_"+i,es:t.es,en:t.en}));
      if(!topics.length) throw Object.assign(new Error("empty"),{userMsg:"La IA no devolvió temas válidos. Intenta de nuevo."});
      // Conserva los temas agregados a mano (id que empieza con "c")
      const custom=personal.topics.filter(t=>t.id.startsWith("c"));
      const next={sig,topics:[...topics,...custom]};
      setPersonal(next);savePersonalTopics(next);
    }catch(e){setError(e.userMsg||"Error generando tus temas.");}
    setGenLoading(false);
  };

  const addCustomTopic=()=>{
    const txt=customText.trim(); if(!txt) return;
    const t={id:"c"+Date.now(),es:"⭐ "+txt.slice(0,40),en:txt};
    const next={sig:personal.sig||sig,topics:[...personal.topics,t]};
    setPersonal(next);savePersonalTopics(next);
    setCustomText("");setAddingTopic(false);
  };
  const removePersonalTopic=(id)=>{
    const next={...personal,topics:personal.topics.filter(t=>t.id!==id)};
    setPersonal(next);savePersonalTopics(next);
  };
  const {speak,stop,failed,supported}=useSpeech();
  useEffect(()=>()=>stop(),[stop]);
  useEffect(()=>{if(failed)setReadingMode(true);},[failed]);
  useEffect(()=>{ if(exercise) listenSave({exercise,picked,revealed}); },[exercise,picked,revealed]);

  const newExercise=async(topicOverride)=>{
    setLoading(true);setError(null);setInfo(null);setExercise(null);setPicked(null);setRevealed(false);stop();setPlaying(false);setActiveLine(-1);setShadow(false);setShowEs({});
    try{sessionStorage.removeItem("fluido-listen");}catch(e){}
    try{
      // Si el usuario eligió un tema explícito, generamos fresco con IA (no reutilizamos banco)
      if(!topicOverride){
        const bank=loadBank();
        const used=new Set(state.usedListening||[]);
        const cands=bank.listening.filter(e=>e.id&&e.pv>=4&&!used.has(e.id)&&e.level===state.level);
        if(cands.length>0){
          const pick=cands[Math.floor(Math.random()*cands.length)];
          setExercise(pick);save({...state,usedListening:[...(state.usedListening||[]),pick.id].slice(-300)});
          setInfo("♻️ Audio del banco local — sin costo de IA.");setLoading(false);return;
        }
      }
      const topic=topicOverride||pickListenTopic(personal.topics);
      pushRecentTopic(topic.id);
      const lvlDesc=LISTEN_LEVEL_DESC[state.level]||"intermedio";
      const a0L = state.level==="A0" ? ' NIVEL A0: el diálogo debe ser de solo 3-4 líneas MUY cortas y simples.' : "";
      const esL = (state.level==="A0"||state.level==="A2") ? ' Cada item de dialogue debe incluir además "line_es" con su traducción al español.' : "";
      const data=await askAI_JSON(
        `Genera un ejercicio de listening en inglés: una CONVERSACIÓN REAL (4-6 líneas) entre dos personas. SITUACIÓN OBLIGATORIA del diálogo: ${topic.en}. El diálogo debe ocurrir dentro de esa situación concreta — NO lo conviertas en una charla sobre objetivos personales, aprendizaje de idiomas ni intereses genéricos. Usa nombres de personas variados y poco comunes (evita Sarah, Tom, John, Emma). Es crítico que sea una conversación auténtica, no dos monólogos paralelos: cada línea debe reaccionar, responder o hacer una pregunta sobre lo que dijo la línea anterior (mostrar sorpresa, pedir detalles, discrepar suavemente, hacer seguimiento).\n\nREGLA MÁS IMPORTANTE — nivel del estudiante: ${state.level} (${lvlDesc}). CADA línea del diálogo debe cumplir estrictamente esa restricción. Antes de responder, revisa línea por línea: si una palabra o estructura excede el nivel, reemplázala por una más simple. Ante la duda, hazlo MÁS FÁCIL, nunca más difícil. La key_phrase_en también debe ser de ese nivel.\n\nEl diálogo debe contar una MINI-HISTORIA con un propósito concreto (algo pasó, alguien necesita algo, hay una pequeña sorpresa o decisión) — nunca un intercambio de datos sueltos.\n\n${LISTEN_LEVEL_EXAMPLE[state.level]?`EJEMPLO de la fluidez y estilo esperados para el nivel ${state.level} (NO copies el tema, solo imita el estilo natural): ${LISTEN_LEVEL_EXAMPLE[state.level]}\n\n`:""}NATURALIDAD: simplicidad NO significa inglés robótico ni telegráfico. Incluso en niveles bajos, el diálogo debe sonar como hablaría un nativo con vocabulario simple: usa contracciones naturales (I'm, it's, that's, don't), conectores básicos (and, but, so, because) y una progresión lógica con apertura, desarrollo y cierre. Nadie responde algo que aún no le han preguntado. MAL ejemplo (PROHIBIDO, robótico y desordenado): "I use ServiceNow." / "What do you do?" / "I fix computers." / "That is cool." / "I like it." BIEN ejemplo: "Hi Kai! How's the new job?" / "It's great! I fix computers all day." / "Oh nice! Is it hard?" / "A little, but I like it a lot."\n\nDale un giro específico e inesperado a la situación (semilla: ${Math.random().toString(36).slice(2)}).${a0L}${esL}\n\nDevuelve JSON: {"title_es":"título","dialogue":[{"speaker":"nombre","line":"inglés"}],"question_es":"pregunta de comprensión","options_es":["A","B","C"],"correct_index":0,"key_phrase_en":"expresión útil","key_phrase_es":"traducción"}`,
        `Eres un profesor de inglés experto en niveles CEFR que crea diálogos realistas y variados donde las personas genuinamente se escuchan y responden entre sí, no monólogos alternados. Tus dos prioridades: (1) respetar estrictamente el nivel de dificultad — un estudiante ${state.level} debe entender sin frustrarse — y (2) que el diálogo suene 100% natural, como hablan los nativos en la vida real, nunca robótico ni telegráfico.`);
      data.id="L"+Date.now()+Math.random().toString(36).slice(2,6);data.level=state.level;data.topic_es=topic.es;data.pv=4;
      setExercise(data);const bank2=loadBank();bank2.listening=[...bank2.listening,data];saveBank(bank2);
      save({...state,usedListening:[...(state.usedListening||[]),data.id].slice(-300)});
      setInfo(`🎲 Tema: ${topic.es}`);
    }catch(e){setError(e.userMsg||"Error al obtener el ejercicio.");}
    setLoading(false);
  };
  const play=()=>{if(!exercise)return;setPlaying(true);setActiveLine(0);speak(exercise.dialogue,{rate,onLine:setActiveLine,onEnd:()=>{setPlaying(false);setActiveLine(-1);}});};
  const stopAll=()=>{stop();setPlaying(false);setActiveLine(-1);};
  const answer=i=>{if(picked!==null)return;setPicked(i);recordPerf("listen", state.level, i===exercise.correct_index);registerActivity("listen");};
  // Paleta fija para distinguir speakers, independiente del tema activo del usuario.
  // No usamos C.blue/C.green/C.coral porque en algunos temas (ej. "Noche verde") el
  // color de acento coincide exactamente con el verde o el coral, dejando a dos
  // personajes con el mismo color.
  const SPEAKER_PALETTE = ["#F97316","#38BDF8","#EC4899","#A3E635"]; // naranja, celeste, fucsia, lima
  const speakerColorFor=(dialogue)=>{
    const speakers=[...new Set(dialogue.map(d=>d.speaker))];
    const map={};
    speakers.forEach((s,i)=>{map[s]=SPEAKER_PALETTE[i%SPEAKER_PALETTE.length];});
    return map;
  };

  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Escuchar</h2>
      <p style={{marginBottom:14,fontSize:14,color:C.inkSoft}}>Escucha primero <span className="hl">sin leer</span>. La transcripción se revela al final.</p>
      {!exercise&&!loading&&(
        <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:20}}>
          <p style={{fontFamily:FEN,fontSize:18,marginBottom:14,textAlign:"center"}}>Train your ear.</p>
          <BigButton onClick={()=>newExercise()}>🎲 Nuevo audio (sorpresa)</BigButton>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"16px 0 8px"}}>
            <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,margin:0}}>✨ Tus temas</p>
            {personal.topics.length>0&&(
              <button onClick={()=>setManageTopics(v=>!v)}
                style={{border:"none",background:"transparent",color:manageTopics?C.blue:C.inkSoft,fontSize:12,fontWeight:700,textDecoration:"underline",padding:0}}>
                {manageTopics?"✓ Listo":"Editar"}
              </button>
            )}
          </div>
          {personal.topics.length===0?(
            <div>
              <p style={{fontSize:13,color:C.inkSoft,marginBottom:8}}>Fluido puede crear situaciones a tu medida según tus objetivos e intereses del perfil.</p>
              <button onClick={generatePersonalTopics} disabled={genLoading}
                style={{width:"100%",padding:12,borderRadius:12,border:`2px dashed ${C.green}`,background:"transparent",color:C.green,fontWeight:600,fontSize:14,opacity:genLoading?0.6:1}}>
                {genLoading?"✨ Creando tus temas…":"✨ Generar temas según mi perfil"}
              </button>
            </div>
          ):(
            <div>
              {personalStale&&(
                <button onClick={generatePersonalTopics} disabled={genLoading}
                  style={{width:"100%",marginBottom:8,padding:"9px 12px",borderRadius:12,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:13,opacity:genLoading?0.6:1}}>
                  {genLoading?"✨ Actualizando…":"🔄 Tu perfil cambió — actualizar mis temas"}
                </button>
              )}
              {manageTopics?(
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {personal.topics.map(t=>(
                    <span key={t.id} style={{display:"inline-flex",alignItems:"center",borderRadius:999,border:`1.5px dashed ${C.line}`,background:C.card}}>
                      <span style={{padding:"9px 4px 9px 14px",color:C.ink,fontSize:13,fontWeight:600}}>{t.es}</span>
                      <button onClick={()=>removePersonalTopic(t.id)} aria-label={`Eliminar tema ${t.es}`}
                        style={{padding:"9px 12px 9px 4px",border:"none",background:"transparent",color:C.coral,fontSize:13,fontWeight:700}}>✕</button>
                    </span>
                  ))}
                  {!genLoading&&(
                    <button onClick={generatePersonalTopics}
                      style={{padding:"9px 14px",borderRadius:999,border:`1.5px dashed ${C.blue}`,background:"transparent",color:C.blue,fontSize:13,fontWeight:600}}>↻ Regenerar todos</button>
                  )}
                  {genLoading&&<span style={{alignSelf:"center",fontSize:13,color:C.inkSoft}}>✨ Generando…</span>}
                </div>
              ):(
                <div>
                  <ChipsWithSheet items={personal.topics} onPick={t=>newExercise(t)} limit={4} title="✨ Tus temas"/>
                  {!genLoading&&(
                    <button onClick={()=>setAddingTopic(v=>!v)}
                      style={{marginTop:8,padding:"8px 13px",borderRadius:999,border:`1.5px dashed ${C.line}`,background:"transparent",color:C.inkSoft,fontSize:12.5,fontWeight:600}}>＋ Agregar tema propio</button>
                  )}
                </div>
              )}
            </div>
          )}
          {addingTopic&&(
            <div className="fadein" style={{marginTop:8,display:"flex",gap:8}}>
              <input value={customText} onChange={e=>setCustomText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCustomTopic()} autoFocus
                placeholder="Ej: daily standup de mi equipo, negociar con un proveedor…"
                style={{flex:1,padding:"10px 12px",borderRadius:12,border:`1.5px solid ${C.line}`,background:C.paper,color:C.ink,fontSize:14}}/>
              <button onClick={addCustomTopic} disabled={!customText.trim()}
                style={{padding:"10px 14px",borderRadius:12,border:"none",background:C.green,color:"#fff",fontWeight:700,fontSize:14,opacity:customText.trim()?1:0.5}}>OK</button>
            </div>
          )}

          <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,margin:"14px 0 8px"}}>O elige una situación</p>
          <ChipsWithSheet items={[...topicSugs,...LISTEN_TOPICS.filter(t=>!topicSugs.some(x=>x.id===t.id))]} onPick={t=>newExercise(t)} limit={5} title="Elige una situación"/>
        </div>
      )}
      {loading&&<p style={{color:C.inkSoft}}>Preparando ejercicio…</p>}
      {error&&<p style={{color:C.coral}}>{error}</p>}
      {info&&<p style={{color:C.green,fontSize:13}}>{info}</p>}
      {exercise&&(
        <div>
          <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <strong>{exercise.title_es}</strong>
              {exercise.topic_es&&<span style={{fontSize:11,padding:"3px 9px",borderRadius:999,background:C.paper,border:`1px solid ${C.line}`,color:C.inkSoft,flexShrink:0}}>{exercise.topic_es}</span>}
            </div>
            {!readingMode?(
              <React.Fragment>
                <div style={{display:"flex",alignItems:"center",gap:10,marginTop:12}}>
                  <button onClick={playing?stopAll:play} style={{width:56,height:56,borderRadius:"50%",border:"none",background:C.blue,color:"#fff",fontSize:22}} aria-label={playing?"Detener":"Reproducir"}>{playing?"■":"▶"}</button>
                  <div style={{flex:1}}>
                    <p style={{fontSize:12,color:C.inkSoft,marginBottom:5}}>Velocidad de reproducción</p>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                      {SPEEDS.map(o=>(
                        <button key={o.v} onClick={()=>setRate(o.v)}
                          style={{padding:"5px 10px",borderRadius:8,fontSize:12,fontWeight:600,border:`1.5px solid ${rate===o.v?C.blue:C.line}`,background:rate===o.v?C.blueSoft:"transparent",color:rate===o.v?C.blue:C.inkSoft}}>
                          {o.l}
                        </button>))}
                    </div>
                  </div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                  <p style={{fontSize:12,color:C.inkSoft}}>Escúchalo las veces que necesites.</p>
                  <button onClick={()=>setReadingMode(true)} style={{border:"none",background:"transparent",color:C.inkSoft,fontSize:12,textDecoration:"underline"}}>¿No escuchas nada?</button>
                </div>
                {failed&&<AudioWarning/>}
                {exercise.dialogue.length>0 && (()=>{
                  const speakers=[...new Set(exercise.dialogue.map(d=>d.speaker))];
                  const speakerColor=speakerColorFor(exercise.dialogue);
                  return(
                    <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:6}}>
                      <div style={{display:"flex",gap:14,marginBottom:4}}>
                        {speakers.map(s=>(
                          <span key={s} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:speakerColor[s],fontWeight:600}}>
                            <span style={{width:9,height:9,borderRadius:"50%",background:speakerColor[s],display:"inline-block"}}/>{s}
                          </span>
                        ))}
                      </div>
                      {playing && exercise.dialogue.map((d,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:8,opacity:activeLine===i?1:0.35,transition:"opacity 0.2s"}}>
                          <span style={{width:8,height:8,borderRadius:"50%",background:speakerColor[d.speaker],flexShrink:0}}/>
                          <span style={{fontSize:13,fontWeight:activeLine===i?700:500,color:speakerColor[d.speaker]}}>{d.speaker}</span>
                          {activeLine===i&&<span style={{fontSize:11,color:speakerColor[d.speaker]}}>habla ahora…</span>}
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </React.Fragment>
            ):(
              <div style={{marginTop:12}}>
                {failed&&<AudioWarning/>}
                <p style={{fontSize:13,color:C.inkSoft,margin:"10px 0 8px"}}><strong>Modo lectura:</strong> lee el diálogo una vez a ritmo normal, luego ocúltalo para responder.</p>
                {!revealed&&picked===null?<ReadOnce dialogue={exercise.dialogue}/>:null}
                {supported&&<button onClick={()=>setReadingMode(false)} style={{border:"none",background:"transparent",color:C.blue,fontSize:12,textDecoration:"underline",marginTop:6}}>Reintentar con audio</button>}
              </div>
            )}
          </div>
          <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginTop:12}}>
            <p style={{fontWeight:600,marginBottom:10}}>{exercise.question_es}</p>
            {exercise.options_es.map((op,i)=>{
              const isC=i===exercise.correct_index,isP=picked===i;
              let border=C.line,bg="transparent",color=C.ink;
              if(picked!==null){if(isC){border=C.green;bg=C.greenSoft;color=C.green;}else if(isP){border=C.coral;bg=C.coralSoft;color=C.coral;}}
              return<button key={i} onClick={()=>answer(i)} style={{display:"block",width:"100%",textAlign:"left",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${border}`,background:bg,color,fontSize:15,marginBottom:8,fontWeight:picked!==null&&isC?600:400}}>{op}</button>;
            })}
            {picked!==null&&<p className="fadein" style={{marginTop:4,fontWeight:600,color:picked===exercise.correct_index?C.green:C.coral}}>{picked===exercise.correct_index?"✓ ¡Correcto! Tu oído está despertando.":"Casi. Revisa la transcripción y prueba otro audio."}</p>}
          </div>
          {picked!==null&&(
            <div className="fadein" style={{marginTop:12}}>
              {!revealed?<BigButton onClick={()=>setRevealed(true)}>Ver transcripción</BigButton>:(
                <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18}}>
                  <button onClick={()=>setShadow(v=>!v)}
                    style={{marginBottom:12,padding:"7px 14px",borderRadius:999,border:`1.5px solid ${shadow?C.green:C.line}`,background:shadow?C.greenSoft:"transparent",color:shadow?C.green:C.inkSoft,fontWeight:700,fontSize:13}}>
                    🗣️ Shadowing {shadow?"activado":"— escucha y repite cada línea"}
                  </button>
                  {exercise.dialogue.map((d,i)=>{const sc=speakerColorFor(exercise.dialogue);return(
                    <div key={i} style={{marginBottom:shadow?16:8}}>
                      <p style={{margin:0,lineHeight:1.5}}>
                        <strong style={{fontSize:13,color:sc[d.speaker]}}>{d.speaker}:</strong>{" "}
                        <span style={{fontFamily:FEN,fontSize:16}}>{d.line}</span>{" "}
                        <button onClick={()=>speak(d.line,{rate})} aria-label="Escuchar esta línea" style={{border:"none",background:"transparent",fontSize:16,padding:0}}>🔊</button>
                        {d.line_es&&(showEs[i]
                          ?<span onClick={()=>setShowEs(s=>({...s,[i]:false}))} style={{display:"block",fontSize:12,color:C.inkSoft,fontStyle:"italic",cursor:"pointer"}}>🇪🇸 {d.line_es}</span>
                          :<button onClick={()=>setShowEs(s=>({...s,[i]:true}))} style={{display:"block",marginTop:2,padding:0,border:"none",background:"transparent",fontSize:11,color:C.inkSoft,textDecoration:"underline dotted",opacity:0.75}}>🇪🇸 traducción</button>)}
                      </p>
                      {shadow&&<PronounceCheck target={d.line}/>}
                    </div>);})}
                  <div style={{borderTop:`1px dashed ${C.line}`,paddingTop:10,marginTop:10}}>
                    <p style={{fontSize:13,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1}}>Expresión para tu mochila</p>
                    <p style={{margin:"4px 0 0",fontFamily:FEN,fontSize:16}}><span className="hl">{exercise.key_phrase_en}</span><span style={{fontFamily:FUI,fontSize:13,color:C.inkSoft}}> — {exercise.key_phrase_es}</span></p>
                  </div>
                </div>
              )}
              <div style={{display:"flex",gap:8,marginTop:10}}>
                <button onClick={()=>newExercise()} style={{flex:1,padding:14,borderRadius:14,border:`2px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15}}>🎲 Otro audio</button>
                <button onClick={()=>{setExercise(null);setPicked(null);setRevealed(false);setInfo(null);try{sessionStorage.removeItem("fluido-listen");}catch(e){}}}
                  style={{flex:1,padding:14,borderRadius:14,border:`2px dashed ${C.green}`,background:"transparent",color:C.green,fontWeight:600,fontSize:15}}>🎯 Elegir tema</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
function ReadOnce({dialogue}){
  const [visible,setVisible]=useState(true);
  const [showEs,setShowEs]=useState({});
  if(!visible) return<p style={{fontSize:13,color:C.inkSoft,fontStyle:"italic"}}>Diálogo oculto. Responde la pregunta de memoria 👇</p>;
  const speakers=[...new Set(dialogue.map(d=>d.speaker))];
  const sc={}; speakers.forEach((s,i)=>{sc[s]=[C.blue,C.green,C.coral][i%3];});
  return(
    <div>
      <div style={{background:C.paper,borderRadius:12,padding:12}}>
        {dialogue.map((d,i)=><p key={i} style={{marginBottom:6,lineHeight:1.5}}><strong style={{fontSize:12,color:sc[d.speaker]}}>{d.speaker}:</strong>{" "}<span style={{fontFamily:FEN,fontSize:15}}>{d.line}</span>{d.line_es&&(showEs[i]
          ?<span onClick={()=>setShowEs(s=>({...s,[i]:false}))} style={{display:"block",fontSize:11,color:C.inkSoft,fontStyle:"italic",cursor:"pointer"}}>🇪🇸 {d.line_es}</span>
          :<button onClick={()=>setShowEs(s=>({...s,[i]:true}))} style={{display:"block",marginTop:2,padding:0,border:"none",background:"transparent",fontSize:10,color:C.inkSoft,textDecoration:"underline dotted",opacity:0.75}}>🇪🇸 traducción</button>)}</p>)}
      </div>
      <button onClick={()=>setVisible(false)} style={{width:"100%",marginTop:8,padding:10,borderRadius:10,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:14}}>Listo, ocultar diálogo</button>
    </div>
  );
}

function ProfileEditor({state,save,onClose}){
  const p=state.profile||{};
  const e=p.extra||{};
  const [name,setName]=useState(p.name||"");
  const [role,setRole]=useState(p.role||"");
  const [goals,setGoals]=useState(p.goals||[]);
  const [interests,setInterests]=useState(p.interests||[]);
  const [level,setLevel]=useState(state.level||"B1");
  const [nickname,setNickname]=useState(e.nickname||"");
  const [gender,setGender]=useState(e.gender||"");
  const [age,setAge]=useState(e.age?String(e.age):"");
  const [livingWith,setLivingWith]=useState(e.livingWith||"");
  const [hobbies,setHobbies]=useState(e.hobbies||"");
  const [reason,setReason]=useState(e.reason||"");
  const [section,setSection]=useState("basic"); // "basic" | "extra"

  const toggle=(list,setList,item)=>setList(list.includes(item)?list.filter(x=>x!==item):[...list,item]);
  const iStyle={width:"100%",marginTop:6,padding:"12px 14px",fontSize:15,borderRadius:12,border:`1.5px solid ${C.line}`,background:C.card,color:C.ink,outline:"none"};
  const taStyle={...iStyle,resize:"vertical",minHeight:72};

  const handleSave=()=>{
    const extra=(nickname||gender||age||livingWith||hobbies||reason)?{
      nickname:nickname.trim()||null,gender:gender||null,age:age?parseInt(age):null,
      livingWith:livingWith||null,hobbies:hobbies.trim()||null,reason:reason.trim()||null
    }:null;
    save({...state,level,profile:{...p,name:name.trim()||p.name,role:role.trim()||p.role,goals,interests,extra}});
    onClose();
  };

  return(
    <div className="fadein" style={{background:C.card,border:`1.5px solid ${C.blue}`,borderRadius:16,padding:18,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <p style={{fontWeight:700,fontSize:16}}>✏️ Editar perfil</p>
        <button onClick={onClose} style={{border:"none",background:"transparent",color:C.inkSoft,fontSize:20,lineHeight:1}}>×</button>
      </div>
      {/* Tabs */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[{id:"basic",label:"📋 Básico"},{id:"extra",label:"✨ Extra"}].map(t=>(
          <button key={t.id} onClick={()=>setSection(t.id)}
            style={{flex:1,padding:"10px 0",borderRadius:10,border:`1.5px solid ${section===t.id?C.blue:C.line}`,background:section===t.id?C.blueSoft:"transparent",color:section===t.id?C.blue:C.inkSoft,fontWeight:600,fontSize:13}}>
            {t.label}
          </button>))}
      </div>

      {section==="basic"&&(
        <div className="fadein" style={{display:"flex",flexDirection:"column",gap:12}}>
          <div><label style={{fontSize:13,color:C.inkSoft}}>Nombre</label><input value={name} onChange={e=>setName(e.target.value)} style={iStyle}/></div>
          <div><label style={{fontSize:13,color:C.inkSoft}}>¿A qué te dedicas?</label><input value={role} onChange={e=>setRole(e.target.value)} placeholder="Consultor, estudiante…" style={iStyle}/></div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>¿Para qué necesitas el inglés?</label>
            <div style={{marginTop:8}}><ChipGrid options={GOAL_OPTIONS} selected={goals} onToggle={o=>toggle(goals,setGoals,o)}/></div>
          </div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>Temas de interés</label>
            <div style={{marginTop:8}}><ChipGrid options={INTEREST_OPTIONS} selected={interests} onToggle={o=>toggle(interests,setInterests,o)}/></div>
          </div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>Nivel</label>
            <div style={{display:"flex",gap:8,marginTop:6}}>
              {LEVELS.map(lv=>(
                <button key={lv.id} onClick={()=>setLevel(lv.id)}
                  style={{flex:1,padding:"10px 6px",borderRadius:10,border:`2px solid ${level===lv.id?C.blue:C.line}`,background:level===lv.id?C.blueSoft:C.card,color:level===lv.id?C.blue:C.inkSoft,fontWeight:600,fontSize:13}}>
                  {lv.label}
                </button>))}
            </div>
          </div>
        </div>
      )}

      {section==="extra"&&(
        <div className="fadein" style={{display:"flex",flexDirection:"column",gap:12}}>
          <p style={{fontSize:13,color:C.inkSoft,marginTop:-4}}>Todo opcional. Más info = escenarios más personales.</p>
          <div><label style={{fontSize:13,color:C.inkSoft}}>¿Cómo prefieren llamarte?</label><input value={nickname} onChange={e=>setNickname(e.target.value)} placeholder="Apodo, pronombres…" style={iStyle}/></div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>Género</label>
            <div style={{marginTop:8}}><ChipGrid options={GENDER_OPTIONS} selected={gender?[gender]:[]} onToggle={o=>setGender(gender===o?"":o)}/></div>
          </div>
          <div><label style={{fontSize:13,color:C.inkSoft}}>Edad</label><input type="number" value={age} onChange={e=>setAge(e.target.value)} placeholder="Opcional" min="10" max="99" style={{...iStyle,width:"100px"}}/></div>
          <div>
            <label style={{fontSize:13,color:C.inkSoft}}>¿Con quién vives?</label>
            <div style={{marginTop:8}}><ChipGrid options={LIVING_OPTIONS} selected={livingWith?[livingWith]:[]} onToggle={o=>setLivingWith(livingWith===o?"":o)}/></div>
          </div>
          <div><label style={{fontSize:13,color:C.inkSoft}}>¿Qué te gusta hacer?</label><textarea value={hobbies} onChange={e=>setHobbies(e.target.value)} placeholder="Guitarra, fútbol, hiking, gaming…" style={taStyle}/></div>
          <div><label style={{fontSize:13,color:C.inkSoft}}>¿Por qué quieres aprender inglés?</label><textarea value={reason} onChange={e=>setReason(e.target.value)} placeholder="Tu historia y motivación…" style={taStyle}/></div>
        </div>
      )}

      <button onClick={handleSave}
        style={{width:"100%",marginTop:16,padding:"13px 0",borderRadius:12,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:15}}>
        Guardar cambios
      </button>
    </div>
  );
}

function Settings({state,save,onAIChanged,onThemeChange}){
  const [expanded,setExpanded]=useState(null);
  const [editKeys,setEditKeys]=useState({});
  const [testState,setTestState]=useState({});
  const [editingProfile,setEditingProfile]=useState(false);
  const savedTheme=getSavedTheme();

  // ── Voz TTS ──
  const {speak,voices}=useSpeech();
  const [voiceName,setVoiceName]=useState(getSavedVoiceName());

  // ── Recordatorio diario ──
  const [reminder,setReminder]=useState(()=>{try{return JSON.parse(localStorage.getItem("fluido-reminder")||"null")||{enabled:false,time:"20:00"};}catch(e){return{enabled:false,time:"20:00"};}});
  const saveReminder=(r)=>{setReminder(r);try{localStorage.setItem("fluido-reminder",JSON.stringify(r));}catch(e){}};
  const toggleReminder=async()=>{
    if(!reminder.enabled){
      if(!("Notification" in window)){alert("Tu navegador no soporta notificaciones.");return;}
      const p=await Notification.requestPermission();
      if(p!=="granted"){alert("Necesito permiso de notificaciones para poder recordarte.");return;}
      saveReminder({...reminder,enabled:true});
    } else saveReminder({...reminder,enabled:false});
  };

  const cfg=getAIConfig()||{active:null,keys:{}};
  const savedKeys=cfg.keys||{};
  const setTS=(pid,val)=>setTestState(t=>({...t,[pid]:val}));
  const getKey=pid=>editKeys[pid]!==undefined?editKeys[pid]:(savedKeys[pid]||"");

  const handleTest=async(pid)=>{
    const key=getKey(pid).trim();
    if(!key){setTS(pid,{error:"Ingresa tu clave primero."});return;}
    setTS(pid,{testing:true});
    try{
      await pingProvider(pid,key);
      setTS(pid,{ok:true});
      setAIConfig({active:cfg.active||pid,keys:{...savedKeys,[pid]:key}});
    }catch(e){setTS(pid,{error:e.userMsg||e.message||"Error de conexión."});}
  };
  const handleActivate=pid=>{
    const key=getKey(pid).trim(); if(!key) return;
    setAIConfig({active:pid,keys:{...savedKeys,[pid]:key}});onAIChanged();
  };
  const handleDisconnect=()=>{
    if(!window.confirm("¿Desconectar la IA?")) return;
    localStorage.removeItem(AI_KEY);localStorage.removeItem("fluido-ai");onAIChanged();
  };
  // ── Respaldo de progreso ──
  const exportProgress=()=>{
    const data={};
    const keys=["fluido-state","fluido-bank","fluido-theme","fluido-vocab-srs","fluido-verbs-srs","fluido-ingles-v1","fluido-voice","fluido-reminder","fluido-perf-stats"];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("fluido-vex-"))keys.push(k);}
    keys.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)data[k]=v;});
    const payload={app:"fluido",version:1,date:new Date().toISOString(),data};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`fluido-respaldo-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(a.href);
  };
  const importProgress=(file)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const payload=JSON.parse(reader.result);
        if(payload.app!=="fluido"||!payload.data) throw new Error("formato");
        if(!window.confirm(`Respaldo del ${(payload.date||"").slice(0,10)}. Esto reemplazará tu progreso actual (racha, mazos, repasos). ¿Continuar?`)) return;
        Object.entries(payload.data).forEach(([k,v])=>localStorage.setItem(k,v));
        alert("✓ Progreso restaurado. La app se recargará.");
        window.location.reload();
      }catch(e){alert("El archivo no es un respaldo válido de Fluido.");}
    };
    reader.readAsText(file);
  };

  const resetProfile=()=>{if(!window.confirm("¿Rehacer el cuestionario? Tu racha y mazo se mantienen.")) return;save({...state,profile:null});};
  const resetAll=()=>{if(!window.confirm("⚠️ Borra TODO incluyendo claves y progreso. ¿Seguro?")) return;localStorage.clear();window.location.reload();};
  const activeProv=PROVIDERS.find(p=>p.id===cfg.active);

  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:14}}>Ajustes</h2>

      {/* --- VOZ TTS --- */}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:14}}>
        <p style={{fontWeight:600,marginBottom:4}}>🗣️ Voz del audio en inglés</p>
        <p style={{fontSize:13,color:C.inkSoft,marginBottom:10}}>Elige el acento y la voz con que Fluido lee en inglés. Al cambiarla escucharás una muestra.</p>
        <select value={voiceName}
          onChange={e=>{const v=e.target.value;setVoiceName(v);setSavedVoiceName(v);setTimeout(()=>speak("Hello! This is how I sound."),150);}}
          style={{width:"100%",padding:"11px 12px",borderRadius:12,border:`1.5px solid ${C.line}`,background:C.paper,color:C.ink,fontSize:14}}>
          <option value="auto">✨ Automática (la mejor disponible)</option>
          {[...voices].sort((a,b)=>rankVoice(b)-rankVoice(a)).map(v=>(
            <option key={v.name} value={v.name}>{v.lang.toLowerCase().startsWith("en-us")?"🇺🇸":v.lang.toLowerCase().startsWith("en-gb")?"🇬🇧":"🌐"} {v.name} ({v.lang})</option>
          ))}
        </select>
        {!voices.length&&<p style={{fontSize:12,color:C.inkSoft,marginTop:8}}>Cargando voces… si no aparecen, tu navegador no expone la lista y se usará la mejor automáticamente.</p>}
      </div>

      {/* --- RECORDATORIO DIARIO --- */}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
          <div>
            <p style={{fontWeight:600,marginBottom:2}}>🔔 Recordatorio diario</p>
            <p style={{fontSize:13,color:C.inkSoft,margin:0}}>Te avisa a la hora elegida. Funciona con la app o PWA abierta (aunque sea en segundo plano).</p>
          </div>
          <button onClick={toggleReminder}
            style={{flexShrink:0,padding:"9px 16px",borderRadius:999,border:"none",background:reminder.enabled?C.green:C.paper,color:reminder.enabled?"#fff":C.inkSoft,fontWeight:700,fontSize:13,boxShadow:reminder.enabled?"none":`inset 0 0 0 1.5px ${C.line}`}}>
            {reminder.enabled?"ON":"OFF"}
          </button>
        </div>
        {reminder.enabled&&(
          <div className="fadein" style={{marginTop:12,display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:13,color:C.inkSoft}}>Hora del recordatorio:</span>
            <input type="time" value={reminder.time} onChange={e=>saveReminder({...reminder,time:e.target.value})}
              style={{padding:"8px 10px",borderRadius:10,border:`1.5px solid ${C.line}`,background:C.paper,color:C.ink,fontSize:14}}/>
          </div>
        )}
      </div>

      {/* --- TEMA --- */}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:14}}>
        <p style={{fontWeight:600,marginBottom:4}}>🎨 Tema y apariencia</p>
        <p style={{fontSize:13,color:C.inkSoft,marginBottom:12}}>Elige un estilo — se guarda automáticamente.</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {THEMES.map(t=>{
            const selected=savedTheme===t.id;
            return(
              <button key={t.id} onClick={()=>onThemeChange(t.id)}
                style={{borderRadius:12,border:`2px solid ${selected?t.preview:"transparent"}`,padding:"10px 4px",background:t.dark?"#1E293B":"#FFFFFF",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:5,boxShadow:selected?`0 0 0 3px ${t.preview}44`:"none"}}>
                {/* preview strip */}
                <div style={{width:36,height:20,borderRadius:6,background:`linear-gradient(135deg, ${t.dark?"#0F172A":"#F7F9FB"} 50%, ${t.preview} 50%)`}}/>

                {selected&&<span style={{fontSize:9,color:t.preview,fontWeight:700}}>✓</span>}

      {/* --- NIVEL --- */}
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginBottom:14}}>
        <p style={{fontWeight:600,marginBottom:4}}>🎯 Tu nivel de inglés</p>
        <p style={{fontSize:13,color:C.inkSoft,marginBottom:12}}>Define la dificultad de todos los ejercicios.</p>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {LEVELS.map(lv=>(
            <button key={lv.id} onClick={()=>save({...state,level:lv.id})}
              style={{flex:"1 1 45%",padding:"10px 6px",borderRadius:12,border:`2px solid ${state.level===lv.id?C.blue:C.line}`,background:state.level===lv.id?C.blueSoft:"transparent",color:state.level===lv.id?C.blue:C.inkSoft,fontWeight:600,fontSize:13}}>
              <span style={{marginRight:6}}>{lv.icon}</span>{lv.label}<div style={{fontSize:10,fontWeight:400,marginTop:2}}>{lv.desc}</div>
            </button>))}
        </div>
      </div>

        <ProfileEditor state={state} save={save} onClose={()=>setEditingProfile(false)}/>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <p style={{fontWeight:600,fontSize:15}}>👤 Tu perfil</p>
            <button onClick={()=>setEditingProfile(true)}
              style={{padding:"6px 12px",borderRadius:8,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:13}}>
              ✏️ Editar
            </button>
          </div>
          <div style={{fontSize:13,color:C.inkSoft,lineHeight:1.8}}>
            <span style={{color:C.ink,fontWeight:500}}>{state.profile.name}</span> · {state.profile.role}<br/>
            <span>Objetivos: {(state.profile.goals||[]).join(", ")||"—"}</span><br/>
            <span>Intereses: {(state.profile.interests||[]).join(", ")||"—"}</span>
            {state.profile.extra&&(<><br/><span style={{color:C.blue,fontSize:12}}>✨ Perfil extendido activo</span></>)}
          </div>
        </div>
      )}

      {/* --- IA ACTIVA --- */}
