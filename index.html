function buildColors(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  const base = t.dark ? {
    paper:"#0F172A", card:"#1E293B", ink:"#F1F5F9", inkSoft:"#94A3B8", line:"#334155",
    green:"#34D399", greenSoft:"#022C22", coral:"#F87171", coralSoft:"#3B0A0A", marker:"#FCD34D",
  } : {
    paper:"#F7F9FB", card:"#FFFFFF", ink:"#13243B", inkSoft:"#5A6B82", line:"#E3E9F0",
    green:"#1FA86B", greenSoft:"#E7F7EF", coral:"#F25C4D", coralSoft:"#FDEDEA", marker:"#FFE34D",
  };
  return { ...base, blue:t.accent, blueSoft:t.soft };
}

function getSavedTheme() { try { return localStorage.getItem("fluido-theme") || "light-blue"; } catch(e) { return "light-blue"; } }

// C es mutable a nivel de módulo — se actualiza al cambiar tema y React re-renderiza el árbol

// Aplicar CSS vars para elementos que las usen
function applyCSSVars(id) {
  const colors = buildColors(id);
  const r = document.documentElement;
  r.style.setProperty("--blue",   colors.blue);
  r.style.setProperty("--marker", colors.marker);
  r.style.setProperty("--paper",  colors.paper);
  r.style.setProperty("--ink",    colors.ink);
  r.style.setProperty("--card",   colors.card);
  r.style.setProperty("--line",   colors.line);
  document.body.style.background = colors.paper;
  document.body.style.color      = colors.ink;
}
applyCSSVars(getSavedTheme());

State Building · the Colosseum · the White House"},{"es":"Guerras, revoluciones y eventos con nombre propio","en":"Eventos históricos","note":"Categoría 9 · World War II · the Industrial Revolution · Black Friday"},{"es":"Títulos profesionales cuando van con nombre","en":"Títulos de personas","note":"Categoría 10 · President Obama · Doctor Norris"},{"es":"Nombres de religiones, deidades y escrituras sagradas","en":"Religiones y textos","note":"Categoría 11 · Catholicism · Islam · the Torah · God"},{"es":"Libros, películas, arte: mayúscula en sustantivos, adj. y verbos","en":"Títulos de obras","note":"Categoría 12 · To Kill a Mockingbird · The Godfather · Gone with the Wind"},{"es":"Si es nombre propio → SIEMPRE mayúscula en inglés","en":"¿mayúscula o no?","note":"⚡ Clave · Días, meses, idiomas → mayúscula en inglés aunque en español sean minúscula"},{"es":"Mayúscula para: sustantivos, verbos, adjetivos. Minúscula para: artículos, preposiciones, conjunciones cortas.","en":"sustantivos + verbos + adj.","note":"📝 Regla de títulos · \"Gone with the Wind\" — with/the en minúscula · \"Gone/Wind\" en mayúscula"},{"es":"Nombre que se puede contar individualmente","en":"Countable Noun","note":"Definición · one pencil / two pencils · a cat / three cats · a house / five houses"},{"es":"Nombre que no se puede delimitar — forma un todo continuo. Siempre singular.","en":"Uncountable Noun","note":"Definición · salt · rice · water · milk · money · hair · information"},{"es":"Contables: tienen plural. Incontables: NO tienen plural.","en":"eggs ✅ · rices ❌","note":"Regla 1 — Plural · egg→eggs ✅ · bicycle→bicycles ✅ · rice→rices ❌ · milk→milks ❌"},{"es":"a/an solo se usa con nombres contables en singular.","en":"a/an + contable","note":"Regla 2 — a/an · an apple ✅ · a house ✅ · a milk ❌ · an information ❌"},{"es":"Números directos solo con contables.","en":"three apples ✅","note":"Regla 3 — Números · three apples ✅ · five houses ✅ · two rices ❌ · three salts ❌"},{"es":"sal — incontable, no plural, no a/an","en":"salt","note":"Incontable · some salt ✅ · a gram of salt ✅ · a salt ❌ · salts ❌"},{"es":"muebles — ¡en inglés es incontable y singular!","en":"furniture","note":"Incontable · some furniture ✅ · a piece of furniture ✅ · a furniture ❌ · furnitures ❌"},{"es":"información — incontable en inglés","en":"information","note":"Incontable · some information ✅ · a piece of information ✅ · an information ❌"},{"es":"dinero — incontable, siempre singular","en":"money","note":"Incontable · some money ✅ · a lot of money ✅ · a money ❌ · moneys ❌"},{"es":"Para delimitar un incontable y hacerlo contable","en":"a [unit] of [noun]","note":"Expresión partitiva · a cup of tea · a glass of wine · a piece of wood · a gram of salt"},{"es":"dos tazas de té = two cups of tea","en":"a cup of tea","note":"Partitiva · cup = contable · tea = incontable. Se cuenta la taza, no el té."},{"es":"\"a piece of\" funciona con muchos incontables","en":"a piece of…","note":"Partitiva · a piece of wood · a piece of furniture · a piece of information · a piece of bread"},{"es":"Si tiene plural → contable. Si no → incontable.","en":"¿plural o no?","note":"⚡ Clave · \"dog/dogs\" → contable. \"rice/rices?\" → ❌ incontable."},{"es":"Algunos son plurales en español pero incontables en inglés","en":"Spanish ≠ English","note":"⚡ Truco · \"furniture\" (muebles) · \"hair\" (pelos) · \"information\" (informaciones) → singulares en inglés"},{"es":"\"Hay\" en español. Indica existencia de algo.","en":"there + be","note":"Concepto · \"There is a cat.\" (Hay un gato.) / \"There are three cats.\" (Hay tres gatos.)"},{"es":"Contable plural → there are (sin forma corta)","en":"there are","note":"there are · \"There are five pencils.\" / \"There are many people.\" / \"There are three houses.\""},{"es":"Verbo delante de \"there\" para preguntar (singular)","en":"Is there…?","note":"Interrogativa singular · \"Is there a pen?\" / \"Is there sugar?\" → ¿Hay…?"},{"es":"Verbo delante de \"there\" para preguntar (plural)","en":"Are there…?","note":"Interrogativa plural · \"Are there many people?\" / \"Are there five pencils?\""},{"es":"\"there\" introduce algo por primera vez → existencia","en":"there → primera vez","note":"there vs it · \"There is a pen on the table.\" (primera mención)"},{"es":"\"it\" habla de algo ya mencionado → referencia específica","en":"it → segunda vez","note":"there vs it · \"It is my pen.\" (referencia al bolígrafo ya mencionado)"},{"es":"singular/incontable → there is · plural → there are","en":"there is vs there are","note":"⚡ Regla clave · \"There is a cat / milk.\" · \"There are cats.\""},{"es":"There is a car in the garage. It is blue.","en":"there + it","note":"💡 Ejemplo completo · \"there\" introduce el coche · \"it\" se refiere al coche ya mencionado"},{"es":"muchos/as · solo contable plural · neg. e interrogativa","en":"many","note":"Cuantificador · \"How many cats?\" / \"Not many tourists\" / \"Too many changes\""},{"es":"mucho/a · solo incontable · neg. e interrogativa","en":"much","note":"Cuantificador · \"How much money?\" / \"Not much time\" / \"Too much work\""},{"es":"many + contable · much + incontable","en":"cats vs money","note":"⚡ many vs much · \"How many cats?\" (contable) · \"How much money?\" (incontable)"},{"es":"algunos/algo de · contable+incontable · afirmativa y oferta","en":"some","note":"Cuantificador · \"She has some apples\" / \"There is some milk\" / \"Would you like some coffee?\""},{"es":"some = afirmativa + oferta · any = negativa + interrogativa","en":"some/any","note":"⚡ some vs any · \"Some coffee?\" (oferta) · \"Any coffee?\" (pregunta neutra) · \"No any\" → no/none"},{"es":"ninguno/a · contable+incontable · \"none\" solo, sin nombre","en":"no / none","note":"Cuantificador · \"There are no pencils\" · \"How many? None.\" · \"I have no money\""},{"es":"mucho/s · contable+incontable · afirmativa y negativa","en":"a lot of / lots of","note":"Cuantificador · \"A lot of books\" / \"Lots of money\" / \"Not a lot of time\" — no en interrogativas"},{"es":"poco (negativo) · solo incontable","en":"little","note":"Cuantificador · \"We have little time.\" → Connotación negativa: es insuficiente."},{"es":"un poco (positivo) · solo incontable","en":"a little","note":"Cuantificador · \"Do you have a little money?\" → Connotación positiva: algo hay, es suficiente."},{"es":"pocos (negativo) · solo contable plural","en":"few","note":"Cuantificador · \"There are few tourists today.\" → Connotación negativa: insuficiente."},{"es":"unos pocos (positivo) · solo contable plural","en":"a few","note":"Cuantificador · \"Do you have a few dollars?\" → Connotación positiva: algunos, suficiente."},{"es":"few = negativo (insuficiente) · a few = positivo (suficiente)","en":"few ≠ a few","note":"⚡ few vs a few · \"few friends\" (pocos, mal) vs \"a few friends\" (algunos, bien)"},{"es":"little = negativo · a little = positivo · ambos incontable","en":"little ≠ a little","note":"⚡ little vs a little · \"little time\" (poco, insuficiente) vs \"a little time\" (algo, suficiente)"},{"es":"Palabra que describe un nombre (sustantivo)","en":"Adjective","note":"Concepto · \"A big house\" / \"The tall man\" / \"A beautiful day\""},{"es":"El adjetivo en inglés NO cambia por género ni número","en":"Sin género ni plural","note":"Regla · \"A tall boy\" / \"A tall girl\" / \"Tall boys\" — siempre \"tall\""},{"es":"El adjetivo suele ir ANTES del nombre","en":"Antes del nombre","note":"Posición · \"A red car\" (un coche rojo) — no \"a car red\""},{"es":"El adjetivo puede ir después de verbos como be, seem, look","en":"Después de to be","note":"Posición · \"She is happy.\" / \"He looks tired.\" / \"It seems easy.\""},{"es":"Cuando hay varios adjetivos, siguen un orden específico","en":"Opinión + tamaño + edad","note":"Orden · \"A beautiful small old house\" — opinión → tamaño → edad"},{"es":"Continúa: forma → color → origen → material → propósito","en":"+ forma + color + origen","note":"Orden · \"A big round red Italian leather racing car\""},{"es":"Comparar dos cosas: adj corto + -er / more + adj largo","en":"-er / more","note":"Comparativo · \"taller than\" / \"more beautiful than\""},{"es":"El más de un grupo: the + adj + -est / the most + adj","en":"-est / most","note":"Superlativo · \"the tallest\" / \"the most beautiful\""},{"es":"Algunos adjetivos tienen formas irregulares","en":"good → better → best","note":"Irregular · \"good → better → best\" / \"bad → worse → worst\""},{"es":"Muchos adjetivos vienen en pares de opuestos","en":"Opposites","note":"Tipo · \"hot/cold\" / \"big/small\" / \"happy/sad\" / \"old/young\""},{"es":"Palabra que indica acción o estado del sujeto","en":"Verb","note":"Concepto · \"He runs.\" / \"She eats.\" / \"They are happy.\""},{"es":"Verbos de acción: expresan algo que el sujeto HACE","en":"Action Verbs","note":"Tipo · \"run, eat, play, write, speak, cook, drive\""},{"es":"Verbos de estado: expresan una condición o situación","en":"State Verbs","note":"Tipo · \"be, have, know, like, want, need, believe\""},{"es":"La forma base del verbo, a menudo con \"to\"","en":"Infinitive","note":"Forma · \"to run\" / \"to eat\" / \"to speak\" / \"to be\""},{"es":"En presente simple, he/she/it añade -s o -es","en":"3ª persona singular","note":"Conjugación · \"He runs\" / \"She watches\" / \"It goes\""},{"es":"Si el verbo termina en s, sh, ch, x, o → añade -es","en":"-es después de s,sh,ch,x,o","note":"Regla · \"goes, watches, washes, fixes, misses\""},{"es":"Si termina en consonante + y → cambia y por -ies","en":"consonante + y → -ies","note":"Regla · \"study → studies\" / \"try → tries\" / \"carry → carries\""},{"es":"Necesita un objeto directo","en":"Transitive","note":"Tipo · \"She reads A BOOK.\" — \"a book\" es el objeto"},{"es":"No necesita objeto directo","en":"Intransitive","note":"Tipo · \"He sleeps.\" / \"She laughs.\" — no necesitan objeto"},{"es":"En inglés el verbo SIEMPRE va después del sujeto","en":"Sujeto + Verbo + ...","note":"⚡ Clave · \"I eat.\" / \"She plays.\" — nunca \"eat I\" o \"plays she\""},{"es":"Yo soy / Yo estoy","en":"I am","note":"Presente · \"I am a student.\" / \"I am happy.\""},{"es":"Tú eres / Tú estás","en":"You are","note":"Presente · \"You are my friend.\" / \"You are tall.\""},{"es":"Él/Ella es o está","en":"He/She/It is","note":"Presente · \"He is a doctor.\" / \"She is tired.\" / \"It is cold.\""},{"es":"Nosotros/Ellos somos/son o estamos/están","en":"We/They are","note":"Presente · \"We are students.\" / \"They are at home.\""},{"es":"Yo era/estaba · Él/Ella era/estaba","en":"I/He/She/It was","note":"Pasado · \"I was happy.\" / \"She was a teacher.\""},{"es":"Tú eras/estabas · Nosotros/Ellos eran/estaban","en":"You/We/They were","note":"Pasado · \"You were right.\" / \"They were at school.\""},{"es":"Forma negativa: sujeto + to be + not","en":"am not / is not / are not","note":"Negativo · \"I am not tired.\" / \"She is not here.\" / \"They are not ready.\""},{"es":"Interrogativa: to be va ANTES del sujeto","en":"Am I? / Is he? / Are they?","note":"Pregunta · \"Am I late?\" / \"Is she a doctor?\" / \"Are they coming?\""},{"es":"To be se usa para identidad, profesión, nacionalidad","en":"Ser (identidad)","note":"Uso · \"I am Spanish.\" / \"He is a teacher.\" / \"She is my sister.\""},{"es":"To be se usa para estado, ubicación, sentimiento","en":"Estar (estado)","note":"Uso · \"I am tired.\" / \"She is at home.\" / \"We are happy.\""},{"es":"Yo tengo (forma americana / más formal)","en":"I have","note":"Forma · \"I have a car.\" / \"She has two brothers.\""},{"es":"Interrogativa con \"have\": Do/Does + sujeto + have","en":"Do you have...?","note":"Pregunta · \"Do you have a pen?\" / \"Does she have a car?\""},{"es":"Interrogativa con \"have got\": Have/Has + sujeto + got","en":"Have you got...?","note":"Pregunta · \"Have you got a pen?\" / \"Has she got a car?\""},{"es":"\"Have\" sirve para todo. \"Have got\" solo para posesión en presente.","en":"have (todo) vs have got (posesión)","note":"Resumen · \"Have a shower\" (acción) vs \"Have got a car\" (posesión)"},{"es":"poder / saber (habilidad y permiso)","en":"can","note":"Modal · \"I can swim.\" / \"Can I go?\" / \"She can speak French.\""},{"es":"podía / podría (pasado de can / cortesía)","en":"could","note":"Modal · \"I could swim when I was 5.\" / \"Could you help me?\""},{"es":"deber (obligación fuerte / deducción)","en":"must","note":"Modal · \"You must study.\" / \"She must be tired.\" (debe de estar)"},{"es":"debería (consejo / recomendación)","en":"should","note":"Modal · \"You should eat more vegetables.\" / \"He should see a doctor.\""},{"es":"poder (posibilidad / permiso formal)","en":"may","note":"Modal · \"It may rain tomorrow.\" / \"May I come in?\""},{"es":"podría (posibilidad menor que may)","en":"might","note":"Modal · \"I might buy this.\" / \"She might come later.\""},{"es":"voluntad / futuro","en":"will","note":"Modal · \"I will help you.\" / \"It will rain tomorrow.\""},{"es":"condicional / cortesía","en":"would","note":"Modal · \"I would like some tea.\" / \"Would you help me?\""},{"es":"Los modales NO añaden -s en 3ª persona ni usan \"to\"","en":"Sin -s, sin to","note":"Regla · \"She can swim.\" ✅ (no \"cans\") · \"I must go.\" ✅ (no \"to go\")"},{"es":"Estructura: sujeto + modal + verbo base (sin to)","en":"Modal + infinitivo","note":"Regla · \"He can play.\" / \"You should study.\" / \"They must leave.\""},{"es":"Sujeto + Verbo + Objeto — el orden básico en inglés","en":"S + V + O","note":"Estructura · \"She (S) reads (V) books (O).\" / \"I (S) like (V) pizza (O).\""},{"es":"Las frases afirmativas siguen S + V + (complemento)","en":"Sujeto + Verbo","note":"Afirmativa · \"I live in Madrid.\" / \"She plays tennis.\" / \"They are happy.\""},{"es":"Negativa con \"to be\": sujeto + am/is/are + not","en":"S + be + not","note":"Negativa · \"I am not tired.\" / \"She is not here.\" / \"They are not ready.\""},{"es":"Pregunta con verbos normales: Do/Does + sujeto + verbo base","en":"Do/Does + S + V?","note":"Pregunta · \"Do you like pizza?\" / \"Does she play tennis?\""},{"es":"Pregunta con \"to be\": Am/Is/Are + sujeto","en":"Be + S + ...?","note":"Pregunta · \"Is she happy?\" / \"Are you ready?\" / \"Am I late?\""},{"es":"What, Where, When, Who, Why, How + auxiliar + sujeto + verbo","en":"Wh- questions","note":"Pregunta · \"What do you want?\" / \"Where does she live?\" / \"How are you?\""},{"es":"En inglés SIEMPRE debe haber un sujeto explícito","en":"Sujeto obligatorio","note":"Regla · \"It rains.\" ✅ (no \"Rains.\") / \"I am 25.\" ✅ (no \"Am 25.\")"},{"es":"En afirmativas el verbo siempre va después del sujeto","en":"El verbo no se mueve","note":"⚡ Orden fijo · \"I like coffee.\" ✅ / \"Like I coffee.\" ❌"},{"es":"Orden, instrucción o petición dirigida a \"you\"","en":"Imperative","note":"Concepto · \"Sit down.\" / \"Open the door.\" / \"Listen!\""},{"es":"El imperativo usa el verbo en forma base, sin \"you\"","en":"Verbo base (sin sujeto)","note":"Forma · \"Come here.\" / \"Wait a moment.\" / \"Be quiet.\""},{"es":"Para dar órdenes directas","en":"Órdenes","note":"Uso · \"Stop!\" / \"Go away.\" / \"Close the window.\""},{"es":"Para dar instrucciones paso a paso","en":"Instrucciones","note":"Uso · \"Turn left.\" / \"Add the sugar.\" / \"Press the button.\""},{"es":"Para dar consejos o hacer peticiones","en":"Consejos y peticiones","note":"Uso · \"Take an umbrella.\" / \"Please sit down.\" / \"Have a nice day!\""},{"es":"Añadir \"please\" hace el imperativo más cortés","en":"Please","note":"Cortesía · \"Please open the door.\" / \"Sit down, please.\""},{"es":"Para acciones que se repiten regularmente","en":"Rutinas y hábitos","note":"Uso · \"I wake up at 7 AM.\" / \"She goes to work by bus.\""},{"es":"Verdades universales y hechos permanentes","en":"Hechos generales","note":"Uso · \"The sun rises in the east.\" / \"Water boils at 100°C.\""},{"es":"Con estos sujetos, el verbo no cambia","en":"I/you/we/they + verbo base","note":"Forma · \"I play tennis.\" / \"They live in London.\" / \"We eat at 8.\""},{"es":"En 3ª persona singular se añade -s o -es","en":"He/she/it + verbo + s/es","note":"Forma · \"He plays tennis.\" / \"She goes to school.\" / \"It rains a lot.\""},{"es":"Pregunta: Do/Does + sujeto + verbo (sin -s)","en":"Do/Does + sujeto + verbo base?","note":"Pregunta · \"Do you play tennis?\" / \"Does she like pizza?\""},{"es":"Adverbios de frecuencia comunes con present simple","en":"always, usually, often","note":"Marcador · \"I always brush my teeth.\" / \"She usually walks to school.\""},{"es":"\"Every + tiempo\" indica rutina → present simple","en":"every day/week/month","note":"Marcador · \"I go to the gym every day.\" / \"She visits her parents every week.\""},{"es":"Más adverbios de frecuencia: posición antes del verbo","en":"sometimes, never, rarely","note":"Marcador · \"He sometimes reads.\" / \"They never argue.\" / \"She rarely cooks.\""},{"es":"Acciones que están ocurriendo en este momento","en":"Ahora mismo","note":"Uso · \"I am eating lunch right now.\" / \"She is reading a book.\""},{"es":"Situaciones temporales, no permanentes","en":"Temporal","note":"Uso · \"I am living in Madrid this month.\" / \"He is working from home.\""},{"es":"Sujeto + am/is/are + verbo con -ing","en":"am/is/are + verbo-ing","note":"Forma · \"I am studying.\" / \"She is working.\" / \"They are playing.\""},{"es":"Pregunta: Am/Is/Are + sujeto + verbo-ing?","en":"Am/Is/Are + sujeto + -ing?","note":"Pregunta · \"Are you studying?\" / \"Is she working?\" / \"Am I doing it right?\""},{"es":"La mayoría de verbos simplemente añaden -ing","en":"verbo + -ing","note":"Regla -ing · \"play → playing\" / \"eat → eating\" / \"read → reading\""},{"es":"Si termina en -e muda, quitar la -e y añadir -ing","en":"-e final → quitar -e + -ing","note":"Regla -ing · \"make → making\" / \"write → writing\" / \"dance → dancing\""},{"es":"Consonante-Vocal-Consonante corta → doblar última consonante","en":"CVC → doblar consonante + -ing","note":"Regla -ing · \"run → running\" / \"sit → sitting\" / \"swim → swimming\""},{"es":"Palabras clave que indican present continuous","en":"now, right now, at the moment","note":"Marcador · \"I am cooking right now.\" / \"She is sleeping at the moment.\""},{"es":"Simple = rutina/siempre. Continuous = ahora/temporal.","en":"Simple vs Continuous","note":"⚡ Clave · \"I play tennis.\" (rutina) vs \"I am playing tennis.\" (ahora mismo)"},{"es":"Verbos que NO se usan en forma continua (-ing)","en":"Stative Verbs","note":"Concepto · \"I like pizza.\" ✅ / \"I am liking pizza.\" ❌"},{"es":"see, hear, smell, taste, feel (involuntarios)","en":"Sentidos","note":"Categoría · \"I see a bird.\" ✅ / \"I am seeing a bird.\" ❌"},{"es":"like, love, hate, want, need, prefer","en":"Emociones","note":"Categoría · \"She loves chocolate.\" ✅ / \"She is loving chocolate.\" ❌"},{"es":"know, believe, understand, remember, think (opinar)","en":"Pensamiento","note":"Categoría · \"I know the answer.\" ✅ / \"I am knowing the answer.\" ❌"},{"es":"have (posesión), own, belong, possess","en":"Posesión","note":"Categoría · \"I have a car.\" ✅ / \"I am having a car.\" ❌"},{"es":"be, seem, appear, mean, cost, contain","en":"Otros","note":"Categoría · \"It costs $5.\" ✅ / \"It is costing $5.\" ❌"},{"es":"Cuando \"have\" es acción (no posesión) → SÍ continuo","en":"have (acción)","note":"⚡ Excepción · \"I am having lunch.\" ✅ (acción) vs \"I have a car.\" (posesión)"},{"es":"see = ver → no continuo. see = quedar con → sí continuo","en":"see (quedar/visitar)","note":"⚡ Excepción · \"I see a cat.\" (percibir) vs \"I am seeing the doctor.\" (visitar)"},{"es":"Acciones → pueden ser continuas. Estados → no.","en":"Acción vs Estado","note":"Regla · \"I am eating.\" ✅ (acción) vs \"I am knowing.\" ❌ (estado)"},{"es":"1 one · 2 two · 3 three · 4 four · 5 five","en":"one, two, three...","note":"1-10 · 6 six · 7 seven · 8 eight · 9 nine · 10 ten"},{"es":"11 eleven · 12 twelve · 13 thirteen · 1 as stolen.\" / \"A country whose capital is Rome.\""},{"es":"Donde — para lugares","en":"where","note":"Lugar · \"The hotel where we stayed was nice.\" / \"This is the town where I grew up.\""},{"es":"Cuando — para momentos en el tiempo","en":"when","note":"Tiempo · \"I remember the day when we met.\" / \"Summer is when I relax.\""},{"es":"Cláusulas que IDENTIFICAN — sin comas, esenciales","en":"Defining clauses","note":"Tipo · \"The students who study hard pass.\" (identifica cuáles estudiantes)"},{"es":"Cláusulas que AÑADEN INFO — con comas, no esenciales","en":"Non-defining clauses","note":"Tipo · \"My sister, who lives in London, is a teacher.\" (info adicional)"},{"es":"NO se usa \"that\" en cláusulas no definitorias (con comas)","en":"that ≠ non-defining","note":"⚡ Clave · \"Paris, which is in France, is beautiful.\" ✅ / \"Paris, that is...\" ❌"},{"es":"Adjetivos cortos (1 sílaba): añadir -er + than","en":"Short adj + -er + than","note":"Comparativo · \"She is taller than me.\" / \"This is cheaper than that.\""},{"es":"Adjetivos cortos: the + adj-est","en":"the + short adj + -est","note":"Superlativo · \"He is the tallest in the class.\" / \"This is the cheapest.\""},{"es":"Si termina en -e, solo añadir -r / -st","en":"-e → -er / -est","note":"Regla · nice → nicer → the nicest / large → larger → the largest"},{"es":"Consonante-vocal-consonante: duplicar la última consonante","en":"CVC → double consonant","note":"Regla · big → bigger → biggest / hot → hotter → hottest / thin → thinner"},{"es":"Consonante + y: cambiar y por i + -er/-est","en":"consonant + y → -ier / -iest","note":"Regla · happy → happier → happiest / easy → easier → easiest"},{"es":"Irregular: bad / worse / the worst","en":"bad → worse → worst","note":"Irregular · \"This is worse than I thought.\" / \"The worst day of my life.\""},{"es":"-ing describe la CAUSA de ese sentimiento","en":"boring / tiring / interesting","note":"-ing · \"The movie is boring.\" (La película es aburrida) / \"The job is r · \"She sings better than me.\" / \"He cooks the best.\""},{"es":"Irregular: badly / worse / the worst","en":"badly → worse → worst","note":"Irregular · \"He played worse today.\" / \"She performed the worst.\""},{"es":"Irregular: far / farther (further) / farthest (furthest)","en":"far → farther/further → farthest/furthest","note":"Irregular · \"She walked farther than us.\" / \"He lives the farthest away.\""},{"es":"Menos: less + adverbio + than","en":"less + adverb + than","note":"Menos · \"He speaks less fluently than her.\" / \"She studies less often.\""},{"es":"\"Like\" = como (comparación). Va seguido de sustantivo o pronombre","en":"like + noun/pronoun","note":"Like · \"She looks like her mother.\" / \"He runs like a cheetah.\""},{"es":"\"Like\" puede ir seguido de un verbo en -ing (informal)","en":"like + -ing verb","note":"Like · \"It feels like flying.\" / \"It sounds like raining.\""},{"es":"\"As\" va seguido de una cláusula (sujeto + verbo)","en":"as + clause (subject + verb)","note":"As · \"Do as I say.\" / \"As I mentioned before…\""},{"es":"\"As\" = como (en calidad de / en función de)","en":"as + job / role","note":"As · \"She works as a teacher.\" / \"He used it as a table.\""},{"es":"Expresiones fijas con \"as\"","en":"as usual / as always","note":"Expresión · \"As usual, he was late.\" / \"As always, she helped everyone.\""},{"es":"\"Such as\" = tales como (para dar ejemplos)","en":"such as","note":"Expresión · \"I like fruits such as apples and oranges.\""},{"es":"Like con verbos de percepción","en":"look like / sound like / feel like","note":"Expresión · \"It looks like rain.\" / \"That sounds like a good idea.\""},{"es":"like + sustantivo (comparación) / as + verbo (rol o manera)","en":"like vs as (resumen)","note":"⚡ Clave · \"Like I said\" ❌ (informal) → \"As I said\" ✅ (correcto formal)"},{"es":"Estos verbos siempre van seguidos de gerundio (-ing)","en":"enjoy, finish, avoid, mind","note":"Verbo + -ing · \"I enjoy swimming.\" / \"She finished reading.\" / \"Avoid eating fast food.\""},{"es":"Más verbos que exigen gerundio","en":"keep, suggest, consider, practice","note":"Verbo + -ing · \"Keep trying!\" / \"I suggest going early.\" / \"Consider changing jobs.\""},{"es":"Estos verbos siempre van seguidos de infinitivo (to)","en":"want, need, decide, plan","note":"Verbo + to · \"I want to go.\" / \"She needs to study.\" / \"He decided to leave.\""},{"es":"Más verbos que exigen infinitivo","en":"hope, expect, learn, agree","note":"Verbo + to · \"I hope to see you.\" / \"She agreed to help.\" / \"He learned to cook.\""},{"es":"Pueden ir con -ing o to sin cambiar el significado","en":"like, love, hate, start, begin","note":"Ambos · \"I like swimming.\" = \"I like to swim.\" / \"She started working/to work.\""},{"es":"Cambia el significado: stop doing = dejar de / stop to do = parar para","en":"stop + -ing vs stop + to","note":"Cambio · \"Stop smoking.\" (deja de fumar) vs \"Stop to smoke.\" (para para fumar)"},{"es":"remember doing = recordar algo pasado / remember to do = acordarse de","en":"remember + -ing vs + to","note":"Cambio · \"I remember meeting him.\" (recuerdo) vs \"Remember to call.\" (no olvides)"},{"es":"Preguntas cerradas: inverter auxiliar y sujeto","en":"Auxiliar + sujeto + verbo?","note":"Yes/No · \"Do you like pizza?\" / \"Is she coming?\" / \"Have you been there?\""},{"es":"Preguntas abiertas: Wh- + auxiliar + sujeto + verbo","en":"Wh- word + auxillar + sujeto + verbo?","note":"Wh- · \"Where do you live?\" / \"What are you doing?\" / \"Why did she leave?\""},{"es":"What = qué; Which = cuál (de opciones); Who = quién","en":"What / Which / Who","note":"Wh- palabra · \"What is your name?\" / \"Which color do you prefer?\" / \"Who called?\""},{"es":"Where = dónde; When = cuándo; Why = por qué","en":"Where / When / Why","note":"Wh- palabra · \"Where are you?\" / \"When is the meeting?\" / \"Why are you crying?\""},{"es":"How = cómo; How much = cuánto (incontable); How many = cuántos (contable)","en":"How / How much / How many","note":"Wh- palabra · \"How are you?\" / \"How much is it?\" / \"How many do you have?\""},{"es":"How + adjetivo/adverbio para preguntar grado","en":"How + adj/adv","note":"Wh- palabra · \"How old are you?\" / \"How far is it?\" / \"How often do you go?\""},{"es":"Cuando who/what son el SUJETO, NO se usa auxiliar","en":"Who/What como sujeto","note":"Sujeto · \"Who called you?\" (who = sujeto) vs \"Who did you call?\" (who = objeto)"},{"es":"Present simple: Do + I/you/we/they, Does + he/she/it","en":"Do/Does (present simple)","note":"Auxiliar · \"Do you work here?\" / \"Does she speak French?\""},{"es":"Past simple: Did + sujeto + verbo base (sin -ed)","en":"Did (past simple)","note":"Auxiliar · \"Did you go to the party?\" / \"Did she call you?\""},{"es":"➜ Después de do/does/did, el verbo principal va en forma BASE","en":"Verbo base después de do/does/did","note":"⚡ Clave · \"Does she like pizza?\" ✅ / \"Does she likes?\" ❌"},{"es":"\"What\" se usa cuando las opciones NO están limitadas","en":"What — opciones abiertas","note":"What · \"What is your favorite food?\" (puede ser cualquier cosa)"},{"es":"\"Which\" se usa cuando hay un número LIMITADO de opciones","en":"Which — opciones limitadas","note":"Which · \"Which color do you prefer, red or blue?\" (opciones definidas)"},{"es":"What + sustantivo para preguntar de forma general","en":"What + noun (general)","note":"What · \"What music do you like?\" / \"What food do you prefer?\""},{"es":"Which + sustantivo para elegir entre opciones específicas","en":"Which + noun (específico)","note":"Which · \"Which dress should I wear?\" / \"Which bus goes to the center?\""},{"es":"What para preguntar por identidad, definición o profesión","en":"What + be (identidad)","note":"What · \"What is this?\" / \"What do you do?\" / \"What is love?\""},{"es":"Which of + grupo para elegir de un conjunto específico","en":"Which + of (de un grupo)","note":"Which · \"Which of these books is yours?\" / \"Which of you wants to go first?\""},{"es":"A veces se pueden usar ambos sin gran diferencia","en":"What/Which + noun (intercambiable a veces)","note":"Ambos · \"What/Which language do you speak?\" (si son pocas, which; si muchas, what)"},{"es":"\"What … like?\" para preguntar por descripción/opinión","en":"What … like?","note":"What · \"What is he like?\" (cómo es) / \"What was the movie like?\""},{"es":"\"Which one?\" para elegir entre opciones visibles","en":"Which one(s)?","note":"Which · \"Which one do you want?\" / \"Which ones are yours?\""},{"es":"Se usa para acciones que empezaron y terminaron en un tiempo específico del pasado","en":"Acciones completadas en el pasado","note":"Uso · \"I visited London last year.\" / \"She graduated in 2020.\""},{"es":"La mayoría de verbos añaden -ed al infinitivo","en":"Regular: verbo + -ed","note":"Forma · work → worked / play → played / walk → walked"},{"es":"Muchos verbos comunes tienen formas irregulares","en":"Irregular: forma propia","note":"Forma · go → went / see → saw / eat → ate / have → had / buy → bought"},{"es":"Si el verbo ya termina en -e, solo añadir -d","en":"-e → solo +d","note":"Regla · live → lived / dance → danced / love → loved"},{"es":"Si termina en consonante + y: cambiar y por -ied","en":"Consonante + y → -ied","note":"Regla · study → studied / carry → carried / try → tried"},{"es":"Consonante-vocal-consonante (1 sílaba): duplicar la última","en":"CVC → duplicar + -ed","note":"Regla · stop → stopped / plan → planned / drop → dropped"},{"es":"Pregunta: Did + sujeto + verbo en forma BASE","en":"Did + sujeto + verbo base?","note":"Pregunta · \"Did you see the movie?\" / \"Did she arrive on time?\""},{"es":"Marcadores de tiempo del pasado simple","en":"yesterday / last / ago","note":"Marcador · \"yesterday\" / \"last week\" / \"two days ago\" / \"in 2010\""},{"es":"Describe una acción que ESTABA OCURRIENDO en un momento del pasado","en":"Acción en progreso en el pasado","note":"Uso · \"I was reading at 8 PM.\" / \"She was cooking when I arrived.\""},{"es":"Sujeto + was/were + verbo en -ing","en":"was/were + verbo-ing","note":"Forma · \"I was working.\" / \"They were playing.\" / \"She was studying.\""},{"es":"\"Was\" para sujetos singulares (excepto you)","en":"was → I/he/she/it","note":"Forma · \"I was sleeping.\" / \"He was driving.\" / \"It was raining.\""},{"es":"\"Were\" para you, we, they","en":"were → you/we/they","note":"Forma · \"You were talking.\" / \"We were waiting.\" / \"They were dancing.\""},{"es":"Pregunta: invertir was/were y sujeto","en":"Was/Were + sujeto + -ing?","note":"Pregunta · \"Were you sleeping?\" / \"Was she working at that time?\""},{"es":"La acción larga (continuous) fue interrumpida por una corta (simple)","en":"Interrupción: past continuous + past simple","note":"Uso · \"I was having dinner when the phone rang.\""},{"es":"Dos acciones largas ocurriendo al mismo tiempo","en":"Acciones simultáneas: while","note":"Uso · \"While I was cooking, she was cleaning.\" / \"He was reading while she was singing.\""},{"es":"Marcadores típicos del pasado continuo","en":"when / while / at that moment","note":"Marcador · \"while I was walking…\" / \"when she arrived…\" / \"at 10 PM last night…\""},{"es":"Simple = acción puntual / Continuous = acción en progreso","en":"Past Simple vs Past Continuous","note":"⚡ Clave · \"It rained.\" (empezó y acabó) vs \"It was raining.\" (estaba lloviendo)"},{"es":"\"Used to\" describe algo que HACÍAS REGULARMENTE pero ya no","en":"Hábitos pasados que ya no existen","note":"Uso · \"I used to play tennis.\" (ya no juego) / \"She used to live in Paris.\""},{"es":"También para situaciones pasadas que ya cambiaron","en":"Estados pasados permanentes","note":"Uso · \"He used to be thin.\" / \"This used to be a cinema.\" / \"I used to have long hair.\""},{"es":"Sujeto + used to + verbo en infinitivo (sin -to)","en":"used to + verbo base","note":"Forma · \"I used to smoke.\" / \"She used to walk to school.\" / \"We used to be friends.\""},{"es":"Pregunta: Did + sujeto + use to (sin -d)","en":"Did + sujeto + use to + verbo?","note":"Pregunta · \"Did you use to play sports?\" / \"Did she use to live here?\""},{"es":"\"used to\" = hábito repetido / past simple = acción puntual","en":"used to vs past simple","note":"vs. · \"I used to go every day.\" (hábito) vs \"I went yesterday.\" (una vez)"},{"es":"\"Used to\" no tiene forma en presente. Para hábitos presentes → present simple","en":"Solo existe en PASADO","note":"Nota · \"I used to walk to school.\" → Ahora: \"I walk to school.\" (present simple)"},{"es":"Si la acción AÚN continúa, NO uses \"used to\"","en":"used to → hábito terminado","note":"⚡ Clave · \"I used to live in Madrid.\" (ya no vivo ahí) ✅ / \"I used to live here.\" (si aún vives ahí) ❌"},{"es":"Preguntas: invertir auxiliar","en":"Will + sujeto? / Be + sujeto + going to?","note":"Pregunta · \"Will you help me?\" / \"Are you going to study?\""},{"es":"Pregunta: Will + sujeto + be + -ing?","en":"Will + sujeto + be + -ing?","note":"Pregunta · \"Will you be working tomorrow?\" / \"Will she be using the car?\""},{"es":"Preguntar por planes sin presionar (más cortés que \"will you?\")","en":"Preguntas educadas sobre planes","note":"Uso · \"Will you be using the car tonight?\" (más cortés que \"Will you use the car?\")"},{"es":"Dormitorio / baño / cocina — las habitaciones básicas","en":"bedroom / bathroom / kitchen","note":"Habitación · \"The bedroom is upstairs.\" / \"The kitchen is very spacious.\""},{"es":"Sala de estar / comedor","en":"living room / dining room","note":"Habitación · \"We watch TV in the living room.\" / \"We eat in the dining room.\""},{"es":"Garaje / ático (desván) / sótano","en":"garage / attic / basement","note":"Habitación · \"The car is in the garage.\" / \"Old boxes are in the attic.\""},{"es":"Sofá / sillón / estantería","en":"sofa / armchair / bookshelf","note":"Mueble · \"Sit on the sofa.\" / \"The bookshelf is full of novels.\""},{"es":"Armario (ropa) / cómoda / escritorio","en":"wardrobe / chest of drawers / desk","note":"Mueble · \"My clothes are in the wardrobe.\" / \"I study at my desk.\""},{"es":"Nevera / horno / fregadero / lavavajillas","en":"fridge / oven / sink / dishwasher","note":"Cocina · \"Put the milk in the fridge.\" / \"The dishes are in the sink.\""},{"es":"Piso (UK) / apartamento (US) / casa independiente","en":"flat / apartment / detached house","note":"Tipo · \"I live in a flat.\" (UK) / \"She has a detached house with a garden.\""},{"es":"Casa adosada / casa pareada","en":"terraced house / semi-detached","note":"Tipo · \"Terraced houses share walls on both sides.\" / \"A semi-detached shares one wall.\""},{"es":"Hacer las tareas del hogar / ordenar","en":"do the housework / tidy up","note":"Expresión · \"I do the housework on Saturdays.\" / \"Tidy up your room, please!\""},{"es":"Médico / enfermero-a / dentista — profesiones de salud","en":"doctor / nurse / dentist","note":"Oficio · \"The doctor works at the hospital.\" / \"A nurse helps patients.\""},{"es":"Chef / camarero / barman","en":"chef / waiter / bartender","note":"Oficio · \"The chef prepared an amazing meal.\" / \"The waiter took our order.\""},{"es":"Bombero / policía / paramédico — servicios de emergencia","en":"firefighter / police officer / paramedic","note":"Oficio · \"Firefighters saved the building.\" / \"The police officer helped us.\""},{"es":"Oficina / fábrica / hospital — lugares de trabajo","en":"office / factory / hospital","note":"Lugar · \"I work in an office.\" / \"He works at a factory.\""},{"es":"Trabajar como (rol) / trabajar para (empresa) / trabajar en (sector)","en":"work as / work for / work in","note":"Expresión · \"I work as a designer.\" / \"She works for Google.\" / \"He works in finance.\""},{"es":"Solicitar (empleo) / ser contratado / ser despedido","en":"apply for / get hired / get fired","note":"Expresión · \"I applied for the job.\" / \"She got hired.\" / \"He got fired.\""},{"es":"Salario (m r\" se usa con cantidades de tiempo: three years, two hours, etc."},{"q":"They arrived ___ me. (primero ellos)","opts":["before","after","during","for"],"ans":"before","hint":"\"They arrived before me\" = llegaron antes que yo."},{"q":"I arrived ___ them. (yo llegué el último)","opts":["after","before","during","for"],"ans":"after","hint":"\"I arrived after them\" = llegué después de ellos."},{"q":"He studied ___ one week.","opts":["for","during","before","after"],"ans":"for","hint":"\"for one week\" = durante una semana (cantidad específica de tiempo)."},{"q":"___ the exam, she felt nervous.","opts":["Before","During","For","After"],"ans":"Before","hint":"\"Before the exam\" = antes del examen. Indica anterioridad."},{"q":"We talked ___ two hours.","opts":["for","during","before","after"],"ans":"for","hint":"\"for two hours\" = durante dos horas (cantidad de tiempo)."},{"q":"I go ___ school by bus.","opts":["to","into","towards","onto"],"ans":"to","hint":"\"to\" es la preposición de movimiento más común. Indica destino."},{"q":"Sofia flew ___ Canada.","opts":["to","towards","through","across"],"ans":"to","hint":"\"to\" para movimiento hacia un destino concreto (ciudades, países)."},{"q":"She walks ___ the park on her way to work.","opts":["through","across","along","around"],"ans":"through","hint":"\"through\" = atravesar un espacio cerrado (parque, túnel, bosque)."},{"q":"The cat jumped ___ the dog.","opts":["over","above","across","past"],"ans":"over","hint":"\"over\" = movimiento por encima de algo, saltando o cruzando."},{"q":"Walk ___ the street at the crosswalk.","opts":["across","through","along","past"],"ans":"across","hint":"\"across\" = cruzar de un lado a otro (calle, río)."},{"q":"We get ___ the train at the next stop.","opts":["off","out","down","from"],"ans":"off","hint":"\"get off\" = bajarse de un transporte. Opuesto de \"get onto\"."},{"q":"I prefer to ride my bike ___ the hill.","opts":["down","below","under","off"],"ans":"down","hint":"\"down\" = int":"\"It\" → referencia a algo ya mencionado. \"There\" → solo para primera mención."},{"q":"\"There are not ___.\" ¿Cuál es correcto?","opts":["two cars","a car","milk","sugar"],"ans":"two cars","hint":"\"there are not\" va con plural. \"two cars\" es contable plural. La negativa de there is va con singular/incontable."},{"q":"\"How ___ cats do you have?\" — ¿many o much?","opts":["many","much","some","any"],"ans":"many","hint":"\"cats\" es contable → How many? \"Much\" es solo para incontables."},{"q":"\"How ___ money does he have?\" — ¿many o much?","opts":["much","many","few","little"],"ans":"much","hint":"\"money\" es incontable → How much? \"Many\" es solo para contables."},{"q":"\"There is not ___ time.\" — ¿qué va?","opts":["much","many","few","some"],"ans":"much","hint":"\"time\" (tiempo) es incontable → much. \"Many\" es para contables plurales."},{"q":"\"She has ___ apples.\" (afirmativa, cantidad indefinida)","opts":["some","any","much","many"],"ans":"some","hint":"\"some\" se usa en afirmativas. \"Any\" se usa en negativas e interrogativas."},{"q":"\"Are there ___ changes?\" — ¿some o any?","opts":["any","some","much","many"],"ans":"any","hint":"\"any\" en preguntas neutras. \"Some\" en preguntas que implican oferta o espera una respuesta afirmativa."},{"q":"\"He has ___ books.\" (muchos — informal)","opts":["a lot of","many","much","some"],"ans":"a lot of","hint":"\"a lot of\" es informal y va con contables e incontables. \"Many\" también funciona pero es más formal."},{"q":"\"We have ___ time.\" (poco, negativo)","opts":["little","a little","few","a few"],"ans":"little","hint":"\"little\" = incontable, connotación negativa. \"A little\" = positiva. \"Few/a few\" = contables."},{"q":"\"Do you have ___ dollars?\" (unos, positivo)","opts":["a few","few","a little","little"],"ans":"a few","hint":"\"a few\" = contable plural, connotación positiva. \"Few\" = negativa. \"A little/little\" = incontables."},{"q":"\"How many pencils are there?\" → \"_____\"","opts":["None.","No.","Any.","Nothing."],"ans":"None.","hint":"\"none\" se usa como respuesta independiente sin nombre: \"None.\" \"No\" no funciona solo aquí."},{"q":"\"There are ___ pencils.\" (ninguno, ante nombre)","opts":["no","none","not","any"],"ans":"no","hint":"\"no\" va antes de un nombre: \"no pencils\". \"None\" se usa solo, sin nombre que le siga."},{"q":"\"Would you like ___ coffee?\" — ¿some o any?","opts":["some","any","much","a little"],"ans":"some","hint":"\"some\" en preguntas que implican una oferta o se espera respuesta afirmativa. \"Would you like...?\" es una oferta."},{"q":"Which is correct? \"A ___ house\"","opts":["big","bigs","the big","bigger"],"ans":"big","hint":"Los adjetivos en inglés no tienen plural. Siempre: \"a big house\"."},{"q":"\"She is very ___.\" (inteligente)","opts":["intelligent","intelligents","an intelligent","more intelligent"],"ans":"intelligent","hint":"Después de \"to be\", el adjetivo va sin artículo y sin plural."},{"q":"Which order is correct?","opts":["A beautiful old house","A old beautiful house","An house old beautiful","Old a beautiful house"],"ans":"A beautiful old house","hint":"Opinión (beautiful) va antes de edad (old)."},{"q":"\"My sister is ___ than me.\" (alta)","opts":["taller","more tall","tallest","tall"],"ans":"taller","hint":"\"Tall\" es corto (1 sílaba) → se añade -er: \"taller\"."},{"q":"\"This is the ___ book I have ever read.\" (bueno)","opts":["best","goodest","most good","better"],"ans":"best","hint":"\"Good\" es irregular: good → better → best."},{"q":"\"He is a ___ man.\" (What comes before the noun?)","opts":["kind","kindly","kinds","the kind"],"ans":"kind","hint":"El adjetivo antes del nombre: \"a kind man\"."},{"q":"\"The movie was ___.\" (aburrida)","opts":["boring","bored","boringly","bore"],"ans":"boring","hint":"\"Boring\" describe la cosa que causa el sentimiento. \"Bored\" es cómo se siente la persona."},{"q":"\"This exercise is ___ than the last one.\" (difícil)","opts":["more di function initInglesBank(){
  if(localStorage.getItem("fluido-ingles-v1")) return;
  try{
    const bank=loadBank();
    const existingEn=new Set((bank.phrases||[]).map(p=>(p.en||"").toLowerCase()));
    bank.phrases =[...(bank.phrases||[]),...BANK_PHRASES.filter(p=>!existingEn.has(p.en.toLowerCase()))];
    bank.grammar =[...(bank.grammar||[]),...BANK_GRAMMAR];
    bank.verbs   =[...(bank.verbs||[]),...BANK_VERBS];
    saveBank(bank);
    localStorage.setItem("fluido-ingles-v1","1");
    console.log("Fluido: banco cargado —",bank.phrases.length,"frases,",bank.verbs.length,"verbos,",bank.grammar.length,"preguntas");
  }catch(e){console.warn("initInglesBank:",e);}
}

const AI_KEY = "fluido-ai-v2";
function getAIConfig() { try { return JSON.parse(localStorage.getItem(AI_KEY)||"null"); } catch(e) { return null; } }
function setAIConfig(cfg) { localStorage.setItem(AI_KEY, JSON.stringify(cfg)); }
function migrateOldConfig() {
  try {
    if (localStorage.getItem(AI_KEY)) return;
    const old = JSON.parse(localStorage.getItem("fluido-ai")||"null");
    if (old && old.key) { const keys={}; PROVIDERS.forEach(p=>keys[p.id]=""); keys[old.provider||"gemini"]=old.key; setAIConfig({active:old.provider||"gemini",keys}); localStorage.removeItem("fluido-ai"); }
  } catch(e) {}
}
function isAIReady() { migrateOldConfig(); const cfg=getAIConfig(); return !!(cfg&&cfg.active&&cfg.keys&&cfg.keys[cfg.active]); }

function cleanJSON(text) {
  let t=(text||"").replace(/```json|```/g,"").trim();
  const o=t.indexOf("{"); const a=t.indexOf("[");
  if(a!==-1&&(a<o||o===-1)) return t.slice(a,t.lastIndexOf("]")+1);
  if(o!==-1) return t.slice(o,t.lastIndexOf("}")+1);
  return t;
}
async function callGemini(key,sys,prompt) {
  const models=["gemini-2.5-flash","gemini-2.0-flash","gemini-1.5-flash"];
  let lastErr=null;
  for(const model of models){
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.9}})});
    const data=await res.json();
    if(data.error){
      const msg=data.error.message||"";
      if(res.status===404||/not found|not supported|deprecated/i.test(msg)){lastErr=new Error(msg);continue;}
      const e=new Error(msg); e.code="API";
      if(/api key not valid|API_KEY_INVALID|invalid api key/i.test(msg)||[400,401,403].includes(res.status)){e.code="BAD_KEY";e.userMsg="Clave de Gemini inválida. Asegúrate de copiarla desde el botón 'Create API key' en aistudio.google.com/apikey";}
      else if(res.status===429){e.code="RATE";e.userMsg="Límite de Gemini alcanzado. Espera un momento e intenta de nuevo.";}
      else{e.userMsg="Error de Gemini: "+msg;}
      throw e;
    }
    return JSON.parse(cleanJSON((data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("\n")));
  }
  const e=lastErr||new Error("Sin modelos Gemini"); e.code="API"; e.userMsg="Ningún modelo de Gemini respondió. Intenta más tarde."; throw e;
}

      if(/not found|deprecated|does not exist|no endpoints/i.test(msg)){lastErr=new Error(msg);continue;}
      const e=new Error(msg); e.code="API";
      if(res.status===401||/invalid.*key|unauthorized/i.test(msg.toLowerCase())){e.code="BAD_KEY";e.userMsg=`Clave inválida. Revisa que la copiaste completa.`;}
      else if(res.status===429){e.code="RATE";e.userMsg="Límite de uso alcanzado. Espera un momento.";}
      else if(/credit|balance|quota/i.test(msg)){e.code="NO_CREDITS";e.userMsg="Sin créditos en este proveedor.";}
      else{e.userMsg="Error: "+msg;}
      throw e;
    }
    return JSON.parse(cleanJSON(data.choices?.[0]?.message?.content||"{}"));
  }
  const e=lastErr||new Error("Sin modelos disponibles"); e.code="API"; if(!e.userMsg) e.userMsg="Ningún modelo respondió. Intenta más tarde."; throw e;
}
async function callAnthropic(key,sys,prompt) {
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,messages:[{role:"user",content:prompt}]})});
  const data=await res.json();
  if(data.error){
    const msg=data.error.message||""; const e=new Error(msg); e.code="API";
    if(/credit balance|too low/i.test(msg)){e.code="NO_CREDITS";e.userMsg="Sin créditos en Anthropic. Usa Gemini (gratis).";}
    else if(res.status===401){e.code="BAD_KEY";e.userMsg="Clave de Anthropic inválida (sk-ant-…).";}
    else{e.userMsg="Error de Anthropic: "+msg;}
    throw e;
  }
  return JSON.parse(cleanJSON((data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n")));
}
async function callAI(pid,key,sys,prompt) {
  switch(pid){
    case "gemini":     return callGemini(key,sys,prompt);
    case "groq":       return callOpenAICompat("https://api.groq.com/openai/v1",key,["llama-3.3-70b-versatile","llama3-70b-8192","gemma2-9b-it"],sys,prompt);

    case "deepseek":   return callOpenAICompat("https://api.deepseek.com/v1",key,["deepseek-chat"],sys,prompt);
    case "anthropic":  return callAnthropic(key,sys,prompt);

// ---------- Hook de voz ----------
function useSpeech(){
  const [voices,setVoices]=useState([]);
  const supported=typeof window!=="undefined"&&"speechSynthesis" in window;
  const [failed,setFailed]=useState(!supported);
  useEffect(()=>{
    if(!supported) return;
    const load=()=>{const v=window.speechSynthesis.getVoices().filter(v=>v.lang?.toLowerCase().startsWith("en"));if(v.length)setVoices(v);};
    load(); window.speechSynthesis.onvoiceschanged=load;
    const t1=setTimeout(load,500); const t2=setTimeout(load,2000);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[supported]);
  const speak=useCallback((lines,opts)=>{
    const{rate=0.9,onEnd}=opts||{};
    if(!supported){setFailed(true);onEnd&&onEnd();return;}
    const synth=window.speechSynthesis;
    try{
      synth.cancel(); synth.resume();
      const arr=Array.isArray(lines)?lines:[{line:lines}];
      arr.forEach((d,i)=>{
        const u=new SpeechSynthesisUtterance(d.line||d); u.lang="en-US"; u.rate=rate;
        if(voices.length) u.voice=voices[i%Math.min(2,voices.length)];
        if(i===arr.length-1&&onEnd) u.onend=onEnd;
        synth.speak(u);
      });
      setTimeout(()=>{if(!synth.speaking&&!synth.pending){setFailed(true);onEnd&&onEnd();}else setFailed(false);},1200);
    }catch(e){setFailed(true);onEnd&&onEnd();}
  },[supported,voices]);
  const stop=useCallback(()=>{try{window.speechSynthesis.cancel();}catch(e){};},[]);
  return{speak,stop,failed,supported};
}

    applyCSSVars(id);
    setThemeVer(v=>v+1);
  },[]);

  const registerActivity=useCallback((block,extra)=>{
    setState(prev=>{
      const next={...prev,...(extra||{})};
      const today=todayStr();
      next.daily=next.daily.date!==today?{date:today,talk:0,phrases:0,listen:0,grammar:0}:{...next.daily};

  if(!aiReady) return <Shell><Setup onDone={handleAIChanged}/></Shell>;

    </div>
  );

    <div className="fadein">
      <p style={{fontSize:13,color:C.inkSoft,letterSpacing:1.5,textTransform:"uppercase"}}>Hola, {state.profile.name}</p>
      <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
        <h1 style={{margin:"4px 0 2px",fontSize:34,fontWeight:700,letterSpacing:-0.5}}>Fluido<span style={{color:C.blue}}>.</span></h1>
        {activeProv&&<span style={{fontSize:11,padding:"3px 8px",borderRadius:999,background:C.paper,border:`1px solid ${C.line}`,color:C.inkSoft}}>{activeProv.emoji} {activeProv.name}</span>}
      </div>
      <p style={{fontFamily:FEN,fontStyle:"italic",fontSize:17,color:C.inkSoft}}>"You don't learn a language. <span className="hl">You get used to it.</span>"</p>
      <div style={{display:"flex",gap:10,marginTop:18}}>
        <StatCard big={`${state.streak}`} label={state.streak===1?"día seguido":"días seguidos"} accent={C.blue}/>
        <StatCard big={`${state.totals.talk+state.totals.phrases+state.totals.listen+(state.totals.grammar||0)}`} label="prácticas totales" accent={C.green}/>
      </div>
      <div style={{marginTop:20}}>
        <p style={{fontSize:13,color:C.inkSoft,letterSpacing:1.5,textTransform:"uppercase",marginBottom:8}}>Misiones de hoy</p>
        {goals.map(g=>{
          const pct=Math.min(100,Math.round((g.done/g.target)*100)); const done=g.done>=g.target;
          return(
            <button key={g.id} onClick={()=>go(g.id)}
              style={{width:"100%",textAlign:"left",background:C.card,border:`1px solid ${done?C.green:C.line}`,borderRadius:14,padding:14,marginBottom:10,display:"block"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontWeight:600,fontSize:16}}>{done?"✓ ":""}{g.label}</span>
                <span style={{fontSize:13,color:done?C.green:C.inkSoft}}>{Math.min(g.done,g.target)}/{g.target} {g.unit}</span>
              </div>
              <p style={{margin:"4px 0 8px",fontSize:13,color:C.inkSoft}}>{g.desc}</p>
              <div style={{height:6,background:C.paper,borderRadius:3,overflow:"hidden"}}>
                <div style={{height:"100%",width:pct+"%",background:done?C.green:C.blue,borderRadius:3,transition:"width .3s"}}/>
              </div>
            </button>);
        })}
        {allDone&&<div className="fadein" style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:14,padding:14,textAlign:"center",fontWeight:600,color:C.green}}>¡Misiones completas, {state.profile.name}! Nos vemos mañana 🔥</div>}
      </div>
      <div style={{marginTop:22}}>
        <p style={{fontSize:13,color:C.inkSoft,letterSpacing:1.5,textTransform:"uppercase",marginBottom:8}}>Tu nivel</p>
        <div style={{display:"flex",gap:8}}>
          {LEVELS.map(lv=>(
            <button key={lv.id} onClick={()=>save({...state,level:lv.id})}
              style={{flex:1,padding:"10px 6px",borderRadius:12,border:`2px solid ${state.level===lv.id?C.blue:C.line}`,background:state.level===lv.id?C.blueSoft:C.card,color:state.level===lv.id?C.blue:C.inkSoft,fontWeight:600,fontSize:14}}>
              {lv.label}<div style={{fontSize:10,fontWeight:400,marginTop:2}}>{lv.desc}</div>
            </button>))}
        </div>
      </div>
    </div>
  );
}
function StatCard({big,label,accent}){return(<div style={{flex:1,background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"14px 16px"}}><div style={{fontSize:30,fontWeight:700,color:accent,lineHeight:1}}>{big}</div><div style={{fontSize:13,color:C.inkSoft,marginTop:4}}>{label}</div></div>);}

function Talk({state,registerActivity}){
  const [scenario,setScenario]=useState(null);
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [showCustom,setShowCustom]=useState(false);
  const [customSuggestion,setCustomSuggestion]=useState("");
  const bottomRef=useRef(null);
  const {speak,failed}=useSpeech();
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);

  const newScenario=async(suggestion)=>{
    setLoading(true);setError(null);setMessages([]);setScenario(null);setShowCustom(false);
    try{
      const basePrompt=suggestion
        ? `El estudiante quiere practicar este escenario específico: "${suggestion}"\n\nAdáptalo según su perfil: ${profileForPrompts(state,true)}\n\nDevuelve JSON: {"title_es":"título corto","context_es":"contexto 1-2 frases, quién es el estudiante y el interlocutor","opening_en":"primer mensaje del interlocutor en inglés adecuado al nivel"}`
        : `Perfil: ${profileForPrompts(state,true)}\n\nGenera una situación de práctica PERSONALIZADA: usa su ocupación, objetivos y a veces sus intereses. Varía el contexto (semilla: ${Math.random().toString(36).slice(2)}).\n\nDevuelve JSON: {"title_es":"título corto","context_es":"contexto 1-2 frases","opening_en":"primer mensaje del interlocutor en inglés"}`;
      const data=await askAI_JSON(basePrompt,"Eres un profesor de inglés que crea simulaciones realistas y motivantes.");
      setScenario(data);setMessages([{role:"them",text:data.opening_en}]);
    }catch(e){setError(e.userMsg||(e.code==="NO_KEY"?"Configura tu clave en Ajustes.":"Error generando situación."));}
    setLoading(false);
  };

  const send=async()=>{
    const text=input.trim(); if(!text||loading) return;
    setInput("");setLoading(true);setError(null);
    const myMsg={role:"me",text};
    setMessages(m=>[...m,myMsg]);
    try{
      const history=[...messages,myMsg].map(m=>(m.role==="them"?"INTERLOCUTOR: ":"ESTUDIANTE: ")+m.text).join("\n");
      const data=await askAI_JSON(
        `Perfil: ${profileForPrompts(state,true)}\nSituación: ${scenario.context_es}\n\nConversación:\n${history}\n\nCorrige errores, da versión natural y continúa como interlocutor.\n\nDevuelve JSON: {"errors":[{"wrong":"error","right":"corrección","why_es":"explicación"}],"natural_en":"versión nativa o null","tip_es":"consejo breve o null","reply_en":"respuesta del interlocutor que invite a seguir"}`,
        "Eres un coach de inglés cálido y preciso. Corriges sin desanimar.");
      setMessages(m=>{const c=[...m];c[c.length-1]={...myMsg,feedback:data};return[...c,{role:"them",text:data.reply_en}];});
      registerActivity("talk");
    }catch(e){setError(e.userMsg||"Problema al enviar. Intenta de nuevo.");setMessages(m=>m.slice(0,-1));setInput(text);}
    setLoading(false);
  };

  return(
    <div className="fadein" style={{display:"flex",flexDirection:"column",minHeight:"calc(100vh - 140px)"}}>
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Conversar</h2>
      <p style={{marginBottom:14,fontSize:14,color:C.inkSoft}}>Escribe en inglés como puedas. Aquí <span className="hl">equivocarse es el método</span>.</p>

      {!scenario&&!loading&&(
        <div className="fadein">
          {!showCustom?(
            <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:20}}>
              <p style={{fontFamily:FEN,fontSize:18,marginBottom:14,textAlign:"center"}}>Ready when you are, {state.profile.name}.</p>
              <BigButton onClick={()=>newScenario(null)}>🎲 Situación aleatoria</BigButton>
              <button onClick={()=>setShowCustom(true)}
                style={{width:"100%",marginTop:10,padding:"13px 18px",borderRadius:14,border:`1.5px solid ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15}}>
                ✏️ Proponer mi propio escenario
              </button>
            </div>
          ):(
            <div className="fadein" style={{background:C.card,border:`1.5px solid ${C.blue}`,borderRadius:16,padding:18}}>
              <p style={{fontWeight:600,marginBottom:8}}>¿Qué situación quieres practicar?</p>
              <p style={{fontSize:13,color:C.inkSoft,marginBottom:10}}>Descríbela en español — Fluido la adaptará a tu nivel y perfil.</p>
              <textarea value={customSuggestion} onChange={e=>setCustomSuggestion(e.target.value)}
                placeholder="Ej: una videollamada con un cliente en EE.UU. para presentar los avances del sprint... / pedir un aumento de sueldo a mi manager / conocer a un nuevo colega en una conferencia..."
                rows={4} style={{width:"100%",padding:"12px 14px",fontSize:14,borderRadius:12,border:`1.5px solid ${C.line}`,outline:"none",resize:"vertical",background:C.paper,color:C.ink}}/>
              <div style={{display:"flex",gap:8,marginTop:10}}>
                <button onClick={()=>setShowCustom(false)} style={{flex:1,padding:"12px 0",borderRadius:12,border:`1.5px solid ${C.line}`,background:"transparent",color:C.inkSoft,fontWeight:500}}>Cancelar</button>
                <button onClick={()=>newScenario(customSuggestion)} disabled={!customSuggestion.trim()}
                  style={{flex:2,padding:"12px 0",borderRadius:12,border:"none",background:customSuggestion.trim()?C.blue:C.line,color:"#fff",fontWeight:600,fontSize:15}}>
                  Generar escenario →
                </button>
              </div>
            </div>
          )}
        </div>
      )}

      {scenario&&<div style={{background:C.blueSoft,borderRadius:12,padding:"10px 14px",marginBottom:12}}><strong style={{fontSize:14}}>{scenario.title_es}</strong><p style={{margin:"2px 0 0",fontSize:13,color:C.inkSoft}}>{scenario.context_es}</p></div>}

      <div style={{flex:1}}>
        {messages.map((m,i)=>(
          <div key={i} className="fadein" style={{marginBottom:10}}>
            <div style={{maxWidth:"85%",padding:"10px 14px",borderRadius:14,fontSize:16,lineHeight:1.5,fontFamily:FEN,background:m.role==="me"?C.blue:C.card,color:m.role==="me"?"#fff":C.ink,border:m.role==="me"?"none":`1px solid ${C.line}`,marginLeft:m.role==="me"?"auto":0}}>
              {m.text}
              {m.role==="them"&&<button onClick={()=>speak(m.text)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:16,marginLeft:6}}>🔊</button>}
            </div>
            {m.feedback&&<Feedback fb={m.feedback}/>}
          </div>
        ))}
        {failed&&<AudioWarning/>}
        {loading&&<p style={{color:C.inkSoft,fontSize:14}}>Pensando…</p>}
        {error&&<p style={{color:C.coral,fontSize:14}}>{error}</p>}
        <div ref={bottomRef}/>
      </div>

      {scenario&&(
        <div style={{position:"sticky",bottom:80,marginTop:10}}>
          <div style={{display:"flex",gap:8,background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:8}}>
            <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
              placeholder="Write your reply in English…" rows={2}
              style={{flex:1,border:"none",resize:"none",fontSize:16,outline:"none",background:"transparent",fontFamily:FEN,color:C.ink}}/>
            <button onClick={send} disabled={loading||!input.trim()}
              style={{alignSelf:"flex-end",background:C.blue,color:"#fff",border:"none",borderRadius:10,padding:"10px 16px",fontWeight:600,opacity:loading||!input.trim()?0.5:1}}>Enviar</button>
          </div>
          <div style={{display:"flex",gap:12,marginTop:8}}>
            <button onClick={()=>newScenario(null)} style={{background:"transparent",border:"none",color:C.inkSoft,fontSize:13,textDecoration:"underline"}}>🎲 Otra situación</button>
            <button onClick={()=>{setScenario(null);setMessages([]);setShowCustom(true);setCustomSuggestion("");}} style={{background:"transparent",border:"none",color:C.blue,fontSize:13,textDecoration:"underline"}}>✏️ Proponer escenario</button>
          </div>
        </div>
      )}
    </div>
  );
}
function Feedback({fb}){
  const hasErrors=fb.errors&&fb.errors.length>0;
  if(!hasErrors&&!fb.natural_en&&!fb.tip_es) return<div style={{maxWidth:"85%",marginLeft:"auto",marginTop:4,fontSize:13,color:C.green,textAlign:"right"}}>✓ Perfecto, así se dice</div>;
  return(
    <div className="fadein" style={{maxWidth:"92%",marginLeft:"auto",marginTop:6,background:C.card,border:`1px dashed ${C.line}`,borderRadius:12,padding:"10px 12px",fontSize:14}}>
      {hasErrors&&fb.errors.map((e,i)=>(<p key={i} style={{margin:"0 0 6px",lineHeight:1.6}}><span className="hl-red" style={{fontFamily:FEN}}>{e.wrong}</span>{" → "}<span className="hl-green" style={{fontFamily:FEN}}>{e.right}</span><br/><span style={{color:C.inkSoft,fontSize:13}}>{e.why_es}</span></p>))}
      {fb.natural_en&&<p style={{margin:"6px 0 0",lineHeight:1.5}}><span style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1}}>Versión natural</span><br/><span className="hl" style={{fontFamily:FEN,fontSize:15}}>{fb.natural_en}</span></p>}
      {fb.tip_es&&<p style={{margin:"8px 0 0",fontSize:13,color:C.blue}}>💡 {fb.tip_es}</p>}
    </div>
  );
}

function Phrases({state,save,registerActivity,initialMode}){
  const [mode,setMode]=useState(initialMode||'cards');
  const [flipped,setFlipped]=useState(false);
  const [generating,setGenerating]=useState(false);
  const [error,setError]=useState(null);
  const [info,setInfo]=useState(null);
  const {speak,failed}=useSpeech();
  const now=Date.now();
  const due=state.deck.filter(c=>c.due<=now).sort((a,b)=>a.due-b.due);
  const card=due[0];
  const grade=g=>{
    const deck=state.deck.map(c=>{
      if(c.id!==card.id) return c;
      let interval=g==="again"?0:g==="good"?Math.max(1,(c.interval||0)*2):Math.max(3,(c.interval||1)*3);
      return{...c,interval,due:g==="again"?Date.now()+10*60*1000:Date.now()+interval*86400000,seen:c.seen+1};
    });
    setFlipped(false);registerActivity("phrases",{deck});
  };
  const generateMore=async()=>{
    setGenerating(true);setError(null);setInfo(null);
    try{
      const have=new Set(state.deck.map(c=>c.en.toLowerCase().trim()));
      const bank=loadBank();
      const fromBank=bank.phrases.filter(p=>!have.has(p.en.toLowerCase().trim())).slice(0,5);
      let newPhrases=[...fromBank];
      if(newPhrases.length<5){
        const need=5-newPhrases.length;
        const arr=await askAI_JSON(`Perfil (sin nombre): ${profileForPrompts(state,false)}\n\nGenera ${need} frases nuevas útiles para este perfil. NO repitas: ${state.deck.map(c=>c.en).slice(-40).join(" | ")}\n\nDevuelve JSON array: [{"es":"español","en":"inglés","note_es":"nota breve"}]`,
          "Eres un profesor de inglés práctico.");
        newPhrases=[...newPhrases,...arr.map(p=>({es:p.es,en:p.en,note_es:p.note_es||""}))];
        bank.phrases=[...bank.phrases,...arr.map(p=>({es:p.es,en:p.en,note_es:p.note_es||""}))];
        saveBank(bank);
      }else{setInfo("♻️ Frases del banco local — sin costo de IA.");}
      save({...state,deck:[...state.deck,...newPhrases.slice(0,5).map((p,i)=>({id:"g"+Date.now()+i,es:p.es,en:p.en,note:p.note_es||"",interval:0,due:0,seen:0}))]});
    }catch(e){setError(e.userMsg||"No pude conseguir frases. Intenta de nuevo.");}
    setGenerating(false);
  };
  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Frases</h2>
      {/* Mode switcher */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[{id:"cards",l:"📚 Tarjetas"},{id:"grammar",l:"📝 Gramática"},{id:"verbs",l:"🔤 Verbos"}].map(m=>(
          <button key={m.id} onClick={()=>setMode(m.id)}
            style={{flex:1,padding:"8px 4px",borderRadius:10,border:`1.5px solid ${mode===m.id?C.blue:C.line}`,background:mode===m.id?C.blueSoft:"transparent",color:mode===m.id?C.blue:C.inkSoft,fontWeight:600,fontSize:11}}>
            {m.l}
          </button>))}
      </div>
      {mode==="grammar" && <Grammar state={state} registerActivity={registerActivity}/>}
      {mode==="verbs"   && <Verbs registerActivity={registerActivity}/>}
      {mode==="cards" && (<div>
      <p style={{marginBottom:14,fontSize:14,color:C.inkSoft}}>Lee el español, <span className="hl">dilo en voz alta en inglés</span>, y recién ahí voltea la tarjeta.</p>
      <div style={{display:"flex",gap:10,marginBottom:14,fontSize:13,color:C.inkSoft}}>
        <span>📚 {state.deck.length} en tu mazo</span><span>⏰ {due.length} por repasar</span>
      </div>
      {card?(
        <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:18,padding:22,minHeight:220,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
          <div>
            <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5}}>{flipped?"En inglés se dice":"¿Cómo dirías…?"}</p>
            <p style={{fontSize:21,fontWeight:500,margin:"10px 0",lineHeight:1.4}}>{card.es}</p>
            {flipped&&(
              <div className="fadein">
                <p style={{fontFamily:FEN,fontSize:23,margin:"6px 0",lineHeight:1.4}}>
                  <span className="hl">{card.en}</span>{" "}
                  <button onClick={()=>speak(card.en)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:20}}>🔊</button>
                </p>
                <p style={{fontSize:13,color:C.inkSoft,margin:"8px 0 0"}}>{card.note}</p>
                {failed&&<AudioWarning/>}
              </div>
            )}
          </div>
          {!flipped?<BigButton onClick={()=>{setFlipped(true);speak(card.en);}}>Mostrar respuesta</BigButton>:(
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <GradeBtn color={C.coral} bg={C.coralSoft} onClick={()=>grade("again")} label="Otra vez" sub="en 10 min"/>
              <GradeBtn color={C.blue} bg={C.blueSoft} onClick={()=>grade("good")} label="Bien" sub={`en ${Math.max(1,(card.interval||0)*2)}d`}/>
              <GradeBtn color={C.green} bg={C.greenSoft} onClick={()=>grade("easy")} label="Fácil" sub={`en ${Math.max(3,(card.interval||1)*3)}d`}/>
            </div>)}
        </div>
      ):(
        <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:18,padding:22,textAlign:"center"}}>
          <p style={{fontWeight:600,color:C.green,marginBottom:4}}>✓ Mazo al día</p>
          <p style={{fontSize:14,color:C.inkSoft}}>No hay tarjetas pendientes ahora.</p>
        </div>
      )}
      <button onClick={generateMore} disabled={generating}
        style={{width:"100%",marginTop:14,padding:14,borderRadius:14,border:`2px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15,opacity:generating?0.6:1}}>
        {generating?"Buscando…":"✨ Agregar 5 frases nuevas"}
      </button>
      {info&&<p style={{color:C.green,fontSize:13,marginTop:8}}>{info}</p>}
      {error&&<p style={{color:C.coral,fontSize:14,marginTop:8}}>{error}</p>}
      </div>)}
    </div>
  );
}
function GradeBtn({color,bg,onClick,label,sub}){return(<button onClick={onClick} style={{flex:1,padding:"10px 4px",borderRadius:12,border:`1.5px solid ${color}`,background:bg,color,fontWeight:600,fontSize:14}}>{label}<div style={{fontSize:10,fontWeight:400,marginTop:2,opacity:0.8}}>{sub}</div></button>);}

// ============================================================
const SPEEDS=[{v:0.5,l:"0.5×"},{v:0.8,l:"0.8×"},{v:1.0,l:"Normal"},{v:1.5,l:"1.5×"},{v:2.0,l:"2×"}];

function Listen({state,save,registerActivity}){
  const [exercise,setExercise]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [info,setInfo]=useState(null);
  const [picked,setPicked]=useState(null);
  const [revealed,setRevealed]=useState(false);
  const [readingMode,setReadingMode]=useState(false);
  const [rate,setRate]=useState(1.0);
  const [playing,setPlaying]=useState(false);
  const {speak,stop,failed,supported}=useSpeech();
  useEffect(()=>()=>stop(),[stop]);
  useEffect(()=>{if(failed)setReadingMode(true);},[failed]);

  const newExercise=async()=>{
    setLoading(true);setError(null);setInfo(null);setExercise(null);setPicked(null);setRevealed(false);stop();setPlaying(false);
    try{
      const bank=loadBank();
      const used=new Set(state.usedListening||[]);
      const cands=bank.listening.filter(e=>e.id&&!used.has(e.id)&&e.level===state.level);
      if(cands.length>0){
        const pick=cands[Math.floor(Math.random()*cands.length)];
        setExercise(pick);save({...state,usedListening:[...(state.usedListening||[]),pick.id].slice(-300)});
        setInfo("♻️ Audio del banco local — sin costo de IA.");setLoading(false);return;
      }
      const data=await askAI_JSON(
        `Perfil (sin nombre): ${profileForPrompts(state,false)}\n\nGenera un ejercicio de listening en inglés para este perfil: diálogo (4-6 líneas) entre dos personas sobre sus objetivos o intereses. Varía el tema (semilla: ${Math.random().toString(36).slice(2)}).\n\nDevuelve JSON: {"title_es":"título","dialogue":[{"speaker":"nombre","line":"inglés"}],"question_es":"pregunta de comprensión","options_es":["A","B","C"],"correct_index":0,"key_phrase_en":"expresión útil","key_phrase_es":"traducción"}`,
        "Eres un profesor de inglés que crea ejercicios de listening realistas.");
      data.id="L"+Date.now()+Math.random().toString(36).slice(2,6);data.level=state.level;
      setExercise(data);const bank2=loadBank();bank2.listening=[...bank2.listening,data];saveBank(bank2);
      save({...state,usedListening:[...(state.usedListening||[]),data.id].slice(-300)});
    }catch(e){setError(e.userMsg||"Error al obtener el ejercicio.");}
    setLoading(false);
  };
  const play=()=>{if(!exercise)return;setPlaying(true);speak(exercise.dialogue,{rate,onEnd:()=>setPlaying(false)});};
  const stopAll=()=>{stop();setPlaying(false);};
  const answer=i=>{if(picked!==null)return;setPicked(i);registerActivity("listen");};

  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Escuchar</h2>
      <p style={{marginBottom:14,fontSize:14,color:C.inkSoft}}>Escucha primero <span className="hl">sin leer</span>. La transcripción se revela al final.</p>
      {!exercise&&!loading&&<div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:20,textAlign:"center"}}><p style={{fontFamily:FEN,fontSize:18,marginBottom:14}}>Train your ear.</p><BigButton onClick={newExercise}>Nuevo audio</BigButton></div>}
      {loading&&<p style={{color:C.inkSoft}}>Preparando ejercicio…</p>}
      {error&&<p style={{color:C.coral}}>{error}</p>}
      {info&&<p style={{color:C.green,fontSize:13}}>{info}</p>}
      {exercise&&(
        <div>
          <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18}}>
            <strong>{exercise.title_es}</strong>
            {!readingMode?(
              <React.Fragment>
                <div style={{display:"flex",alignItems:"center",gap:10,marginTop:12}}>
                  <button onClick={playing?stopAll:play} style={{width:56,height:56,borderRadius:"50%",border:"none",background:C.blue,color:"#fff",fontSize:22}} aria-label={playing?"Detener":"Reproducir"}>{playing?"■":"▶"}</button>
                  <div style={{flex:1}}>
                    <p style={{fontSize:12,color:C.inkSoft,marginBottom:5}}>Velocidad de reproducción</p>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                      {SPEEDS.map(o=>(
                        <button key={o.v} onClick={()=>setRate(o.v)}
                          style={{padding:"5px 10px",borderRadius:8,fontSize:12,fontWeight:600,border:`1.5px solid ${rate===o.v?C.blue:C.line}`,background:rate===o.v?C.blueSoft:"transparent",color:rate===o.v?C.blue:C.inkSoft}}>
                          {o.l}
                        </button>))}
                    </div>
                  </div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                  <p style={{fontSize:12,color:C.inkSoft}}>Escúchalo las veces que necesites.</p>
                  <button onClick={()=>setReadingMode(true)} style={{border:"none",background:"transparent",color:C.inkSoft,fontSize:12,textDecoration:"underline"}}>¿No escuchas nada?</button>
                </div>
                {failed&&<AudioWarning/>}
              </React.Fragment>
            ):(
              <div style={{marginTop:12}}>
                {failed&&<AudioWarning/>}
                <p style={{fontSize:13,color:C.inkSoft,margin:"10px 0 8px"}}><strong>Modo lectura:</strong> lee el diálogo una vez a ritmo normal, luego ocúltalo para responder.</p>
                {!revealed&&picked===null?<ReadOnce dialogue={exercise.dialogue}/>:null}
                {supported&&<button onClick={()=>setReadingMode(false)} style={{border:"none",background:"transparent",color:C.blue,fontSize:12,textDecoration:"underline",marginTop:6}}>Reintentar con audio</button>}
              </div>
            )}
          </div>
          <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18,marginTop:12}}>
            <p style={{fontWeight:600,marginBottom:10}}>{exercise.question_es}</p>
            {exercise.options_es.map((op,i)=>{
              const isC=i===exercise.correct_index,isP=picked===i;
              let border=C.line,bg="transparent",color=C.ink;
              if(picked!==null){if(isC){border=C.green;bg=C.greenSoft;color=C.green;}else if(isP){border=C.coral;bg=C.coralSoft;color=C.coral;}}
              return<button key={i} onClick={()=>answer(i)} style={{display:"block",width:"100%",textAlign:"left",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${border}`,background:bg,color,fontSize:15,marginBottom:8,fontWeight:picked!==null&&isC?600:400}}>{op}</button>;
            })}
            {picked!==null&&<p className="fadein" style={{marginTop:4,fontWeight:600,color:picked===exercise.correct_index?C.green:C.coral}}>{picked===exercise.correct_index?"✓ ¡Correcto! Tu oído está despertando.":"Casi. Revisa la transcripción y prueba otro audio."}</p>}
          </div>
          {picked!==null&&(
            <div className="fadein" style={{marginTop:12}}>
              {!revealed?<BigButton onClick={()=>setRevealed(true)}>Ver transcripción</BigButton>:(
                <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:18}}>
                  {exercise.dialogue.map((d,i)=><p key={i} style={{marginBottom:8,lineHeight:1.5}}><strong style={{fontSize:13,color:C.inkSoft}}>{d.speaker}:</strong>{" "}<span style={{fontFamily:FEN,fontSize:16}}>{d.line}</span></p>)}
                  <div style={{borderTop:`1px dashed ${C.line}`,paddingTop:10,marginTop:10}}>
                    <p style={{fontSize:13,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1}}>Expresión para tu mochila</p>
                    <p style={{margin:"4px 0 0",fontFamily:FEN,fontSize:16}}><span className="hl">{exercise.key_phrase_en}</span><span style={{fontFamily:FUI,fontSize:13,color:C.inkSoft}}> — {exercise.key_phrase_es}</span></p>
                  </div>
                </div>
              )}
              <button onClick={newExercise} style={{width:"100%",marginTop:10,padding:14,borderRadius:14,border:`2px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15}}>Otro audio</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
function ReadOnce({dialogue}){
  const [visible,setVisible]=useState(true);
  if(!visible) return<p style={{fontSize:13,color:C.inkSoft,fontStyle:"italic"}}>Diálogo oculto. Responde la pregunta de memoria 👇</p>;
  return(
    <div>
      <div style={{background:C.paper,borderRadius:12,padding:12}}>
        {dialogue.map((d,i)=><p key={i} style={{marginBottom:6,lineHeight:1.5}}><strong style={{fontSize:12,color:C.inkSoft}}>{d.speaker}:</strong>{" "}<span style={{fontFamily:FEN,fontSize:15}}>{d.line}</span></p>)}
      </div>
      <button onClick={()=>setVisible(false)} style={{width:"100%",marginTop:8,padding:10,borderRadius:10,border:`1.5px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:14}}>Listo, ocultar diálogo</button>
    </div>
  );
}
