function buildColors(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  const base = t.dark ? {
    paper:"#0F172A", card:"#1E293B", ink:"#F1F5F9", inkSoft:"#94A3B8", line:"#334155",
    green:"#34D399", greenSoft:"#022C22", coral:"#F87171", coralSoft:"#3B0A0A", marker:"#FCD34D",
  } : {
    paper:"#F7F9FB", card:"#FFFFFF", ink:"#13243B", inkSoft:"#5A6B82", line:"#E3E9F0",
    green:"#1FA86B", greenSoft:"#E7F7EF", coral:"#F25C4D", coralSoft:"#FDEDEA", marker:"#FFE34D",
  };
  if(t.paper && !t.dark) base.paper=t.paper;
  return { ...base, blue:t.accent, blueSoft:t.soft };
}

function getSavedTheme() { try { return localStorage.getItem("fluido-theme") || "light-blue"; } catch(e) { return "light-blue"; } }

// C es mutable a nivel de módulo — se actualiza al cambiar tema y React re-renderiza el árbol

// Aplicar CSS vars para elementos que las usen
function applyCSSVars(id) {
  const colors = buildColors(id);
  const r = document.documentElement;
  r.style.setProperty("--blue",   colors.blue);
  r.style.setProperty("--marker", colors.marker);
  r.style.setProperty("--paper",  colors.paper);
  r.style.setProperty("--ink",    colors.ink);
  r.style.setProperty("--card",   colors.card);
  r.style.setProperty("--ink-soft", colors.inkSoft);
  r.style.setProperty("--line",   colors.line);
  document.body.style.background = colors.paper;
  document.body.style.color      = colors.ink;
}
applyCSSVars(getSavedTheme());

e, no plural, no a/an","en":"salt","note":"Incontable · some salt ✅ · a gram of salt ✅ · a salt ❌ · salts ❌"},{"es":"muebles — ¡en inglés es incontable y singular!","en":"furniture","note":"Incontable · some furniture ✅ · a piece of furniture ✅ · a furniture ❌ · furnitures ❌"},{"es":"información — incontable en inglés","en":"information","note":"Incontable · some information ✅ · a piece of information ✅ · an information ❌"},{"es":"dinero — incontable, siempre singular","en":"money","note":"Incontable · some money ✅ · a lot of money ✅ · a money ❌ · moneys ❌"},{"es":"Para delimitar un incontable y hacerlo contable","en":"a [unit] of [noun]","note":"Expresión partitiva · a cup of tea · a glass of wine · a piece of wood · a gram of salt"},{"es":"dos tazas de té = two cups of tea","en":"a cup of tea","note":"Partitiva · cup = contable · tea = incontable. Se cuenta la taza, no el té."},{"es":"\"a piece of\" funciona con muchos incontables","en":"a piece of…","note":"Partitiva · a piece of wood · a piece of furniture · a piece of information · a piece of bread"},{"es":"Si tiene plural → contable. Si no → incontable.","en":"¿plural o no?","note":"⚡ Clave · \"dog/dogs\" → contable. \"rice/rices?\" → ❌ incontable."},{"es":"Algunos son plurales en español pero incontables en inglés","en":"Spanish ≠ English","note":"⚡ Truco · \"furniture\" (muebles) · \"hair\" (pelos) · \"information\" (informaciones) → singulares en inglés"},{"es":"\"Hay\" en español. Indica existencia de algo.","en":"there + be","note":"Concepto · \"There is a cat.\" (Hay un gato.) / \"There are three cats.\" (Hay tres gatos.)"},{"es":"Contable plural → there are (sin forma corta)","en":"there are","note":"there are · \"There are five pencils.\" / \"There are many people.\" / \"There are three houses.\""},{"es":"Verbo delante de \"there\" para preguntar (singular)","en":"Is there…?","note":"Interrogativa singular · \"Is there a pen?\" / \"Is there sugar?\" → ¿Hay…?"},{"es":"Verbo delante de \"there\" para pre l","note":"Verbo · \"do yoga / do karate / do gymnastics / do exercise\""},{"es":"gimnasio / piscina / cancha / campo","en":"gym / pool / court / field","note":"Lugar · \"I go to the gym.\" / \"The pool is closed.\" / \"Meet me at the court.\""},{"es":"ejercicio / entrenar / practicar","en":"exercise / train / practice","note":"Ejercicio · \"I exercise every morning.\" / \"She trains at the gym.\" / \"Practice your skills.\""},{"es":"equipo / jugador / partido","en":"team / player / match","note":"Equipo · \"Our team won!\" / \"He is a great player.\" / \"The match starts at 3.\""},{"es":"manzana / plátano / naranja","en":"apple / banana / orange","note":"Fruta · \"I need three apples and two bananas.\" / \"Orange juice, please.\""},{"es":"tomate / patata / zanahoria","en":"tomato / potato / carrot","note":"Verdura · \"We need tomatoes for the salad.\" / \"I love carrots.\""},{"es":"leche / queso / mantequilla / huevos","en":"milk / cheese / butter / eggs","note":"Lácteo · \"We need milk and eggs.\" / \"Buy some cheese, please.\""},{"es":"pan / arroz / pasta","en":"bread / rice / pasta","note":"Pan · \"We need a loaf of bread.\" / \"Do we have rice at home?\""},{"es":"agua / zumo / café / té","en":"water / juice / coffee / tea","note":"Bebida · \"A bottle of water, please.\" / \"I want some orange juice.\""},{"es":"una botella de / un cartón de","en":"a bottle of / a carton of","note":"Cantidad · \"a bottle of water\" / \"a carton of milk\" / \"a carton of juice\""},{"es":"una bolsa de / una barra de (pan)","en":"a bag of / a loaf of","note":"Cantidad · \"a bag of rice\" / \"a loaf of bread\" / \"a bag of flour\""},{"es":"lista de compras / carrito / cesta","en":"shopping list / trolley / basket","note":"Compra · \"Write a shopping list.\" / \"Get a trolley, we need a lot.\""},{"es":"Conecta ideas similares o añade información","en":"and","note":"Coordinante · \"I like tea and coffee.\" / \"She danced and sang.\""},{"es":"Indica resultado o consecuencia","en":"so"," UÉ FRECUENCIA. Van antes del verbo (después de be)","en":"Adverbs of Frequency","note":"Frecuencia · \"I always eat breakfast.\" / \"She is usually late.\""},{"es":"Dicen DÓNDE. Van después del verbo o al final","en":"Adverbs of Place","note":"Lugar · \"Come here.\" / \"She looked everywhere.\" / \"He went outside.\""},{"es":"Adverbios de tiempo o conectores pueden ir al inicio","en":"Inicio de oración","note":"Posición · \"Yesterday, I went to the park.\" / \"Finally, she arrived.\""},{"es":"Los de frecuencia van entre sujeto y verbo (después de be/aux)","en":"Medio de oración","note":"Posición · \"I often read.\" / \"She has never been.\" / \"He is always happy.\""},{"es":"Modo, lugar y tiempo suelen ir al final (en ese orden)","en":"Final de oración","note":"Posición · \"She sang beautifully at the concert yesterday.\""},{"es":"Cuando hay varios, el orden es: Modo → Lugar → Tiempo","en":"Manner → Place → Time","note":"Orden · \"He worked hard (M) at the office (P) yesterday (T).\""},{"es":"Alguien — se usa en afirmativas y ofrecimientos","en":"someone / somebody","note":"some- · \"Someone called you.\" / \"Would you like something to drink?\""},{"es":"Nadie — frase afirmativa con significado negativo","en":"no one / nobody","note":"no- · \"Nobody knows the answer.\" / \"No one came to the party.\""},{"es":"Todos los indefinidos llevan verbo en SINGULAR","en":"Verbo en singular","note":"⚡ Clave · \"Everyone IS ready.\" ✅ / \"Everyone ARE ready.\" ❌"},{"es":"Que/quien — para personas (sujeto)","en":"who","note":"Persona · \"The woman who lives next door is a doctor.\""},{"es":"A quien — para personas (objeto, formal)","en":"whom","note":"Persona · \"The man whom I met was friendly.\" / \"To whom it may concern.\""},{"es":"Que/el cual — para cosas y animales","en":"which","note":"Cosa · \"The book which I bought is interesting.\" / \"The dog which barked...\""},{"es":"Cuyo/a — indica posesión (personas y cosas)","en":"whose","note":"Posesión · \"The boy whose bike was stolen.\" / \"A country whose capital is Rome.\""},{"es":"Donde — para lugares","en":"where","note":"Lugar · \"The hotel where we stayed was nice.\" / \"This is the town where I grew up.\""},{"es":"Cuando — para momentos en el tiempo","en":"when","note":"Tiempo · \"I remember the day when we met.\" / \"Summer is when I relax.\""},{"es":"Cláusulas que IDENTIFICAN — sin comas, esenciales","en":"Defining clauses","note":"Tipo · \"The students who study hard pass.\" (identifica cuáles estudiantes)"},{"es":"Cláusulas que AÑADEN INFO — con comas, no esenciales","en":"Non-defining clauses","note":"Tipo · \"My sister, who lives in London, is a teacher.\" (info adicional)"},{"es":"NO se usa \"that\" en cláusulas no definitorias (con comas)","en":"that ≠ non-defining","note":"⚡ Clave · \"Paris, which is in France, is beautiful.\" ✅ / \"Paris, that is...\" ❌"},{"es":"Adjetivos cortos (1 sílaba): añadir -er + than","en":"Short adj + -er + than","note":"Comparativo · \"She is taller than me.\" / \"This is cheaper than that.\""},{"es":"Adjetivos cortos: the + adj-est","en":"the + short adj + -est","note":"Superlativo · \"He is the tallest in the class.\" / \"This is the cheapest.\""},{"es":"Si termina en -e, solo añadir -r / -st","en":"-e → -er / -est","note":"Regla · nice → nicer → the nicest / large → larger → the largest"},{"es":"Consonante-vocal-consonante: duplicar la última consonante","en":"CVC → double consonant","note":"Regla · big → bigger → biggest / hot → hotter → hottest / thin → thinner"},{"es":"Consonante + y: cambiar y por i + -er/-est","en":"consonant + y → -ier / -iest","note":"Regla · happy → happier → happiest / easy → easier → easiest"},{"es":"Irregular: bad / worse / the worst","en":"bad → worse → worst","note":"Irregular · \"This is worse than I thought.\" / \"The worst day of my life.\""},{"es":"-ing describe la CAUSA de ese sentimiento","en":"boring / tiring / interesting","note":"-ing · \"The movie is boring.\" (La película es aburrida) / \"The job is tiring.\""},{"es":"-ed: persona sorprendida / -ing: cosa sorprendente","en":"surprised / surprising","note":"Par · \"I was surprised.\" / \"The news was surprising.\""},{"es":"-ed: persona decepcionada / -ing: cosa decepcionante","en":"disappointed / disappointing","note":"Par · \"She was disappointed.\" / \"The results were disappointing.\""},{"es":"-ed: persona avergonzada / -ing: situación vergonzosa","en":"embarrassed / embarrassing","note":"Par · \"I felt embarrassed.\" / \"It was an embarrassing moment.\""},{"es":"-ed: persona asustada / -ing: cosa que asusta","en":"frightened / frightening","note":"Par · \"The children were frightened.\" / \"The movie was frightening.\""},{"es":"Regla general: -ed para personas (sentimiento), -ing para cosas/situaciones (causa)","en":"Persona = -ed / Cosa = -ing","note":"⚡ Clave · \"I am bored.\" (yo siento) vs \"The class is boring.\" (causa el sentimiento)"},{"es":"Muy — el más común, modifica adjetivos y adverbios","en":"very","note":"Intensificador · \"She is very tall.\" / \"He speaks very quickly.\""},{"es":"\"very\" + adj. normal / \"absolutely\" + adj. extremo","en":"very vs absolutely","note":"⚡ Clave · \"very good\" ✅ \"absolutely fantastic\" ✅ / \"very fantastic\" ❌ \"absolutely good\" ❌"},{"es":"Adverbios cortos (1 sílaba): añadir -er (comp.) / -est (superl.)","en":"Short adverbs: + -er / -est","note":"Regla · \"She runs faster than me.\" / \"He works the hardest.\""},{"es":"Adverbios terminados en -ly: more (comp.) / most (superl.)","en":"Adverbs in -ly: more / most","note":"Regla · \"She speaks more clearly than him.\" / \"He works the most efficiently.\""},{"es":"Adverbio corto: fast → faster (than)","en":"fast → faster","note":"Comparativo · \"He drives faster than his brother.\""},{"es":"Adverbio -ly: quickly → more quickly (than)","en":"quickly → more quickly","note":"Comparativo · \"She reacts more quickly than me.\""},{"es":"Irregular: well / better / the best","en":"well → better → best","note":"Irregular · \"She sings better than me.\" / \"He cooks the best.\""},{"es":"Irregular: badly / worse / the worst","en":"badly → worse → worst","note":"Irregular · \"He played worse today.\" / \"She performed the worst.\""},{"es":"Irregular: far / farther (further) / farthest (furthest)","en":"far → farther/further → farthest/furthest","note":"Irregular · \"She walked farther than us.\" / \"He lives the farthest away.\""},{"es":"Menos: less + adverbio + than","en":"less + adverb + than","note":"Menos · \"He speaks less fluently than her.\" / \"She studies less often.\""},{"es":"\"Like\" = como (comparación). Va seguido de sustantivo o pronombre","en":"like + noun/pronoun","note":"Like · \"She looks like her mother.\" / \"He runs like a cheetah.\""},{"es":"\"Like\" puede ir seguido de un verbo en -ing (informal)","en":"like + -ing verb","note":"Like · \"It feels like flying.\" / \"It sounds like raining.\""},{"es":"\"As\" va seguido de una cláusula (sujeto + verbo)","en":"as + clause (subject + verb)","note":"As · \"Do as I say.\" / \"As I mentioned before…\""},{"es":"\"As\" = como (en calidad de / en función de)","en":"as + job / role","note":"As · \"She works as a teacher.\" / \"He used it as a table.\""},{"es":"Expresiones fijas con \"as\"","en":"as usual / as always","note":"Expresión · \"As usual, he was late.\" / \"As always, she helped everyone.\""},{"es":"\"Such as\" = tales como (para dar ejemplos)","en":"such as","note":"Expresión · \"I like fruits such as apples and oranges.\""},{"es":"Like con verbos de percepción","en":"look like / sound like / feel like","note":"Expresión · \"It looks like rain.\" / \"That sounds like a good idea.\""},{"es":"like + sustantivo (comparación) / as + verbo (rol o manera)","en":"like vs as (resumen)","note":"⚡ Clave · \"Like I said\" ❌ (informal) → \"As I said\" ✅ (correcto formal)"},{"es":"Estos verbos siempre van seguidos de gerundio (-ing)","en":"enjoy, finish, avoid, mind","note":"Verbo + -ing · \"I enjoy swimming.\" / \"She finished reading.\" / \"Avoid eating fast food.\""},{"es":"Más verbos que exigen gerundio","en":"keep, suggest, consider, practice","note":"Verbo + -ing · \"Keep trying!\" / \"I suggest going early.\" / \"Consider changing jobs.\""},{"es":"Estos verbos siempre van seguidos de infinitivo (to)","en":"want, need, decide, plan","note":"Verbo + to · \"I want to go.\" / \"She needs to study.\" / \"He decided to leave.\""},{"es":"Más verbos que exigen infinitivo","en":"hope, expect, learn, agree","note":"Verbo + to · \"I hope to see you.\" / \"She agreed to help.\" / \"He learned to cook.\""},{"es":"Pueden ir con -ing o to sin cambiar el significado","en":"like, love, hate, start, begin","note":"Ambos · \"I like swimming.\" = \"I like to swim.\" / \"She started working/to work.\""},{"es":"Cambia el significado: stop doing = dejar de / stop to do = parar para","en":"stop + -ing vs stop + to","note":"Cambio · \"Stop smoking.\" (deja de fumar) vs \"Stop to smoke.\" (para para fumar)"},{"es":"remember doing = recordar algo pasado / remember to do = acordarse de","en":"remember + -ing vs + to","note":"Cambio · \"I remember meeting him.\" (recuerdo) vs \"Remember to call.\" (no olvides)"},{"es":"Preguntas cerradas: inverter auxiliar y sujeto","en":"Auxiliar + sujeto + verbo?","note":"Yes/No · \"Do you like pizza?\" / \"Is she coming?\" / \"Have you been there?\""},{"es":"Preguntas abiertas: Wh- + auxiliar + sujeto + verbo","en":"Wh- word + auxillar + sujeto + verbo?","note":"Wh- · \"Where do you live?\" / \"What are you doing?\" / \"Why did she leave?\""},{"es":"What = qué; Which = cuál (de opciones); Who = quién","en":"What / Which / Who","note":"Wh- palabra · \"What is your name?\" / \"Which color do you prefer?\" / \"Who called?\""},{"es":"Where = dónde; When = cuándo; Why = por qué","en":"Where / When / Why","note":"Wh- palabra · \"Where are you?\" / \"When is the meeting?\" / \"Why are you crying?\""},{"es":"How = cómo; How much = cuánto (incontable); How many = cuántos (contable)","en":"How / How much / How many","note":"Wh- palabra · \"How are you?\" / \"How much is it?\" / \"How many do you have?\""},{"es":"How + adjetivo/adverbio para preguntar grado","en":"How + adj/adv","note":"Wh- palabra · \"How old are you?\" / \"How far is it?\" / \"How often do you go?\""},{"es":"Cuando who/what son el SUJETO, NO se usa auxiliar","en":"Who/What como sujeto","note":"Sujeto · \"Who called you?\" (who = sujeto) vs \"Who did you call?\" (who = objeto)"},{"es":"Present simple: Do + I/you/we/they, Does + he/she/it","en":"Do/Does (present simple)","note":"Auxiliar · \"Do you work here?\" / \"Does she speak French?\""},{"es":"Past simple: Did + sujeto + verbo base (sin -ed)","en":"Did (past simple)","note":"Auxiliar · \"Did you go to the party?\" / \"Did she call you?\""},{"es":"➜ Después de do/does/did, el verbo principal va en forma BASE","en":"Verbo base después de do/does/did","note":"⚡ Clave · \"Does she like pizza?\" ✅ / \"Does she likes?\" ❌"},{"es":"\"What\" se usa cuando las opciones NO están limitadas","en":"What — opciones abiertas","note":"What · \"What is your favorite food?\" (puede ser cualquier cosa)"},{"es":"\"Which\" se usa cuando hay un número LIMITADO de opciones","en":"Which — opciones limitadas","note":"Which · \"Which color do you prefer, red or blue?\" (opciones definidas)"},{"es":"What + sustantivo para preguntar de forma general","en":"What + noun (general)","note":"What · \"What music do you like?\" / \"What food do you prefer?\""},{"es":"Which + sustantivo para elegir entre opciones específicas","en":"Which + noun (específico)","note":"Which · \"Which dress should I wear?\" / \"Which bus goes to the center?\""},{"es":"What para preguntar por identidad, definición o profesión","en":"What + be (identidad)","note":"What · \"What is this?\" / \"What do you do?\" / \"What is love?\""},{"es":"Which of + grupo para elegir de un conjunto específico","en":"Which + of (de un grupo)","note":"Which · \"Which of these books is yours?\" / \"Which of you wants to go first?\""},{"es":"A veces se pueden usar ambos sin gran diferencia","en":"What/Which + noun (intercambiable a veces)","note":"Ambos · \"What/Which language do you speak?\" (si son pocas, which; si muchas, what)"},{"es":"\"What … like?\" para preguntar por descripción/opinión","en":"What … like?","note":"What · \"What is he like?\" (cómo es) / \"What was the movie like?\""},{"es":"\"Which one?\" para elegir entre opciones visibles","en":"Which one(s)?","note":"Which · \"Which one do you want?\" / \"Which ones are yours?\""},{"es":"Se usa para acciones que empezaron y terminaron en un tiempo específico del pasado","en":"Acciones completadas en el pasado","note":"Uso · \"I visited London last year.\" / \"She graduated in 2020.\""},{"es":"La mayoría de verbos añaden -ed al infinitivo","en":"Regular: verbo + -ed","note":"Forma · work → worked / play → played / walk → walked"},{"es":"Muchos verbos comunes tienen formas irregulares","en":"Irregular: forma propia","note":"Forma · go → went / see → saw / eat → ate / have → had / buy → bought"},{"es":"Si el verbo ya termina en -e, solo añadir -d","en":"-e → solo +d","note":"Regla · live → lived / dance → danced / love → loved"},{"es":"Si termina en consonante + y: cambiar y por -ied","en":"Consonante + y → -ied","note":"Regla · study → studied / carry → carried / try → tried"},{"es":"Consonante-vocal-consonante (1 sílaba): duplicar la última","en":"CVC → duplicar + -ed","note":"Regla · stop → stopped / plan → planned / drop → dropped"},{"es":"Pregunta: Did + sujeto + verbo en forma BASE","en":"Did + sujeto + verbo base?","note":"Pregunta · \"Did you see the movie?\" / \"Did she arrive on time?\""},{"es":"Marcadores de tiempo del pasado simple","en":"yesterday / last / ago","note":"Marcador · \"yesterday\" / \"last week\" / \"two days ago\" / \"in 2010\""},{"es":"Describe una acción que ESTABA OCURRIENDO en un momento del pasado","en":"Acción en progreso en el pasado","note":"Uso · \"I was reading at 8 PM.\" / \"She was cooking when I arrived.\""},{"es":"Sujeto + was/were + verbo en -ing","en":"was/were + verbo-ing","note":"Forma · \"I was working.\" / \"They were playing.\" / \"She was studying.\""},{"es":"\"Was\" para sujetos singulares (excepto you)","en":"was → I/he/she/it","note":"Forma · \"I was sleeping.\" / \"He was driving.\" / \"It was raining.\""},{"es":"\"Were\" para you, we, they","en":"were → you/we/they","note":"Forma · \"You were talking.\" / \"We were waiting.\" / \"They were dancing.\""},{"es":"Pregunta: invertir was/were y sujeto","en":"Was/Were + sujeto + -ing?","note":"Pregunta · \"Were you sleeping?\" / \"Was she working at that time?\""},{"es":"La acción larga (continuous) fue interrumpida por una corta (simple)","en":"Interrupción: past continuous + past simple","note":"Uso · \"I was having dinner when the phone rang.\""},{"es":"Dos acciones largas ocurriendo al mismo tiempo","en":"Acciones simultáneas: while","note":"Uso · \"While I was cooking, she was cleaning.\" / \"He was reading while she was singing.\""},{"es":"Marcadores típicos del pasado continuo","en":"when / while / at that moment","note":"Marcador · \"while I was walking…\" / \"when she arrived…\" / \"at 10 PM last night…\""},{"es":"Simple = acción puntual / Continuous = acción en progreso","en":"Past Simple vs Past Continuous","note":"⚡ Clave · \"It rained.\" (empezó y acabó) vs \"It was raining.\" (estaba lloviendo)"},{"es":"\"Used to\" describe algo que HACÍAS REGULARMENTE pero ya no","en":"Hábitos pasados que ya no existen","note":"Uso · \"I used to play tennis.\" (ya no juego) / \"She used to live in Paris.\""},{"es":"También para situaciones pasadas que ya cambiaron","en":"Estados pasados permanentes","note":"Uso · \"He used to be thin.\" / \"This used to be a cinema.\" / \"I used to have long hair.\""},{"es":"Sujeto + used to + verbo en infinitivo (sin -to)","en":"used to + verbo base","note":"Forma · \"I used to smoke.\" / \"She used to walk to school.\" / \"We used to be friends.\""},{"es":"Pregunta: Did + sujeto + use to (sin -d)","en":"Did + sujeto + use to + verbo?","note":"Pregunta · \"Did you use to play sports?\" / \"Did she use to live here?\""},{"es":"\"used to\" = hábito repetido / past simple = acción puntual","en":"used to vs past simple","note":"vs. · \"I used to go every day.\" (hábito) vs \"I went yesterday.\" (una vez)"},{"es":"\"Used to\" no tiene forma en presente. Para hábitos presentes → present simple","en":"Solo existe en PASADO","note":"Nota · \"I used to walk to school.\" → Ahora: \"I walk to school.\" (present simple)"},{"es":"Si la acción AÚN continúa, NO uses \"used to\"","en":"used to → hábito terminado","note":"⚡ Clave · \"I used to live in Madrid.\" (ya no vivo ahí) ✅ / \"I used to live here.\" (si aún vives ahí) ❌"},{"es":"Preguntas: invertir auxiliar","en":"Will + sujeto? / Be + sujeto + going to?","note":"Pregunta · \"Will you help me?\" / \"Are you going to study?\""},{"es":"Pregunta: Will + sujeto + be + -ing?","en":"Will + sujeto + be + -ing?","note":"Pregunta · \"Will you be working tomorrow?\" / \"Will she be using the car?\""},{"es":"Preguntar por planes sin presionar (más cortés que \"will you?\")","en":"Preguntas educadas sobre planes","note":"Uso · \"Will you be using the car tonight?\" (más cortés que \"Will you use the car?\")"},{"es":"Dormitorio / baño / cocina — las habitaciones básicas","en":"bedroom / bathroom / kitchen","note":"Habitación · \"The bedroom is upstairs.\" / \"The kitchen is very spacious.\""},{"es":"Sala de estar / comedor","en":"living room / dining room","note":"Habitación · \"We watch TV in the living room.\" / \"We eat in the dining room.\""},{"es":"Garaje / ático (desván) / sótano","en":"garage / attic / basement","note":"Habitación · \"The car is in the garage.\" / \"Old boxes are in the attic.\""},{"es":"Sofá / sillón / estantería","en":"sofa / armchair / bookshelf","note":"Mueble · \"Sit on the sofa.\" / \"The bookshelf is full of novels.\""},{"es":"Armario function cleanJSON(text) {
  let t=(text||"").replace(/```json|```/g,"").trim();
  const o=t.indexOf("{"); const a=t.indexOf("[");
  if(a!==-1&&(a<o||o===-1)) return t.slice(a,t.lastIndexOf("]")+1);
  if(o!==-1) return t.slice(o,t.lastIndexOf("}")+1);
  return t;
}
async function callGemini(key,sys,prompt) {

  let lastErr=null;
  for(const model of models){
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.9}})});
    const data=await res.json();
    if(data.error){
      const msg=data.error.message||"";
      if(res.status===404||/not found|not supported|deprecated/i.test(msg)){lastErr=new Error(msg);continue;}
      const e=new Error(msg); e.code="API";
      if(/api key not valid|API_KEY_INVALID|invalid api key/i.test(msg)||[400,401,403].includes(res.status)){e.code="BAD_KEY";e.userMsg="Clave de Gemini inválida. Asegúrate de copiarla desde el botón 'Create API key' en aistudio.google.com/apikey";}

// ---------- Stats de desempeño por módulo y nivel (para recomendación de nivel) ----------
// Guarda los últimos N resultados (acierto/error) por módulo+nivel, para poder calcular
// un % de desempeño reciente. Solo se registran señales de PRODUCCIÓN/COMPRENSIÓN evaluada
// por IA o por respuesta correcta — no "haber visto" una tarjeta, que no dice nada del dominio real.
function loadPerfStats(){try{return JSON.parse(localStorage.getItem("fluido-perf-stats")||"null")||{};}catch(e){return{};}}
function savePerfStats(s){try{localStorage.setItem("fluido-perf-stats",JSON.stringify(s));}catch(e){}}
function recordPerf(module, level, isRight){
  const stats = loadPerfStats();
  const key = module+":"+level;
  const arr = stats[key] || [];
  arr.push(isRight?1:0);
  stats[key] = arr.slice(-30); // últimos 30 resultados por módulo+nivel
  savePerfStats(stats);
}
function perfAccuracy(module, level){
  const arr = (loadPerfStats()[module+":"+level]) || [];
  if(arr.length < 5) return null; // no hay suficiente data todavía
  return Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*100);
}
function recordQuizAnswer(level, isRight){ recordPerf("quiz", level, isRight); }
function quizAccuracy(level){ return perfAccuracy("quiz", level); }

// ---------- Señal de recomendación de nivel ----------
// Combina desempeño real (evaluado por IA o respuesta correcta, no "haber visto") en:
// Escuchar (comprensión), Conversar (producción oral corregida), Escribir (producción escrita
// corregida) y Quiz de gramática. Devuelve una recomendación honesta: subir, bajar, o mantener.
function getLevelSignal(state){
  const listenPct = perfAccuracy("listen", state.level);
  const talkPct   = perfAccuracy("talk",   state.level);
  const writePct  = perfAccuracy("write",  state.level);
  const quizPct   = perfAccuracy("quiz",   state.level);

  const signals = [listenPct, talkPct, writePct, quizPct].filter(p=>p!==null);
  const hasEnoughData = signals.length>=1;
  const avg = hasEnoughData ? Math.round(signals.reduce((a,b)=>a+b,0)/signals.length) : null;

  const idx = LEVELS.findIndex(l=>l.id===state.level);
  const canGoUp = idx < LEVELS.length-1;
  const canGoDown = idx > 0;

  let recommendation = "wait"; // "up" | "down" | "stay" | "wait"
  if(hasEnoughData){
    if(avg>=82 && canGoUp) recommendation = "up";
    else if(avg<40 && canGoDown) recommendation = "down";
    else recommendation = "stay";
  }

  return { listenPct, talkPct, writePct, quizPct, avg, recommendation, hasEnoughData };
}


// ---------- SRS (SM-2 ligero) ----------
// Cada tarjeta lleva {interval, ease}. "again" castiga el ease, "easy" lo premia.
function srsNext(prev,g){
  const ease=prev.ease||2.5, interval=prev.interval||0;
  if(g==="again") return {interval:0, ease:Math.max(1.3,+(ease-0.2).toFixed(2)), due:Date.now()+10*60*1000};
  if(g==="easy"){ const ni=Math.max(3,Math.round(Math.max(1,interval)*ease*1.5)); return {interval:ni, ease:Math.min(3,+(ease+0.1).toFixed(2)), due:Date.now()+ni*86400000}; }
  const ni=interval?Math.max(1,Math.round(interval*ease)):1;
  return {interval:ni, ease, due:Date.now()+ni*86400000};
}
function srsPreview(prev,g){
  if(g==="again") return "en 10 min";
  const ease=prev.ease||2.5, interval=prev.interval||0;
  if(g==="easy") return `en ${Math.max(3,Math.round(Math.max(1,interval)*ease*1.5))}d`;
  return `en ${interval?Math.max(1,Math.round(interval*ease)):1}d`;
}

function rankVoice(v){
  const n=(v.name||"").toLowerCase(), l=(v.lang||"").toLowerCase();
  let s=0;
  if(l.startsWith("en-us")) s+=40; else if(l.startsWith("en-gb")) s+=30; else if(l.startsWith("en")) s+=10;
  if(n.includes("google")) s+=25;
  if(n.includes("natural")||n.includes("neural")||n.includes("premium")||n.includes("enhanced")) s+=20;
  if(v.localService===false) s+=5;
  return s;
}

function useSpeech(){
  const [voices,setVoices]=useState([]);
  const supported=typeof window!=="undefined"&&"speechSynthesis" in window;
  const [failed,setFailed]=useState(!supported);
  useEffect(()=>{
    if(!supported) return;
    const load=()=>{const v=window.speechSynthesis.getVoices().filter(v=>v.lang?.toLowerCase().startsWith("en"));if(v.length)setVoices(v);};
    load(); window.speechSynthesis.onvoiceschanged=load;
    const t1=setTimeout(load,500); const t2=setTimeout(load,2000);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[supported]);
  const speak=useCallback((lines,opts)=>{
    const{rate=0.9,onEnd,onLine}=opts||{};
    if(!supported){setFailed(true);onEnd&&onEnd();return;}
    const synth=window.speechSynthesis;
    try{
      synth.cancel(); synth.resume();
      const arr=Array.isArray(lines)?lines:[{line:lines}];
      arr.forEach((d,i)=>{
        const u=new SpeechSynthesisUtterance(d.line||d); u.lang="en-US"; u.rate=rate; u.pitch=1;
        if(voices.length){
          const savedName=getSavedVoiceName();
          const chosen=(savedName!=="auto"&&voices.find(x=>x.name===savedName))||[...voices].sort((a,b)=>rankVoice(b)-rankVoice(a))[0];
          if(chosen){u.voice=chosen;u.lang=chosen.lang||"en-US";}
        }
        u.onstart=()=>onLine&&onLine(i);
        if(i===arr.length-1&&onEnd) u.onend=onEnd;
        synth.speak(u);
      });
      setTimeout(()=>{if(!synth.speaking&&!synth.pending){setFailed(true);onEnd&&onEnd();}else setFailed(false);},1200);
    }catch(e){setFailed(true);onEnd&&onEnd();}
  },[supported,voices]);
  const stop=useCallback(()=>{try{window.speechSynthesis.cancel();}catch(e){};},[]);
  return{speak,stop,failed,supported,voices};
}
function useIsDesktop(){

}

    setThemeVer(v=>v+1);
  },[]);

  // 🔔 Recordatorio diario — funciona con la app/PWA abierta (aunque sea en segundo plano)
  useEffect(()=>{
    const check=()=>{
      try{
        const r=JSON.parse(localStorage.getItem("fluido-reminder")||"null");
        if(!r||!r.enabled||!("Notification" in window)||Notification.permission!=="granted") return;
        const today=todayStr();
        if(localStorage.getItem("fluido-reminder-last")===today) return;
        const [h,m]=(r.time||"20:00").split(":").map(Number);
        const now=new Date();
        if(now.getHours()>h||(now.getHours()===h&&now.getMinutes()>=m)){
          new Notification("Fluido 🇬🇧",{body:"Tus 15 minutos de inglés te esperan. ¡No pierdas la racha! 🔥",icon:"./icon-192.png"});
          localStorage.setItem("fluido-reminder-last",today);
        }
      }catch(e){}
    };
    check(); const id=setInterval(check,60000);
    return()=>clearInterval(id);
  },[]);

  const registerActivity=useCallback((block,extra)=>{
    setState(prev=>{
      const next={...prev,...(extra||{})};
      const today=todayStr();
      next.daily=next.daily.date!==today?{date:today,talk:0,phrases:0,listen:0,grammar:0,write:0}:{...next.daily};
      next.daily[block]+=1;
      next.totals={...next.totals,[block]:(next.totals[block]||0)+1};
      // Historial diario (para estadísticas) — se conservan los últimos 90 días
      next.history={...(next.history||{})};
      next.history[today]=(next.history[today]||0)+1;
      const hk=Object.keys(next.history).sort();
      if(hk.length>90) hk.slice(0,hk.length-90).forEach(k=>delete next.history[k]);
      if(next.lastActive!==today){
        if(next.lastActive===yesterdayStr()){ next.streak=next.streak+1; }
        else if(next.lastActive===daysAgoStr(2)&&next.streak>=3&&(!next.lastFreeze||Date.now()-new Date(next.lastFreeze+"T00:00:00").getTime()>6.5*86400000)){
          // 🧊 Protector de racha: perdona 1 día perdido (máx. 1 vez por semana, racha ≥3)
          next.streak=next.streak+1; next.lastFreeze=today; next.freezeNotice=today;
        } else { next.streak=1; }
        next.lastActive=today;
      }
      persist(next); return next;
    });
  },[]);

  if(!aiReady) return <Shell><Setup onDone={handleAIChanged}/></Shell>;
  if(!state.profile) return <Shell><Onboarding onDone={profile=>save({...state,profile,level:profile.level})}/></Shell>;

  return(
    <div style={{minHeight:"100vh",background:C.paper,fontFamily:FUI,color:C.ink,display:"flex"}}>
      {desktop&&<SideNav tab={tab} setTab={setTab} name={state.profile.name} level={state.level}/>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{width:"100%",maxWidth:desktop?780:560,margin:"0 auto",padding:desktop?"36px 32px 60px":"20px 16px 96px"}}>
        {tab==="home"     && <Home     state={state} save={save} go={setTab}/>}
        {tab==="talk"     && <Talk     state={state} registerActivity={registerActivity}/>}
        {(tab==="phrases"||tab==="grammar") && <Phrases key={tab} initialMode={tab==="grammar"?"grammar":(tab==="phrases"&&(state.level==="A0"||state.level==="A2")?"vocab":"cards")} state={state} save={save} registerActivity={registerActivity}/>}
        {tab==="listen"   && <ListenHub state={state} save={save} registerActivity={registerActivity}/>}
        {tab==="write"    && <Write    state={state} registerActivity={registerActivity}/>}
        {tab==="levelcheck" && <LevelCheck state={state} save={save} go={setTab}/>}
        {tab==="settings" && <Settings state={state} save={save} onAIChanged={handleAIChanged} onThemeChange={handleThemeChange}/>}
        </div>
      </div>
      {!desktop&&<TabBar tab={tab} setTab={setTab} level={state.level}/>}
    </div>
  );
}
function Shell({children}){
  return <div style={{minHeight:"100vh",background:C.paper,fontFamily:FUI,color:C.ink}}><div style={{width:"100%",maxWidth:560,margin:"0 auto",padding:"24px 16px 110px"}}>{children}</div></div>;

function Setup({onDone}){
  const [intro,setIntro]=useState(0); // 0: bienvenida · 1: cómo funciona la IA · 2: conectar clave
  const [selected,setSelected]=useState(null);
  const [key,setKey]=useState("");
  const [testing,setTesting]=useState(false);
  const [error,setError]=useState(null);
  const prov=PROVIDERS.find(p=>p.id===selected);
  const handleConnect=async()=>{
    if(!key.trim()||!selected) return;
    setTesting(true);setError(null);
    try{
      await pingProvider(selected,key.trim());
      const cfg=getAIConfig()||{active:null,keys:{}};
      setAIConfig({active:selected,keys:{...(cfg.keys||{}),[selected]:key.trim()}});
      onDone();
    }catch(e){setError(e.userMsg||"No pude conectar. Revisa tu clave e intenta de nuevo.");}

  };

    <div style={{display:"flex",gap:6,justifyContent:"center",margin:"18px 0 0"}}>
      {[0,1,2].map(i=><span key={i} style={{width:8,height:8,borderRadius:99,background:i===intro?C.blue:C.line}}/>)}

        {[["🎧","Escucha diálogos e historias interactivas a tu nivel exacto"],
          ["🎤","Practica pronunciación: la app te escucha y te puntúa palabra por palabra"],
          ["💬","Conversa por texto o voz con corrección instantánea"],
          ["🧠","Repaso inteligente de frases, verbos y +2.900 palabras para no olvidar"]].map(([e,t],i)=>(
          <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start",background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"12px 14px"}}>
            <span style={{fontSize:22}}>{e}</span><span style={{fontSize:14,lineHeight:1.5}}>{t}</span>

          </div>
          <input type="password" value={key} onChange={e=>{setKey(e.target.value);setError(null);}}
            placeholder={prov.keyPlaceholder}
            style={{width:"100%",padding:"14px 16px",fontSize:15,borderRadius:12,border:`1.5px solid ${error?C.coral:C.line}`,outline:"none",background:C.card,color:C.ink,marginBottom:8}}/>
          {error&&<p style={{color:C.coral,fontSize:13,marginBottom:8}}>❌ {error}</p>}
          <BigButton onClick={handleConnect} disabled={!key.trim()||testing}>{testing?"Probando conexión…":"Conectar y continuar →"}</BigButton>

function Onboarding({onDone}){
  const [step,setStep]=useState(0);
  const [name,setName]=useState("");
  const [role,setRole]=useState("");
  const [goals,setGoals]=useState([]);
  const [interests,setInterests]=useState([]);
  const [level,setLevel]=useState(null);
  const [wantExtra,setWantExtra]=useState(null); // null=sin decidir, true, false
  // Campos extra
  const [nickname,setNickname]=useState("");
  const [gender,setGender]=useState("");
  const [age,setAge]=useState("");
  const [livingWith,setLivingWith]=useState("");
  const [hobbies,setHobbies]=useState("");
  const [reason,setReason]=useState("");

  const toggle=(list,setList,item)=>setList(list.includes(item)?list.filter(x=>x!==item):[...list,item]);
  const iStyle={width:"100%",marginTop:8,padding:"14px 16px",fontSize:16,borderRadius:14,border:`1.5px solid ${C.line}`,background:C.card,color:C.ink,outline:"none"};
  const taStyle={...iStyle,resize:"vertical",minHeight:80};

  const buildProfile=()=>{
    const extra=wantExtra?{nickname:nickname.trim()||null,gender:gender||null,age:age?parseInt(age):null,livingWith:livingWith||null,hobbies:hobbies.trim()||null,reason:reason.trim()||null}:null;
    return{name:name.trim(),role:role.trim(),goals,interests,level,extra};
  };

  const steps=[
    {title:"¡Hola! 👋",sub:"Soy Fluido. Quiero conocerte para que cada ejercicio sea sobre TU mundo.",
     content:<div><label style={{fontSize:14,color:C.inkSoft}}>¿Cómo te llamas?</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Tu nombre" style={iStyle}/></div>,valid:name.trim().length>0},
    {title:`Un gusto, ${name.trim()} ✨`,sub:"Esto me ayuda a crear situaciones realistas.",
     content:<div><label style={{fontSize:14,color:C.inkSoft}}>¿A qué te dedicas? (trabajo o estudio)</label><input value={role} onChange={e=>setRole(e.target.value)} placeholder="Ej: consultor de software, estudiante, diseñadora…" style={iStyle}/></div>,valid:role.trim().length>1},
    {title:"¿Para qué necesitas el inglés?",sub:"Elige todo lo que aplique — enfocará tus ejercicios.",
     content:<ChipGrid options={GOAL_OPTIONS} selected={goals} onToggle={o=>toggle(goals,setGoals,o)}/>,valid:goals.length>0},
    {title:"¿Qué temas te gustan?",sub:"Los usaré en los diálogos para que sea entretenido.",
     content:<ChipGrid options={INTEREST_OPTIONS} selected={interests} onToggle={o=>toggle(interests,setInterests,o)}/>,valid:interests.length>0},
    {title:"Tu nivel actual",sub:"Sé honesto — siempre puedes cambiarlo después.",
     content:<div style={{display:"flex",flexDirection:"column",gap:8}}>{LEVELS.map(lv=>(
       <button key={lv.id} onClick={()=>setLevel(lv.id)}
         style={{padding:"14px 16px",borderRadius:14,textAlign:"left",border:`2px solid ${level===lv.id?C.blue:C.line}`,background:level===lv.id?C.blueSoft:C.card}}>
         <strong style={{color:level===lv.id?C.blue:C.ink}}>{lv.label}</strong>
         <div style={{fontSize:13,color:C.inkSoft,marginTop:2}}>{lv.desc}</div>
       </button>))}</div>,valid:!!level},
    // Paso 6: ¿quieres datos extra?
    {title:"¿Quieres escenarios ultra-personalizados? 🎯",sub:"Con un poco más de info, la IA puede crear situaciones que realmente sientan tuyas. Completamente opcional.",
     content:(
       wantExtra!==true?(
         <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:4}}>
           <button onClick={()=>setWantExtra(true)} style={{padding:"14px 16px",borderRadius:14,border:`2px solid ${C.blue}`,background:C.blueSoft,color:C.blue,fontWeight:600,fontSize:15}}>
             ✨ Sí, agregar información extra
           </button>
           <button onClick={()=>onDone(buildProfile())} style={{padding:"14px 16px",borderRadius:14,border:`1.5px solid ${C.line}`,background:"transparent",color:C.inkSoft,fontWeight:500,fontSize:14}}>
             No por ahora, ¡empezar a entrenar! →
           </button>
         </div>
       ):(
         <div style={{display:"flex",flexDirection:"column",gap:12}} className="fadein">
           <div>
             <label style={{fontSize:13,color:C.inkSoft}}>¿Cómo prefieren llamarte? (apodo, pronombres…)</label>
             <input value={nickname} onChange={e=>setNickname(e.target.value)} placeholder="Opcional" style={iStyle}/>
           </div>
           <div>
             <label style={{fontSize:13,color:C.inkSoft}}>Género</label>
             <ChipGrid options={GENDER_OPTIONS} selected={gender?[gender]:[]} onToggle={o=>setGender(gender===o?"":o)}/>
           </div>
           <div>
             <label style={{fontSize:13,color:C.inkSoft}}>Edad</label>
             <input type="number" value={age} onChange={e=>setAge(e.target.value)} placeholder="Opcional" min="10" max="99" style={{...iStyle,width:"120px"}}/>
           </div>
           <div>
             <label style={{fontSize:13,color:C.inkSoft}}>¿Con quién vives?</label>
             <div style={{marginTop:8}}><ChipGrid options={LIVING_OPTIONS} selected={livingWith?[livingWith]:[]} onToggle={o=>setLivingWith(livingWith===o?"":o)}/></div>
           </div>
           <div>
             <label style={{fontSize:13,color:C.inkSoft}}>¿Qué te gusta hacer en tu tiempo libre?</label>
             <textarea value={hobbies} onChange={e=>setHobbies(e.target.value)} placeholder="Ej: toco guitarra, juego fútbol, cocino, hago hiking…" style={taStyle}/>
           </div>
           <div>
             <label style={{fontSize:13,color:C.inkSoft}}>¿Por qué quieres aprender inglés? (tu historia)</label>
             <textarea value={reason} onChange={e=>setReason(e.target.value)} placeholder="Ej: quiero conseguir trabajo remoto con clientes internacionales…" style={taStyle}/>
           </div>
           <button onClick={()=>setWantExtra(null)} style={{fontSize:12,color:C.inkSoft,background:"transparent",border:"none",textDecoration:"underline",textAlign:"left"}}>← Cambiar de opción</button>
         </div>
       )
     ),valid:wantExtra!==null},
  ];

  const s=steps[step]; const last=step===steps.length-1;
  return(
    <div className="fadein" key={step}>
      <div style={{display:"flex",gap:4,marginBottom:24}}>
        {steps.map((_,i)=><div key={i} style={{flex:1,height:4,borderRadius:2,background:i<=step?C.blue:C.line}}/>)}
      </div>
      <h1 style={{fontSize:28,fontWeight:700,marginBottom:6}}>{s.title}</h1>
      <p style={{fontSize:15,color:C.inkSoft,marginBottom:20,lineHeight:1.5}}>{s.sub}</p>
      {s.content}
      <div style={{display:"flex",gap:10,marginTop:28}}>
        {step>0&&<button onClick={()=>setStep(step-1)} style={{padding:"14px 18px",borderRadius:14,border:`1.5px solid ${C.line}`,background:C.card,color:C.inkSoft,fontWeight:600}}>Atrás</button>}
        {(last?wantExtra===true:s.valid)&&(
          <button onClick={()=>{if(!s.valid)return;if(last)onDone(buildProfile());else setStep(step+1);}} disabled={!s.valid}
            style={{flex:1,padding:"14px 18px",borderRadius:14,border:"none",background:C.blue,color:"#fff",fontWeight:600,fontSize:16,opacity:s.valid?1:0.4}}>
            {last?"¡Empezar a entrenar!":"Siguiente"}
          </button>
        )}
      </div>
    </div>
  );
}
function ChipGrid({options,selected,onToggle}){
  return(
    <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
      {options.map(o=>{const on=selected.includes(o);return(
        <button key={o} onClick={()=>onToggle(o)} style={{padding:"10px 14px",borderRadius:999,fontSize:14,fontWeight:500,border:`1.5px solid ${on?C.blue:C.line}`,background:on?C.blueSoft:C.card,color:on?C.blue:C.ink}}>
          {on?"✓ ":""}{o}
        </button>);})}
    </div>
  );
}

const LEVEL_GUIDE = {
  A0: "NIVEL A0 (principiante absoluto): vocabulario de las 500 palabras más comunes. Frases de 3-7 palabras. SOLO presente simple. Sin modismos, sin phrasal verbs, sin subordinadas. Como hablarle a alguien en su primera semana de inglés.",
  A2: "NIVEL A2 (básico): vocabulario cotidiano de ~1000 palabras. Frases de 6-12 palabras. Presente, pasado simple y futuro con 'going to'. Phrasal verbs muy comunes (get up, look for). Sin jerga ni estructuras complejas. Como un libro de texto de inglés básico.",
  B1: "NIVEL B1 (intermedio): vocabulario de ~2500 palabras incluyendo términos de trabajo. Frases de 10-18 palabras con subordinadas. Todos los tiempos verbales comunes, condicionales tipo 1, voz pasiva simple. Algunos phrasal verbs y expresiones idiomáticas frecuentes. Como una conversación laboral normal entre colegas.",
  B2: "NIVEL B2 (avanzado): vocabulario rico y preciso (~4000+ palabras), registro profesional. Frases largas y complejas con múltiples cláusulas. Todos los tiempos, condicionales mixtos, voz pasiva, modales de probabilidad. Modismos, phrasal verbs avanzados, matices y sarcasmo sutil. Como un nativo profesional en una reunión exigente o entrevista senior.",
  C1: "NIVEL C1 (competente): vocabulario muy amplio y especializado, incluyendo colocaciones naturales y lenguaje técnico de su industria. Estructuras sofisticadas, inversiones, cleft sentences, conectores formales. Registro flexible según contexto (formal/informal). Humor, ironía y referencias culturales. Como un profesional bilingüe avanzado que negocia, presenta y lidera en inglés sin esfuerzo aparente.",
  C2: "NIVEL C2 (dominio/casi nativo): control total del idioma. Vocabulario preciso, idiomático y matizado, incluyendo expresiones poco frecuentes, juegos de palabras y connotaciones sutiles. Cualquier estructura gramatical, por compleja que sea. Estilo natural indistinguible de un nativo culto. Maneja ambigüedad, dobles sentidos, registro literario y argot según convenga. Como un nativo educado en cualquier situación, desde debate académico hasta charla casual con jerga regional."
};
function levelInstruction(state){ return LEVEL_GUIDE[state.level] || LEVEL_GUIDE.B1; }
function profileForPrompts(state,withName){
  const p=state.profile||{};
  let s=`${withName&&p.name?`Nombre: ${p.name}. `:""}Ocupación: ${p.role||"profesional"}. Objetivos: ${(p.goals||[]).join(", ")}. Intereses: ${(p.interests||[]).join(", ")}. ${levelInstruction(state)}`;
  if(p.extra){
    const e=p.extra;
    if(e.nickname) s+=` Le gusta que le llamen "${e.nickname}".`;
    if(e.gender)   s+=` Género: ${e.gender}.`;
    if(e.age)      s+=` Edad: ${e.age} años.`;
    if(e.livingWith) s+=` Vive con: ${e.livingWith}.`;
    if(e.hobbies)  s+=` Le gusta: ${e.hobbies}.`;
    if(e.reason)   s+=` Razón para aprender inglés: ${e.reason}.`;
  }
  return s;
}

  return(
    <aside style={{width:230,flexShrink:0,position:"sticky",top:0,height:"100vh",borderRight:`1px solid ${C.line}`,background:C.card,padding:"28px 14px 20px",display:"flex",flexDirection:"column"}}>

// ⚡ Sesión de repaso mixta: frases + verbos + vocab vencidos en un solo flujo
function MixedReview({state,save,onClose}){
  const buildQueue=()=>{
    const now=Date.now();const items=[];
    state.deck.filter(c=>c.due<=now).sort(()=>Math.random()-0.5).slice(0,10)
      .forEach(c=>items.push({type:"phrase",icon:"📚",front:c.es,back:c.en,note:c.note,id:c.id}));
    try{
      const vs=getVerbSRS();const bank=loadBank();
      (bank.verbs||[]).filter(v=>{const d=vs[verbKey(v)];return d&&d.due<=now;}).sort(()=>Math.random()-0.5).slice(0,5)
        .forEach(v=>items.push({type:"verb",icon:"🔤",front:v.es,back:v.en,id:verbKey(v)}));
    }catch(e){}
    try{
      const ws=vocabLoadSrs();const due=[];
      BANK_WORDS.forEach(b=>b.words.forEach(w=>{const d=ws[w.en.toLowerCase()];if(d&&d.due<=now)due.push(w);}));
      due.sort(()=>Math.random()-0.5).slice(0,10)
        .forEach(w=>items.push({type:"vocab",icon:"🔠",front:w.es,back:w.en,id:w.en.toLowerCase()}));
    }catch(e){}
    return items.sort(()=>Math.random()-0.5).slice(0,20);
  };
  const [queue,setQueue]=useState(buildQueue);
  const [noMore,setNoMore]=useState(false);
  const [idx,setIdx]=useState(0);
  const [flipped,setFlipped]=useState(false);
  const [counts,setCounts]=useState({good:0,again:0});
  const [silent,setSilent]=useState(isSilent());
  const {speak,stop}=useSpeech();
  const card=queue[idx];
  // ── Ejercicios sin audio (modo silencio): selección múltiple y ordenar palabras ──
  const [answered,setAnswered]=useState(null); // {correct:boolean}
  const [built,setBuilt]=useState([]);         // índices de palabras elegidas (ordenar)
  const toggleSilent=()=>{const v=!silent;setSilent(v);saveSilent(v);setAnswered(null);setBuilt([]);};
  const anotherRound=()=>{
    const q=buildQueue();
    if(!q.length){setNoMore(true);return;}
    setQueue(q);setIdx(0);setCounts({good:0,again:0});setAnswered(null);setBuilt([]);setFlipped(false);setNoMore(false);
  };
  const normAns=(t)=>(t||"").toLowerCase().replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
  const words=card?card.back.replace(/[.!?]+$/,"").split(" ").filter(Boolean):[];
  const useOrder=silent&&card&&card.type==="phrase"&&words.length>=3&&words.length<=10&&idx%2===1;
  const choiceOptions=React.useMemo(()=>{
    if(!card) return [];
    const target=normAns(card.back);
    const tlen=words.length;
    // Distractores de la MISMA especie: palabra↔palabras, verbo↔verbos, frase↔frases
    let cands=[];
    if(card.type==="vocab"){
      cands=BANK_WORDS.flatMap(b=>b.words.map(w=>w.en));
    } else if(card.type==="verb"){
      try{cands=(loadBank().verbs||[]).map(v=>v.en);}catch(e){}
    } else {
      cands=[...queue.filter(q=>q.type==="phrase").map(q=>q.back),...state.deck.map(c=>c.en)];
    }
    let pool=[...new Set(cands)].filter(x=>x&&normAns(x)!==target);
    // …y de largo similar en palabras, para que la forma no delate la respuesta
    const similar=pool.filter(x=>Math.abs(x.split(" ").length-tlen)<=Math.max(1,Math.round(tlen*0.4)));
    const src=similar.length>=2?similar:pool;
    const distract=[...src].sort(()=>Math.random()-0.5).slice(0,2);
    return [...distract,card.back].sort(()=>Math.random()-0.5);
  },[idx,queue]);
  const answerChoice=(opt)=>{ if(answered) return; setAnswered({correct:normAns(opt)===normAns(card.back),picked:opt}); };
  // Orden barajado real de los chips (evitando que quede igual al original)
  const shuffleOrder=useMemo(()=>{
    const idxs=words.map((_,i)=>i);
    for(let i=idxs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idxs[i],idxs[j]]=[idxs[j],idxs[i]];}
    if(idxs.length>2&&idxs.every((v,i)=>v===i)){[idxs[0],idxs[1]]=[idxs[1],idxs[0]];}
    return idxs;
  },[idx]);
  const tapWord=(i)=>{ if(answered||built.includes(i)) return; setBuilt(b=>[...b,i]); };
  const removeBuilt=(pos)=>{ if(answered) return; setBuilt(b=>b.filter((_,p)=>p!==pos)); };
  const checkOrder=()=>{
    const guess=built.map(x=>words[x]).join(" ");
    setAnswered({correct:normAns(guess)===normAns(card.back),picked:guess});
  };
  const grade=(g)=>{
    if(!card)return;
    if(card.type==="phrase"){
      const deck=state.deck.map(c=>c.id===card.id?{...c,...srsNext(c,g),seen:(c.seen||0)+1}:c);
      save({...state,deck});
    }else if(card.type==="verb"){
      const s=getVerbSRS();const prev=s[card.id]||{interval:0,seen:0};
      s[card.id]={...srsNext(prev,g),seen:(prev.seen||0)+1};setVerbSRS(s);
    }else{
      const s=vocabLoadSrs();const prev=s[card.id]||{interval:0,seen:0};
      s[card.id]={...srsNext(prev,g),seen:(prev.seen||0)+1};vocabSaveSrs(s);
    }
    setCounts(c=>({...c,[g==="again"?"again":"good"]:c[g==="again"?"again":"good"]+1}));
    setFlipped(false);setAnswered(null);setBuilt([]);setIdx(i=>i+1);
  };
  return(
    <div style={{position:"fixed",inset:0,zIndex:200,background:C.paper,padding:"18px 16px",overflowY:"auto"}}>
      <div style={{maxWidth:560,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontWeight:800,fontSize:18}}>⚡ Repaso del día</span>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <button onClick={()=>{toggleSilent();if(!silent)stop();}} aria-label={silent?"Activar audio":"Modo silencio: repasa sin audio automático"}
              style={{border:`1.5px solid ${silent?C.coral:C.line}`,background:silent?C.coralSoft:"transparent",color:silent?C.coral:C.inkSoft,fontSize:13,fontWeight:700,padding:"6px 11px",borderRadius:999}}>
              {silent?"🔇 Silencio":"🔊"}
            </button>
            <button onClick={onClose} style={{border:"none",background:"transparent",color:C.inkSoft,fontSize:22,padding:4}} aria-label="Cerrar">✕</button>
          </div>
        </div>
        <div style={{height:6,background:C.card,borderRadius:999,marginBottom:16,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${queue.length?Math.round(idx/queue.length*100):100}%`,background:C.green,borderRadius:999,transition:"width .3s"}}/>
        </div>
        {card?(
          <div className="fadein" style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:18,padding:24,minHeight:220,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
            <div style={{textAlign:"center"}}>
              <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5}}>{card.icon} {card.type==="phrase"?"Frase":card.type==="verb"?"Verbo":"Palabra"} · {idx+1}/{queue.length}{silent&&<span> · 🔇</span>}</p>
              <p style={{fontSize:24,fontWeight:700,margin:"16px 0 6px",color:C.ink}}>{card.front}</p>
              {!silent&&flipped&&(
                <p className="fadein" style={{fontSize:26,fontFamily:"'Newsreader',Georgia,serif",margin:"6px 0"}}>
                  <span className="hl">{card.back}</span>
                  <button onClick={()=>speak(card.back)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:20,marginLeft:8}}>🔊</button>
                </p>
              )}
              {!silent&&flipped&&card.note&&<p style={{fontSize:13,color:C.inkSoft,margin:"6px 0 0"}}>{card.note}</p>}
            </div>

            {/* ── MODO SILENCIO: ejercicios autocorregidos ── */}
            {silent&&!answered&&useOrder&&(
              <div className="fadein">
                <p style={{fontSize:13,color:C.inkSoft,textAlign:"center",margin:"0 0 8px"}}>Toca las palabras para armar la frase — toca una en la frase para quitarla:</p>
                <div style={{textAlign:"center",margin:"0 0 12px"}}>
                  <button onClick={()=>speak(card.back)}
                    style={{padding:"7px 13px",borderRadius:999,border:`1.5px solid ${C.line}`,background:C.card,color:C.inkSoft,fontSize:12.5,fontWeight:700}}>🔊 Escuchar la frase</button>
                </div>
                <div style={{minHeight:44,background:C.paper,borderRadius:12,padding:"8px 10px",marginBottom:10,textAlign:"center",display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center",alignItems:"center"}}>
                  {built.length?built.map((x,p)=>(
                    <button key={p} onClick={()=>removeBuilt(p)} aria-label={`Quitar ${words[x]}`}
                      style={{border:`1px dashed ${C.line}`,background:C.card,borderRadius:8,padding:"4px 8px",fontFamily:FEN,fontSize:16,color:C.ink}}>
                      {words[x]}
                    </button>
                  )):<span style={{color:C.inkSoft,fontSize:13}}>…</span>}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}}>
                  {shuffleOrder.map(i=>(
                    <button key={i} onClick={()=>tapWord(i)} disabled={built.includes(i)}
                      style={{padding:"9px 14px",borderRadius:999,border:`1.5px solid ${C.line}`,background:built.includes(i)?C.paper:C.card,color:built.includes(i)?C.inkSoft:C.ink,fontSize:14,fontWeight:600,opacity:built.includes(i)?0.35:1,fontFamily:FEN}}>
                      {words[i]}
                    </button>
                  ))}
                </div>
                {built.length===words.length&&(
                  <div className="fadein" style={{marginTop:12}}>
                    <BigButton onClick={checkOrder}>Comprobar</BigButton>
                  </div>
                )}
                <p style={{textAlign:"center",margin:"12px 0 0"}}>
                  <button onClick={()=>setAnswered({correct:false,skipped:true})}
                    style={{border:"none",background:"transparent",color:C.inkSoft,fontSize:12.5,fontWeight:600,textDecoration:"underline dotted"}}>🤷 No lo sé — mostrar respuesta</button>
                </p>
              </div>
            )}
            {silent&&!answered&&!useOrder&&(
              <div className="fadein">
                <p style={{fontSize:13,color:C.inkSoft,textAlign:"center",margin:"0 0 8px"}}>¿Cuál es la traducción correcta?</p>
                <div style={{textAlign:"center",margin:"0 0 12px"}}>
                  <button onClick={()=>speak(card.back)}
                    style={{padding:"7px 13px",borderRadius:999,border:`1.5px solid ${C.line}`,background:C.card,color:C.inkSoft,fontSize:12.5,fontWeight:700}}>🔊 Escuchar la frase</button>
                </div>
                <div style={{display:"grid",gap:8}}>
                  {choiceOptions.map((opt,i)=>(
                    <button key={i} onClick={()=>answerChoice(opt)}
                      style={{padding:"13px 14px",borderRadius:14,border:`1.5px solid ${C.line}`,background:C.card,color:C.ink,fontSize:15,fontWeight:600,textAlign:"left",fontFamily:FEN}}>
                      {opt}
                    </button>
                  ))}
                </div>
                <p style={{textAlign:"center",margin:"12px 0 0"}}>
                  <button onClick={()=>setAnswered({correct:false,skipped:true})}
                    style={{border:"none",background:"transparent",color:C.inkSoft,fontSize:12.5,fontWeight:600,textDecoration:"underline dotted"}}>🤷 No lo sé — mostrar respuesta</button>
                </p>
              </div>
            )}
            {silent&&answered&&(
              <div className="fadein">
                <p style={{textAlign:"center",fontWeight:800,fontSize:16,color:answered.correct?C.green:answered.skipped?C.blue:C.coral,margin:"0 0 8px"}}>
                  {answered.correct?"✓ ¡Correcto!":answered.skipped?"👀 Apréndela para la próxima:":"✗ Casi…"}
                </p>
                {!answered.correct&&answered.picked&&(
                  <p style={{textAlign:"center",fontSize:15,fontFamily:FEN,margin:"0 0 6px"}}>
                    {(()=>{
                      const cw=normAns(card.back).split(" ");
                      return answered.picked.split(" ").filter(Boolean).map((w,i)=>{
                        const okPos=normAns(w)===cw[i];
                        return <span key={i} style={{color:okPos?C.green:C.coral,textDecoration:okPos?"none":"line-through",fontWeight:okPos?700:400,opacity:okPos?1:0.8,marginRight:5}}>{w}</span>;
                      });
                    })()}
                  </p>

// ⚡ Repaso del día — resume todo lo vencido en los tres sistemas SRS
function DailyReview({state,onStart}){
  const now=Date.now();
  const phrasesDue=state.deck.filter(c=>c.due<=now).length;
  let verbsDue=0,vocabDue=0;
  try{
    const vs=getVerbSRS(); const bank=loadBank();
    verbsDue=(bank.verbs||[]).filter(v=>{const d=vs[verbKey(v)];return d&&d.due<=now;}).length;
  }catch(e){}
  try{
    const ws=vocabLoadSrs();
    vocabDue=BANK_WORDS.reduce((a,b)=>a+b.words.filter(w=>{const d=ws[w.en.toLowerCase()];return d&&d.due<=now;}).length,0);
  }catch(e){}
  const total=phrasesDue+verbsDue+vocabDue;

  return(
    <button onClick={onStart} className="fadein elev"
      style={{width:"100%",marginTop:14,textAlign:"left",background:`linear-gradient(135deg, ${C.blue} 0%, ${C.blue}CC 100%)`,border:"none",borderRadius:22,padding:"18px 18px"}}>

function useSpeechRec(onText,onEnd){
  const Rec=typeof window!=="undefined"&&(window.SpeechRecognition||window.webkitSpeechRecognition);
  const supported=!!Rec;
  const [listening,setListening]=useState(false);
  const recRef=useRef(null);
  const endedRef=useRef(false);
  const start=()=>{
    if(!supported||listening) return;
    try{
      const r=new Rec();
      r.lang="en-US"; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
      let finalT="";
      endedRef.current=false;
      const finish=(err)=>{
        if(endedRef.current) return; endedRef.current=true;
        setListening(false);
        if(onEnd) onEnd(err||null);
      };
      r.onresult=(e)=>{
        let interim="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const t=e.results[i][0].transcript;
          if(e.results[i].isFinal) finalT+=t+" "; else interim+=t;
        }
        onText((finalT+interim).trim());
      };
      r.onend=()=>finish(null);
      r.onerror=(e)=>finish(e&&e.error||"error");
      recRef.current=r; setListening(true); r.start();
    }catch(e){ setListening(false); if(onEnd) onEnd("start-failed"); }
  };
  const stop=()=>{ try{recRef.current&&recRef.current.stop();}catch(e){} };
  return {supported,listening,start,stop};
}

function PronounceCheck({target}){
  const [heard,setHeard]=useState("");
  const [status,setStatus]=useState("idle"); // idle | listening | done | empty
  const heardRef=useRef("");
  const endGuard=useRef(0);
  const {supported,listening,start,stop}=useSpeechRec(
    t=>{heardRef.current=t;setHeard(t);},
    (err)=>{
      endGuard.current=Date.now();
      // pequeño margen: en Android el resultado final puede llegar justo después del onend
      setTimeout(()=>{
        setStatus(heardRef.current.trim()?"done":(err==="not-allowed"?"denied":"empty"));
      },180);
    }
  );
  if(!supported) return null;
  const begin=()=>{ heardRef.current="";setHeard("");setStatus("listening");start(); };
  const tap=()=>{
    if(status==="listening"&&listening){ stop(); return; }
    // Si el mic se auto-cortó hace <700ms, este toque era para "detener": no reiniciar
    if(Date.now()-endGuard.current<700) return;
    begin();
  };
  const tw=normEn(target).split(" ").filter(Boolean);
  const hw=new Set(normEn(heard).split(" ").filter(Boolean));
  const hits=tw.filter(w=>hw.has(w)).length;
  const score=tw.length?Math.round(hits/tw.length*100):0;
  const color=score>=80?C.green:score>=50?"#E8A020":C.coral;
  const msg=score>=80?"¡Excelente pronunciación! 🎉":score>=50?"Bien — repite las palabras en rojo.":"Escucha de nuevo e inténtalo otra vez.";
  const label=status==="listening"?"⏹ Detener":status==="done"?"🎤 Otra vez":status==="empty"?"🎤 Reintentar":"🎤 Pronunciar";
  return(
    <div style={{marginTop:10,background:C.paper,borderRadius:12,padding:"10px 12px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <button onClick={tap}
          style={{padding:"7px 12px",borderRadius:999,border:`1.5px solid ${status==="listening"?C.coral:C.blue}`,background:status==="listening"?C.coralSoft:C.blueSoft,color:status==="listening"?C.coral:C.blue,fontWeight:700,fontSize:13}}>
          {label}
        </button>
        {status==="listening"&&<span style={{fontSize:13,color:C.inkSoft}}>🎙️ Te escucho — habla ahora…</span>}
        {status==="done"&&<span style={{fontWeight:700,color,fontSize:16}}>{score}%</span>}
      </div>
      {status==="listening"&&heard&&(
        <p style={{margin:"8px 0 0",fontSize:13,color:C.inkSoft,fontStyle:"italic"}}>"{heard}"</p>
      )}
      {status==="done"&&(
        <div className="fadein" style={{marginTop:8}}>
          <p style={{margin:0,fontSize:15,lineHeight:1.6,fontFamily:FEN}}>
            {tw.map((w,i)=><span key={i} style={{color:hw.has(w)?C.green:C.coral,fontWeight:hw.has(w)?400:700,marginRight:5}}>{w}</span>)}
          </p>
          <p style={{margin:"4px 0 0",fontSize:12,color:C.inkSoft}}>{msg} <span style={{fontStyle:"italic"}}>Escuché: "{heard}"</span></p>
        </div>
      )}
      {status==="empty"&&(
        <p className="fadein" style={{margin:"8px 0 0",fontSize:12,color:C.inkSoft}}>🤔 No capté tu voz. Toca <strong>Reintentar</strong> y habla apenas aparezca "te escucho" — fuerte y cerca del micrófono.</p>
      )}
      {status==="denied"&&(
        <p className="fadein" style={{margin:"8px 0 0",fontSize:12,color:C.coral}}>🎙️ Chrome bloqueó el micrófono. Actívalo en el candado de la barra de direcciones → Permisos → Micrófono.</p>
      )}
    </div>
  );
}

function talkLoad(){try{return JSON.parse(sessionStorage.getItem("fluido-talk")||"null");}catch(e){return null;}}
function talkSave(d){try{sessionStorage.setItem("fluido-talk",JSON.stringify(d));}catch(e){}}
function Talk({state,registerActivity}){
  const saved=talkLoad();
  const [scenario,setScenario]=useState(saved?.scenario||null);
  const [messages,setMessages]=useState(saved?.messages||[]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [showCustom,setShowCustom]=useState(false);
  const [customSuggestion,setCustomSuggestion]=useState("");
  const [revealed,setRevealed]=useState({}); // pistas de traducción reveladas por índice
  const [voiceMode,setVoiceMode]=useState(false);
  const bottomRef=useRef(null);
  const {speak,failed}=useSpeech();
  const {supported:micOk,listening,start:micStart,stop:micStop}=useSpeechRec((text)=>setInput(text));
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);
  useEffect(()=>{ if(scenario) talkSave({scenario,messages}); },[scenario,messages]);

  const newScenario=async(suggestion)=>{
    setLoading(true);setError(null);setMessages([]);setScenario(null);setShowCustom(false);
    try{sessionStorage.removeItem("fluido-talk");}catch(e){}
    try{
      const basePrompt=suggestion
        ? `El estudiante quiere practicar este escenario específico: "${suggestion}"\n\nAdáptalo según su perfil: ${profileForPrompts(state,true)}\n\nDevuelve JSON: {"title_es":"título corto","context_es":"contexto 1-2 frases, quién es el estudiante y el interlocutor","opening_en":"primer mensaje del interlocutor en inglés adecuado al nivel"}`
        : `Perfil: ${profileForPrompts(state,true)}\n\nGenera una situación de práctica PERSONALIZADA: usa su ocupación, objetivos y a veces sus intereses. Varía el contexto (semilla: ${Math.random().toString(36).slice(2)}).\nIMPORTANTE: el inglés de opening_en debe ajustarse EXACTAMENTE a la complejidad del nivel indicado arriba.\n\nDevuelve JSON: {"title_es":"título corto","context_es":"contexto 1-2 frases","opening_en":"primer mensaje del interlocutor en inglés AJUSTADO AL NIVEL"}`;
      const a0 = state.level==="A0" ? '\nNIVEL A0 (principiante absoluto): usa inglés ULTRA simple (frases de 3-8 palabras, vocabulario básico) y AGREGA el campo "opening_es" con la traducción al español de opening_en.' : "";
      const data=await askAI_JSON(basePrompt+a0,"Eres un profesor de inglés que crea simulaciones realistas y motivantes.");
      setScenario(data);setMessages([{role:"them",text:data.opening_en,es:data.opening_es||null}]);
      if(voiceMode) setTimeout(()=>speak(data.opening_en),300);
    }catch(e){setError(e.userMsg||(e.code==="NO_KEY"?"Configura tu clave en Ajustes.":"Error generando situación."));}
    setLoading(false);
  };

  const send=async()=>{
    const text=input.trim(); if(!text||loading) return;
    if(listening) micStop();
    setInput("");setLoading(true);setError(null);
    const myMsg={role:"me",text};
    setMessages(m=>[...m,myMsg]);
    try{
      const history=[...messages,myMsg].map(m=>(m.role==="them"?"INTERLOCUTOR: ":"ESTUDIANTE: ")+m.text).join("\n");
      const data=await askAI_JSON(
        `Perfil: ${profileForPrompts(state,true)}\nSituación: ${scenario.context_es}\n\nConversación:\n${history}\n\nCorrige errores, da versión natural y continúa como interlocutor.\n\nDevuelve JSON: {"errors":[{"wrong":"error","right":"corrección","why_es":"explicación"}],"natural_en":"versión nativa o null","tip_es":"consejo breve o null","reply_en":"respuesta del interlocutor que invite a seguir, AJUSTADA a la complejidad del nivel indicado en el perfil"${state.level==="A0"?',"reply_es":"traducción al español de reply_en"':""}}`,
        "Eres un coach de inglés cálido y preciso. Corriges sin desanimar.");
      setMessages(m=>{const c=[...m];c[c.length-1]={...myMsg,feedback:data};return[...c,{role:"them",text:data.reply_en,es:data.reply_es||null}];});
      if(voiceMode) setTimeout(()=>speak(data.reply_en),300);
      recordPerf("talk", state.level, !(data.errors&&data.errors.length>0));
      registerActivity("talk");
    }catch(e){setError(e.userMsg||"Problema al enviar. Intenta de nuevo.");setMessages(m=>m.slice(0,-1));setInput(text);}
    setLoading(false);
  };

  return(
    <div className="fadein" style={{display:"flex",flexDirection:"column",minHeight:"calc(100vh - 140px)"}}>
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Conversar</h2>

        {micOk&&(
          <button onClick={()=>setVoiceMode(v=>!v)}
            style={{flexShrink:0,padding:"7px 14px",borderRadius:999,border:`1.5px solid ${voiceMode?C.coral:C.blue}`,background:voiceMode?C.coralSoft:C.blueSoft,color:voiceMode?C.coral:C.blue,fontWeight:700,fontSize:13}}>

      </div>
      {voiceMode&&(
        <p style={{fontSize:12,color:C.inkSoft,margin:"-6px 0 12px",lineHeight:1.5}}>

              <BigButton onClick={()=>newScenario(null)}>🎲 Situación aleatoria</BigButton>
              <button onClick={()=>setShowCustom(true)}
                style={{width:"100%",marginTop:10,padding:"13px 18px",borderRadius:14,border:`1.5px solid ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15}}>
                ✏️ Proponer mi propio escenario

              {(()=>{const pt=loadPersonalTopics().topics;if(!pt.length)return null;return(
                <div style={{marginTop:14}}>
                  <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5,margin:"0 0 8px"}}>✨ O conversa sobre tus temas</p>

            <button onClick={()=>{setScenario(null);setMessages([]);setShowCustom(true);setCustomSuggestion("");}} style={{background:"transparent",border:"none",color:C.blue,fontSize:13,textDecoration:"underline"}}>✏️ Proponer escenario</button>
          </div>
        </div>
      )}
    </div>
  );
}
function Feedback({fb}){
  const hasErrors=fb.errors&&fb.errors.length>0;
  if(!hasErrors&&!fb.natural_en&&!fb.tip_es) return<div style={{maxWidth:"85%",marginLeft:"auto",marginTop:4,fontSize:13,color:C.green,textAlign:"right"}}>✓ Perfecto, así se dice</div>;

    <div className="fadein" style={{maxWidth:"92%",marginLeft:"auto",marginTop:6,background:C.card,border:`1px dashed ${C.line}`,borderRadius:12,padding:"10px 12px",fontSize:14}}>
      {hasErrors&&fb.errors.map((e,i)=>(<p key={i} style={{margin:"0 0 6px",lineHeight:1.6}}><span className="hl-red" style={{fontFamily:FEN}}>{e.wrong}</span>{" → "}<span className="hl-green" style={{fontFamily:FEN}}>{e.right}</span><br/><span style={{color:C.inkSoft,fontSize:13}}>{e.why_es}</span></p>))}
      {fb.natural_en&&<div style={{margin:"8px 0 0"}}><span style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1}}>Versión natural</span><div style={{marginTop:4,padding:"8px 12px",background:C.blueSoft,borderRadius:10,fontFamily:FEN,fontSize:16,color:C.ink,borderLeft:`3px solid ${C.blue}`}}>{fb.natural_en}</div></div>}
      {fb.tip_es&&<p style={{margin:"8px 0 0",fontSize:13,color:C.blue}}>💡 {fb.tip_es}</p>}
    </div>
  );
}

function Phrases({state,save,registerActivity,initialMode}){
  const [mode,setMode]=useState(initialMode||(state.level==='A0'?'vocab':'cards'));
  const [flipped,setFlipped]=useState(false);
  const [generating,setGenerating]=useState(false);
  const [error,setError]=useState(null);
  const [info,setInfo]=useState(null);
  const {speak,failed}=useSpeech();
  const now=Date.now();
  const due=state.deck.filter(c=>c.due<=now).sort((a,b)=>a.due-b.due);
  const card=due[0];
  const grade=g=>{
    const deck=state.deck.map(c=>{
      if(c.id!==card.id) return c;
      const nx=srsNext(c,g);
      return{...c,...nx,seen:c.seen+1};
    });
    setFlipped(false);registerActivity("phrases",{deck});
  };
  const [showScenario,setShowScenario]=useState(false);
  const [scenarioText,setScenarioText]=useState("");
  const generateMore=async(scenario)=>{
    setGenerating(true);setError(null);setInfo(null);
    try{
      const need=5;
      const scenarioPrompt=scenario?`Las frases deben ocurrir en este escenario/contexto específico: "${scenario}". `:"";
      const arr=await askAI_JSON(`Perfil (sin nombre): ${profileForPrompts(state,false)}\n\n${scenarioPrompt}Genera ${need} frases nuevas útiles para este perfil, con dificultad de inglés ajustada EXACTAMENTE al nivel indicado en el perfil. NO repitas: ${state.deck.map(c=>c.en).slice(-40).join(" | ")}\n\nDevuelve JSON array: [{"es":"español","en":"inglés","note_es":"nota breve"}]`,
        "Eres un profesor de inglés práctico.");
      const existing=new Set(state.deck.map(c=>(c.en||"").toLowerCase().trim()));
      const newPhrases=arr.map(p=>({es:p.es,en:p.en,note_es:p.note_es||""})).filter(p=>p.en&&!existing.has(p.en.toLowerCase().trim()));
      if(!newPhrases.length) throw Object.assign(new Error("dup"),{userMsg:"La IA devolvió frases que ya tienes en el mazo. Prueba con un escenario distinto."});
      const bank=loadBank();
      bank.phrases=[...bank.phrases,...newPhrases];
      saveBank(bank);
      save({...state,deck:[...state.deck,...newPhrases.slice(0,5).map((p,i)=>({id:"g"+Date.now()+i,es:p.es,en:p.en,note:p.note_es||"",interval:0,due:0,seen:0}))]});
      setShowScenario(false);setScenarioText("");
    }catch(e){setError(e.userMsg||"No pude conseguir frases. Intenta de nuevo.");}
    setGenerating(false);
  };
  return(
    <div className="fadein">
      <h2 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Frases</h2>
      {/* Mode switcher */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {(state.level==="A0"
          ? [{id:"vocab",l:"🔠 Vocab"},{id:"verbs",l:"🔤 Verbos"},{id:"grammar",l:"📝 Quiz"},{id:"cards",l:"📚 Frases"}]
          : [{id:"cards",l:"📚 Frases"},{id:"grammar",l:"📝 Quiz"},{id:"verbs",l:"🔤 Verbos"},{id:"vocab",l:"🔠 Vocab"}]
        ).map(m=>(
          <button key={m.id} onClick={()=>setMode(m.id)}
            style={{flex:1,padding:"8px 4px",borderRadius:10,border:`1.5px solid ${mode===m.id?C.blue:C.line}`,background:mode===m.id?C.blueSoft:"transparent",color:mode===m.id?C.blue:C.inkSoft,fontWeight:600,fontSize:11}}>
            {m.l}
          </button>))}
      </div>
      {mode==="grammar" && <Grammar state={state} registerActivity={registerActivity}/>}
      {mode==="verbs"   && <Verbs registerActivity={registerActivity} state={state}/>}
      {mode==="vocab"   && <Vocabulary registerActivity={registerActivity} state={state}/>}
      {mode==="cards" && (<div>
      <p style={{marginBottom:14,fontSize:14,color:C.inkSoft}}>Lee el español, <span className="hl">dilo en voz alta en inglés</span>, y recién ahí voltea la tarjeta.</p>
      <div style={{display:"flex",gap:10,marginBottom:14,fontSize:13,color:C.inkSoft}}>
        <span>📚 {state.deck.length} en tu mazo</span><span>⏰ {due.length} por repasar</span>
      </div>
      {card?(
        <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:18,padding:22,minHeight:220,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
          <div>
            <p style={{fontSize:12,color:C.inkSoft,textTransform:"uppercase",letterSpacing:1.5}}>{flipped?"En inglés se dice":"¿Cómo dirías…?"}</p>
            <p style={{fontSize:21,fontWeight:500,margin:"10px 0",lineHeight:1.4}}>{card.es}</p>
            {flipped&&(
              <div className="fadein">
                <p style={{fontFamily:FEN,fontSize:23,margin:"6px 0",lineHeight:1.4}}>
                  <span className="hl">{card.en}</span>{" "}
                  <button onClick={()=>speak(card.en)} aria-label="Escuchar" style={{border:"none",background:"transparent",fontSize:20}}>🔊</button>
                </p>
                <p style={{fontSize:13,color:C.inkSoft,margin:"8px 0 0"}}>{card.note}</p>
                {failed&&<AudioWarning/>}
                <PronounceCheck target={card.en}/>
              </div>
            )}
          </div>
          {!flipped?<BigButton onClick={()=>{setFlipped(true);if(!isSilent())speak(card.en);}}>Mostrar respuesta</BigButton>:(
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <GradeBtn color={C.coral} bg={C.coralSoft} onClick={()=>grade("again")} label="Otra vez" sub="en 10 min"/>
              <GradeBtn color={C.blue} bg={C.blueSoft} onClick={()=>grade("good")} label="Bien" sub={srsPreview(card,"good")}/>
              <GradeBtn color={C.green} bg={C.greenSoft} onClick={()=>grade("easy")} label="Fácil" sub={srsPreview(card,"easy")}/>
            </div>)}
        </div>
      ):(
        <div style={{background:C.greenSoft,border:`1px solid ${C.green}`,borderRadius:18,padding:22,textAlign:"center"}}>
          <p style={{fontWeight:600,color:C.green,marginBottom:4}}>✓ Mazo al día</p>
          <p style={{fontSize:14,color:C.inkSoft}}>No hay tarjetas pendientes ahora.</p>
        </div>
      )}
      <button onClick={()=>generateMore()} disabled={generating}
        style={{width:"100%",marginTop:14,padding:14,borderRadius:14,border:`2px dashed ${C.blue}`,background:"transparent",color:C.blue,fontWeight:600,fontSize:15,opacity:generating?0.6:1}}>
        {generating&&!showScenario?"✨ Generando…":"✨ Agregar 5 frases nuevas"}
      </button>
      <button onClick={()=>setShowScenario(v=>!v)} disabled={generating}
        style={{width:"100%",marginTop:8,padding:14,borderRadius:14,border:`2px dashed ${C.green}`,background:showScenario?C.greenSoft:"transparent",color:C.green,fontWeight:600,fontSize:15,opacity:generating?0.6:1}}>
        🎬 Generar por escenario
      </button>
      {showScenario&&(
        <div className="fadein" style={{marginTop:10,display:"flex",flexDirection:"column",gap:8}}>
          <input value={scenarioText} onChange={e=>setScenarioText(e.target.value)}
            placeholder="Ej: pedir comida en un restaurante, entrevista de trabajo, en el aeropuerto…"
            style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.line}`,background:C.card,color:C.ink,fontSize:14}}/>
          <button onClick={()=>scenarioText.trim()&&generateMore(scenarioText.trim())} disabled={generating||!scenarioText.trim()}
            style={{width:"100%",padding:12,borderRadius:12,border:"none",background:C.green,color:"#fff",fontWeight:700,fontSize:14,opacity:(generating||!scenarioText.trim())?0.6:1}}>
            {generating?"✨ Generando…":"Generar 5 frases de este escenario"}
          </button>
        </div>
      )}
      {info&&<p style={{color:C.green,fontSize:13,marginTop:8}}>{info}</p>}
      {error&&<p style={{color:C.coral,fontSize:14,marginTop:8}}>{error}</p>}
      </div>)}
    </div>
  );
}
function GradeBtn({color,bg,onClick,label,sub}){return(<button onClick={onClick} style={{flex:1,padding:"10px 4px",borderRadius:12,border:`1.5px solid ${color}`,background:bg,color,fontWeight:600,fontSize:14}}>{label}<div style={{fontSize:10,fontWeight:400,marginTop:2,opacity:0.8}}>{sub}</div></button>);}
